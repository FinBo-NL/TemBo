<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tembo</title>
<style>
  /* Tembo — zelfde opbouw als FinBo (chrome = --ink, kaarten = --paper, --text-onink hoort bij --ink),
     maar met blauw als accent/belettering in plaats van groen. */
  :root{
    --ink:#fbfcfe;
    --ink-2:#f4f7fb;
    --paper:#ffffff;
    --paper-2:#eff3f9;
    --rule:#dfe5ee;
    --accent:#1f5fa8;
    --accent-bright:#2b7bd4;
    --deep:#1a4e8a;
    --warm:#b4532a;
    --debit:#b0463c;
    --text:#16202e;
    --text-soft:#5b6778;
    --text-onink:#16202e;
    --text-onink-soft:#5b6778;
    /* Grafiekkleuren (gevalideerd met de dataviz-validator): binnen = warm oranje, buiten = blauw;
       voor/na isolatie = violet/aqua. */
    --c-binnen:#eb6834;
    --c-buiten:#2a78d6;
    --c-voor:#4a3aa7;
    --c-na:#1baf7a;
    --grid:#e6ebf2;
    --good:#1f7a52;
    --bad:#b0463c;
    --k-vrij:#1baf7a;
    --k-verw:#eb6834;
    --k-koel:#2a78d6;
  }
  html[data-mode="dark"]{
    --ink:#0f1622;
    --ink-2:#0c121c;
    --paper:#151e2b;
    --paper-2:#1a2433;
    --rule:rgba(255,255,255,.09);
    --accent:#4f8fd9;
    --accent-bright:#6ea8ea;
    --deep:#6aa6e8;
    --warm:#f0906a;
    --debit:#e2897a;
    --text:#e6edf6;
    --text-soft:#9aa9bc;
    --text-onink:#e8eef7;
    --text-onink-soft:#9aa9bc;
    --c-binnen:#d95926;
    --c-buiten:#3987e5;
    --c-voor:#9085e9;
    --c-na:#199e70;
    --grid:rgba(255,255,255,.07);
    --good:#5fbf94;
    --bad:#e2897a;
    --k-vrij:#199e70;
    --k-verw:#d95926;
    --k-koel:#3987e5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:600; margin:0;}
  .mono{font-family:"Courier New",Consolas,monospace; font-variant-numeric:tabular-nums;}

  /* Header */
  header{
    position:sticky; top:0; z-index:60;
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    padding:12px 22px;
    border-bottom:3px solid var(--accent);
  }
  .header-top{display:flex; justify-content:space-between; align-items:center; gap:14px;}
  .header-main{text-align:center; flex:1; min-width:0;}
  header .eyebrow{color:var(--accent); font-weight:700; font-size:28px; margin-bottom:2px; letter-spacing:.01em;}
  header h1{color:var(--text-onink-soft); font-size:16px; font-weight:400; letter-spacing:.01em;}
  .icon-btn, .profile-btn, .mode-btn{
    width:34px; height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 20%, transparent);
    background:transparent; color:var(--text-onink-soft); cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover, .profile-btn:hover, .mode-btn:hover{color:var(--accent-bright); border-color:var(--accent-bright);}
  .icon-btn:focus-visible, .profile-btn:focus-visible{outline:2px solid var(--accent-bright); outline-offset:2px;}
  .icon-btn svg{width:18px; height:18px;}
  .profile-btn svg{width:17px; height:17px;}
  .mode-btn svg{width:16px; height:16px;}
  .profile-btn.active{border-color:var(--accent); color:var(--accent-bright); background:color-mix(in srgb, var(--accent) 14%, transparent);}

  /* Navigatielade (links) */
  .nav-backdrop, .profile-backdrop{
    position:fixed; inset:0; background:rgba(10,18,32,.42);
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .nav-backdrop{z-index:70;}
  .profile-backdrop{z-index:940;}
  html[data-mode="dark"] .nav-backdrop, html[data-mode="dark"] .profile-backdrop{background:rgba(0,0,0,.55);}
  .nav-backdrop.open, .profile-backdrop.open{opacity:1; pointer-events:auto;}
  .nav-drawer{
    position:fixed; top:0; left:0; bottom:0; z-index:80;
    width:290px; max-width:82vw;
    display:flex; flex-direction:column;
    background:var(--paper-2); border-right:1px solid var(--rule);
    box-shadow:0 18px 40px rgba(16,25,40,.18);
    transform:translateX(-100%); visibility:hidden;
    transition:transform .24s cubic-bezier(.4,0,.2,1), visibility 0s linear .24s;
  }
  .nav-drawer.open{transform:translateX(0); visibility:visible; transition-delay:0s;}
  .nav-drawer-head, .profile-panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0;
  }
  .nav-drawer-head{padding:12px 14px; border-bottom:1px solid var(--rule);}
  .nav-drawer-title{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-soft); font-weight:600;}
  .nav-drawer .icon-btn{width:28px; height:28px;}
  .nav-drawer .icon-btn svg{width:15px; height:15px;}
  .tabs{display:flex; flex-direction:column; gap:18px; flex:1 1 auto; overflow-y:auto; padding:14px 12px 18px;}
  .tab-group{display:flex; flex-direction:column; gap:2px;}
  .tab-group-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; padding:0 14px;}
  .tab-group-label{color:var(--text-onink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; flex:1;}
  .tab-group-head.collapsible{cursor:pointer;}
  .tab-group-head.collapsible:hover .tab-group-label{color:var(--accent-bright);}
  .group-collapse-btn{
    width:20px; height:20px; border-radius:50%; padding:0;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent; color:var(--text-onink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .group-collapse-btn:hover{border-color:var(--accent); color:var(--accent-bright);}
  .group-collapse-btn svg{width:12px; height:12px; transition:transform .15s ease;}
  .group-collapse-btn.collapsed svg{transform:rotate(-90deg);}
  .tab{
    display:flex; align-items:center; justify-content:space-between; text-align:left;
    background:transparent; border:none; border-left:3px solid transparent;
    color:var(--text-onink-soft); font-family:Georgia,serif; font-size:14px;
    padding:10px 14px; cursor:pointer; white-space:nowrap;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .tab:hover{color:var(--text-onink); background:color-mix(in srgb, var(--text-onink) 4%, transparent);}
  .tab.active{color:var(--accent-bright); border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .tab .tab-count{font-family:"Segoe UI",sans-serif; font-size:11px; opacity:.6;}
  .tab-upload{
    border:1px dashed color-mix(in srgb, var(--text-onink) 30%, transparent); border-radius:3px;
    color:var(--accent-bright); font-family:"Segoe UI",sans-serif; font-size:12.5px; justify-content:center; gap:8px;
  }
  .tab-upload svg{width:14px; height:14px;}
  .tab-upload:hover, .tab-upload.active{background:color-mix(in srgb, var(--accent) 8%, transparent); border-color:var(--accent);}

  /* Profielpaneel (rechts) */
  .profile-panel{
    position:fixed; top:0; right:0; height:100vh;
    width:30vw; min-width:min(320px, 92vw); max-width:460px;
    background:var(--paper); border-left:1px solid var(--rule);
    box-shadow:-2px 0 28px rgba(0,0,0,.18); z-index:950;
    display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .3s cubic-bezier(.4,0,.2,1), visibility 0s linear .3s;
  }
  .profile-panel.open{transform:translateX(0); visibility:visible; transition-delay:0s;}
  @media (prefers-reduced-motion: reduce){ .nav-drawer,.nav-backdrop,.profile-panel,.profile-backdrop{transition:none;} }
  .profile-panel-head{
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    border-bottom:3px solid var(--accent); padding:16px 16px 14px 20px; flex-wrap:wrap;
  }
  .profile-panel-title{font-family:Georgia,serif; font-weight:600; font-size:18px; color:var(--text-onink); flex:1 1 auto;}
  .profile-panel-head-controls{display:flex; align-items:center; gap:8px;}
  .lang-toggle{display:flex; gap:4px;}
  .lang-btn{
    background:transparent; border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft); padding:5px 11px; font-size:11px; letter-spacing:.06em; border-radius:3px; cursor:pointer;
  }
  .lang-btn:hover{border-color:var(--accent); color:var(--accent-bright);}
  .lang-btn.active{border-color:var(--accent); color:var(--accent-bright); background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .profile-close-btn{
    width:30px; height:30px; border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent; color:var(--text-onink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .profile-close-btn:hover{border-color:var(--debit); color:var(--debit);}
  .profile-close-btn svg{width:15px; height:15px;}
  .profile-panel-tabs{display:flex; gap:4px; padding:14px 20px 0; border-bottom:1px solid var(--rule);}
  .profile-tab-btn{
    background:transparent; border:none; border-bottom:2px solid transparent; color:var(--text-soft);
    padding:8px 4px 10px; margin-right:18px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .profile-tab-btn:hover{color:var(--text);}
  .profile-tab-btn.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
  .profile-panel-body{flex:1 1 auto; overflow-y:auto; padding:22px 20px 28px; display:flex; flex-direction:column; gap:26px;}
  .profile-section-title{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-soft); margin:0 0 4px;}
  .profile-current-email{font-size:14px; background:var(--paper-2); border:1px solid var(--rule); border-radius:5px; padding:9px 11px; word-break:break-all;}
  .profile-field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-soft); margin-top:10px;}
  .profile-field input, .profile-field select{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);
  }
  .profile-field input:focus, .profile-field select:focus{outline:none; border-color:var(--accent);}
  .profile-panel-body button{
    font-family:inherit; font-size:13px; padding:8px 12px; border-radius:4px;
    border:1px solid var(--rule); background:transparent; color:var(--text); cursor:pointer; margin-top:12px;
  }
  .profile-panel-body button.primary{background:var(--deep); border-color:var(--deep); color:#fff;}
  html[data-mode="dark"] .profile-panel-body button.primary{color:#0c121c;}
  .profile-panel-body button:disabled{opacity:.6; cursor:default;}
  .profile-msg{font-size:12px; border-radius:4px; padding:8px 10px; margin-top:10px;}
  .profile-msg.error{color:var(--debit); background:color-mix(in srgb, var(--debit) 12%, transparent);}
  .profile-msg.notice{color:var(--deep); background:color-mix(in srgb, var(--deep) 12%, transparent);}
  .profile-hint{font-size:11.5px; color:var(--text-soft); line-height:1.5; margin:4px 0 0;}
  .profile-divider{border:none; border-top:1px solid var(--rule); margin:0;}
  .loc-search-row{display:flex; gap:8px; margin-top:10px;}
  .loc-search-row input{flex:1; min-width:0; font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);}
  .loc-search-row input:focus{outline:none; border-color:var(--accent);}
  .loc-search-row button{margin-top:0 !important;}
  .loc-results{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
  .loc-results button{margin-top:0 !important; text-align:left; font-size:13px;}
  .loc-results button:hover{border-color:var(--accent); color:var(--accent);}
  .loc-src{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:3px; padding:1px 5px; margin-right:7px; vertical-align:1px;}
  .loc-results .none{font-size:12px; color:var(--text-soft);}
  .loc-btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .profile-check{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--text); margin-top:12px; line-height:1.4;}
  .neg-wrap{display:flex; gap:4px;}
  .neg-wrap input{flex:1; min-width:0;}
  .neg-btn{flex:0 0 34px; font-family:inherit; font-size:15px; border:1px solid var(--rule); border-radius:4px; background:var(--paper-2); color:var(--text-soft); cursor:pointer;}
  .neg-btn:hover{border-color:var(--accent); color:var(--accent);}
  .src-choice{display:inline-flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden; margin-top:4px; align-self:flex-start;}
  .src-choice button{font-family:inherit; font-size:11px; padding:4px 9px; border:none; background:transparent; color:var(--text-soft); cursor:pointer;}
  .src-choice button + button{border-left:1px solid var(--rule);}
  .src-choice button.on{background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); font-weight:600;}
  #fBuiten[readonly]{background:var(--paper-2); color:var(--accent);}
  #fBuiten[readonly] + .neg-btn{opacity:.4; cursor:default;}
  .online-was{font-size:10px; color:var(--text-soft); font-family:"Courier New",monospace; white-space:nowrap;}
  .buiten-cell .t-num{width:56px;}
  .src-hint{font-size:10.5px; color:var(--text-soft); min-height:13px; line-height:1.3;}
  .src-hint.online{color:var(--accent);}
  .src-hint.err{color:var(--debit);}
  .buiten-cell{display:inline-flex; align-items:center; gap:4px; justify-content:flex-end;}
  .online-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  /* Layout */
  .layout{display:grid; grid-template-columns:minmax(0,1fr) 380px; align-items:start;}
  main.categories, aside.summary{min-width:0;}
  main.categories{padding:28px 24px 60px 32px;}
  @media (max-width:980px){
    .layout{grid-template-columns:minmax(0,1fr);}
    aside.summary{position:static !important; min-height:0 !important; border-left:none !important; border-top:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);}
  }
  @media (max-width:640px){
    header{padding:12px 14px;}
    header .eyebrow{font-size:24px;}
    header h1{font-size:14px;}
    main.categories{padding:18px 14px 36px;}
    aside.summary{padding:20px 16px 32px !important;}
    .card-head{padding:9px 14px 7px !important;}
    .card-body{padding:12px 14px !important;}
  }

  .card{background:var(--paper); border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:2px; margin-bottom:20px; box-shadow:0 1px 0 rgba(0,0,0,.04);}
  .card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 18px 8px; border-bottom:1px solid color-mix(in srgb, var(--accent) 30%, var(--rule));
    background:color-mix(in srgb, var(--accent) 9%, var(--paper-2));
  }
  .card-head .htitle{display:flex; align-items:center; gap:9px; color:var(--deep); min-width:0;}
  .card-head h2{font-size:15px; color:inherit;}
  .card-head .head-extra{font-size:12px; color:var(--text-soft);}
  .cat-icon{width:17px; height:17px; flex-shrink:0;}
  .card-body{padding:14px 18px 16px;}
  .card-note{font-size:12px; color:var(--text-soft); line-height:1.55; margin:0;}

  /* Invoerformulier */
  .entry-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px;}
  .entry-grid label, .import-box label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-soft); letter-spacing:.02em;}
  .entry-grid input, .entry-grid select, .rtable input, .rtable select{
    font-family:inherit; font-size:14px; padding:7px 9px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text); min-width:0; width:100%;
  }
  .entry-grid input:focus, .entry-grid select:focus, .rtable input:focus, .rtable select:focus{outline:none; border-color:var(--accent);}
  .entry-grid .wide{grid-column:1 / -1;}
  .entry-actions{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap;}
  .btn{
    font-family:inherit; font-size:13px; padding:8px 14px; border-radius:4px; cursor:pointer;
    border:1px solid var(--rule); background:transparent; color:var(--text);
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--deep); border-color:var(--deep); color:#fff;}
  html[data-mode="dark"] .btn.primary{color:#0c121c;}
  .btn.primary:hover{opacity:.9; color:#fff;}
  html[data-mode="dark"] .btn.primary:hover{color:#0c121c;}
  .form-msg{font-size:12px;}
  .form-msg.ok{color:var(--deep);}
  .form-msg.err{color:var(--debit);}

  /* Grafieken */
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text-soft); margin:0 0 8px;}
  .chart-legend .key{display:inline-flex; align-items:center; gap:6px;}
  .chart-legend .sw{width:14px; height:3px; border-radius:2px;}
  .chart-legend .sw.dot{width:9px; height:9px; border-radius:50%;}
  .chart-legend .sw.dash{height:0; border-top:2px dashed var(--text-soft); background:none;}
  .chart-wrap{position:relative; width:100%;}
  .chart-wrap svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart-wrap text{font-family:"Segoe UI",system-ui,sans-serif; font-size:11px; fill:var(--text-soft);}
  .chart-wrap .lbl-strong{fill:var(--text); font-weight:600;}
  .chart-tooltip{
    position:absolute; pointer-events:none; z-index:5;
    background:var(--paper); border:1px solid var(--rule); border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.12); padding:8px 10px; font-size:12px; color:var(--text);
    min-width:150px; opacity:0; transition:opacity .1s;
  }
  .chart-tooltip .tt-head{font-weight:600; margin-bottom:4px;}
  .chart-tooltip .tt-row{display:flex; align-items:center; gap:7px; justify-content:space-between;}
  .chart-tooltip .tt-row span:first-child{display:inline-flex; align-items:center; gap:6px; color:var(--text-soft);}
  .chart-tooltip .tt-key{width:9px; height:9px; border-radius:50%;}
  .chart-tooltip .tt-val{font-family:"Courier New",monospace; font-weight:700;}
  .chart-empty{font-size:13px; color:var(--text-soft); padding:22px 0; text-align:center;}

  /* Klimaat */
  .klimaat-box{border:1px solid var(--rule); border-radius:6px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; background:var(--paper-2);}
  .klimaat-title{font-size:11.5px; color:var(--text-soft); letter-spacing:.02em;}
  .klimaat-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .klimaat-sys{width:44px; font-size:12px; font-weight:600; color:var(--deep);}
  .sp-field{display:inline-flex !important; flex-direction:row !important; align-items:center; gap:6px !important; font-size:12px !important;}
  .sp-field[hidden]{display:none !important;}
  .sp-field input{width:64px !important; padding:5px 7px !important; font-size:13px !important;}
  .klimaat-hint{font-size:11px; color:var(--text-soft); margin:0;}
  .kcell{min-width:170px;}
  .krow{display:flex; align-items:center; gap:4px;}
  .krow .ksys{width:34px; font-size:10.5px; color:var(--text-soft);}
  .krow select{width:auto !important; font-size:12px !important; padding:3px 4px !important;}
  .rtable input.t-sp{width:48px; font-size:12px; padding:3px 5px; text-align:right;}
  .reg-tag{display:inline-block; margin-top:3px; font-size:10px; padding:1px 7px; border-radius:20px; color:var(--text-soft); background:color-mix(in srgb, var(--text-soft) 14%, transparent); cursor:help; white-space:nowrap;}
  .reg-tag.gehaald{color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .reg-tag.niet{color:var(--warm); background:color-mix(in srgb, var(--warm) 13%, transparent);}
  .chart-legend .sw.dashc{width:18px; height:0; border-top:2px dashed; border-radius:0; background:none;}
  .chart-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px;}
  .tnav{display:inline-flex; align-items:center; gap:6px;}
  .tnav-btn{width:26px; height:26px; border-radius:50%; border:1px solid var(--rule); background:var(--paper); color:var(--text-soft); cursor:pointer; font-size:15px; line-height:1; padding:0;}
  .tnav-btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .tnav-btn:disabled{opacity:.35; cursor:default;}
  .tnav-label{font-size:12px; color:var(--text-soft); white-space:nowrap;}
  .now-lbl{fill:var(--accent) !important; font-weight:700;}
  .tc-zoom{touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none;}
  .tc-zoom:active{cursor:grabbing;}
  .zoom-hint{font-size:11px; color:var(--text-soft); margin:6px 0 0;}
  .tnav-reset{font-family:inherit; font-size:11px; padding:4px 9px; border-radius:12px; border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent); cursor:pointer;}
  .chart-legend .sw.band{height:9px; border-radius:2px;}
  .table-section-title{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); font-weight:600; margin:0 0 6px;}
  .month-group{border:1px solid var(--rule); border-radius:4px; margin-bottom:6px; background:var(--paper);}
  .month-group > summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; padding:9px 12px; font-size:13px; font-weight:600; color:var(--deep);}
  .month-group > summary::-webkit-details-marker{display:none;}
  .month-group > summary::before{content:"›"; display:inline-block; margin-right:8px; transition:transform .15s; color:var(--text-soft);}
  .month-group[open] > summary::before{transform:rotate(90deg);}
  .month-group > summary > span:first-child{flex:1;}
  .mg-count{font-size:11.5px; color:var(--text-soft); font-weight:400;}
  .month-group .table-scroll{padding:0 8px 8px;}
  .howto{margin-top:10px; font-size:12.5px; color:var(--text-soft); border-top:1px solid var(--rule); padding-top:8px;}
  .howto summary{cursor:pointer; color:var(--accent); font-weight:600; list-style:none; display:inline-flex; align-items:center; gap:6px;}
  .howto summary::-webkit-details-marker{display:none;}
  .howto summary::before{content:"?"; display:inline-flex; width:16px; height:16px; border-radius:50%; align-items:center; justify-content:center; font-size:10.5px; color:#fff; background:var(--accent);}
  html[data-mode="dark"] .howto summary::before{color:#0c121c;}
  .howto ul{margin:8px 0 2px; padding-left:18px; line-height:1.6;}
  .howto li{margin-bottom:4px;}
  .chart-legend .sw.hollow{background:transparent; border:2px solid var(--text-soft); width:9px; height:9px; box-sizing:border-box;}
  .ktable{min-width:0;}
  .summary-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .summary-grid > div{display:flex; flex-direction:column; gap:2px; border:1px solid var(--rule); border-radius:4px; padding:8px 10px;}
  .summary-grid .l{font-size:11px; color:var(--text-soft);}
  .summary-grid .v{font-size:16px; font-weight:700;}
  .stamp.k-verw{border-color:var(--k-verw);} .stamp.k-verw .stamp-label, .stamp.k-verw .stamp-value{color:var(--k-verw);}
  .stamp.k-koel{border-color:var(--k-koel);} .stamp.k-koel .stamp-label, .stamp.k-koel .stamp-value{color:var(--k-koel);}
  .summary-line .l .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px;}

  /* Conclusie */
  .conclusion{border:1px solid var(--rule); border-left:4px solid var(--text-onink-soft); border-radius:4px; padding:12px 14px; margin:4px 0 10px; background:color-mix(in srgb, var(--text-onink) 3%, transparent);}
  .conclusion.good{border-left-color:var(--good); background:color-mix(in srgb, var(--good) 8%, transparent);}
  .conclusion.bad{border-left-color:var(--bad); background:color-mix(in srgb, var(--bad) 8%, transparent);}
  .conclusion.neutral{border-left-color:var(--accent);}
  .con-head{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--text-onink);}
  .con-icon{display:inline-flex; width:20px; height:20px; border-radius:50%; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; color:#fff; background:var(--text-onink-soft);}
  .good .con-icon{background:var(--good);} .bad .con-icon{background:var(--bad);} .neutral .con-icon{background:var(--accent);}
  html[data-mode="dark"] .con-icon{color:#0c121c;}
  .conclusion p{margin:6px 0 0; font-size:12.5px; line-height:1.55; color:var(--text-onink-soft);}
  .con-conf{margin-top:8px; font-size:11.5px; color:var(--text-onink-soft);}
  .con-conf strong{color:var(--text-onink);}
  .pm{font-size:11px; color:var(--text-onink-soft);}
  .dp-con-list{display:flex; flex-direction:column; gap:2px;}
  .dp-con{display:flex; align-items:center; gap:8px; width:100%; text-align:left; font-family:inherit; font-size:12.5px; padding:6px 8px; border:1px solid transparent; border-radius:4px; background:transparent; color:var(--text-onink); cursor:pointer;}
  .dp-con:hover{border-color:var(--rule);}
  .dp-con.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .dp-con .con-icon{width:16px; height:16px; font-size:10px;}
  .dp-con .l{flex:0 0 70px;}
  .dp-con .v{flex:1; text-align:right; color:var(--text-onink-soft); font-family:"Courier New",monospace; font-size:11.5px;}
  .dp-con.insufficient .con-icon{background:var(--rule); color:var(--text-onink-soft);}

  /* Dagdeel-filter & segmentknoppen */
  .filter-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px;}
  .filter-label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-soft);}
  .filter-hint{font-size:11px; color:var(--text-soft);}
  .seg{display:inline-flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden; background:var(--paper);}
  .seg button{font-family:inherit; font-size:12px; padding:5px 11px; border:none; background:transparent; color:var(--text-soft); cursor:pointer;}
  .seg button + button{border-left:1px solid var(--rule);}
  .seg button:hover:not(:disabled){color:var(--accent);}
  .seg button.on{background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); font-weight:600;}
  .seg button:disabled{opacity:.45; cursor:default;}
  .seg.small button{font-size:11px; padding:3px 8px;}
  .dp-tag{font-size:11px; color:var(--text-soft); white-space:nowrap;}
  .small-num{font-size:12px; color:var(--text-soft);}
  .muted{color:var(--text-soft); font-size:12px;}
  .warn-dot{display:inline-flex; width:15px; height:15px; border-radius:50%; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; background:var(--warm); cursor:help;}
  /* Afkoeltest */
  .cool-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .cool-col-title{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--deep); margin-bottom:8px;}
  .cool-note{grid-column:1 / -1; display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-soft);}
  .cool-note input{font-family:inherit; font-size:14px; padding:7px 9px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);}
  .cool-grid .entry-grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));}
  @media (max-width:700px){ .cool-grid{grid-template-columns:1fr;} }
  .ctable{min-width:860px;}
  .ctable .mono{white-space:nowrap;}
  .ctable .pts{font-size:10px; color:var(--text-soft); margin-top:2px; white-space:nowrap;}
  .cand-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--rule);}
  .cand-row:first-of-type{border-top:none;}
  .cand-main{flex:1 1 240px; display:flex; flex-direction:column; gap:2px; font-size:13px;}
  .cand-sub{font-size:12px; color:var(--text-soft);}
  .new-badge{display:inline-block; margin-left:4px; font-size:10px; font-weight:700; color:#fff; background:var(--warm); border-radius:10px; padding:0 6px;}
  .ctable td.stack{display:flex; flex-direction:column; gap:2px;}
  .ctable .phase:not(.voor):not(.na){color:var(--warm); background:color-mix(in srgb, var(--warm) 13%, transparent);}

  /* Metingentabel */
  .table-scroll{overflow-x:auto; margin:0 -4px;}
  .rtable{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  .rtable th{
    text-align:left; font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-soft); padding:6px 4px; border-bottom:1px solid var(--rule); white-space:nowrap;
  }
  .rtable th.num, .rtable td.num{text-align:right;}
  .rtable td{padding:4px; border-bottom:1px solid var(--rule); vertical-align:middle;}
  .rtable tr:last-child td{border-bottom:none;}
  .rtable input, .rtable select{font-size:13px; padding:5px 6px; border-color:transparent; background:transparent;}
  .rtable input:hover, .rtable select:hover{border-color:var(--rule);}
  .rtable input.t-num{width:70px; text-align:right; font-family:"Courier New",monospace;}
  .rtable input.t-date{width:150px;}
  .rtable input.t-time{width:118px;}
  .rtable .delta{font-family:"Courier New",monospace; font-weight:700; white-space:nowrap;}
  .rtable .phase{font-size:10px; padding:2px 7px; border-radius:20px; white-space:nowrap; font-weight:600;}
  .phase.voor{color:var(--c-voor); background:color-mix(in srgb, var(--c-voor) 13%, transparent);}
  .phase.na{color:var(--c-na); background:color-mix(in srgb, var(--c-na) 14%, transparent);}
  .row-del{
    width:24px; height:24px; border-radius:50%; padding:0; cursor:pointer;
    border:1px solid transparent; background:transparent; color:var(--text-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .row-del:hover{border-color:var(--debit); color:var(--debit); background:color-mix(in srgb, var(--debit) 10%, transparent);}
  .row-del svg{width:13px; height:13px;}

  /* Import */
  .import-drop{
    border:1.5px dashed color-mix(in srgb, var(--accent) 50%, var(--rule)); border-radius:6px;
    padding:26px 18px; text-align:center; color:var(--text-soft); font-size:13px; cursor:pointer;
    background:color-mix(in srgb, var(--accent) 4%, transparent);
  }
  .import-drop:hover, .import-drop.drag{border-color:var(--accent); color:var(--accent);}
  .import-drop strong{color:var(--accent); display:block; font-size:14px; margin-bottom:4px;}
  .import-result{margin-top:14px; font-size:13px; line-height:1.6;}

  /* Samenvatting rechts */
  aside.summary{
    position:sticky; top:62px; background:var(--ink); color:var(--text-onink);
    padding:28px 24px 40px; min-height:calc(100vh - 62px);
    border-left:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
  }
  aside.summary h2{font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-onink-soft); margin-bottom:16px; font-family:"Segoe UI",sans-serif;}
  aside.summary h3{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-onink-soft); margin:26px 0 8px; font-family:"Segoe UI",sans-serif;}
  .stamp{border:2px solid var(--accent); border-radius:4px; padding:16px 18px; margin-bottom:22px; transform:rotate(-0.4deg);}
  .stamp-row{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:22px;}
  .stamp-row .stamp{flex:1 1 140px; min-width:140px; margin-bottom:0; padding:12px 14px;}
  .stamp.voor{border-color:var(--c-voor);}
  .stamp.na{border-color:var(--c-na);}
  .stamp .stamp-label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-bright); margin-bottom:4px;}
  .stamp .stamp-value{font-size:clamp(24px, 7vw, 32px); font-family:"Courier New",Consolas,monospace; font-weight:700; color:var(--accent-bright);}
  .stamp-row .stamp-value{font-size:22px;}
  .stamp.voor .stamp-label, .stamp.voor .stamp-value{color:var(--c-voor);}
  .stamp.na .stamp-label, .stamp.na .stamp-value{color:var(--c-na);}
  .stamp .stamp-sub{font-size:11.5px; color:var(--text-onink-soft); margin-top:4px; line-height:1.45;}
  .summary-line{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:6px 0; border-bottom:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent); font-size:13.5px;
  }
  .summary-line .l{color:var(--text-onink-soft);}
  .summary-line .v{font-family:"Courier New",Consolas,monospace; text-align:right;}
  .summary-line .v .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  .summary-hint{font-size:11.5px; color:var(--text-onink-soft); line-height:1.5; margin:8px 0 0;}
  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px;}
  .actions button{
    flex:1 1 100px; background:transparent;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft); padding:8px 10px; font-size:12px; border-radius:3px; cursor:pointer; font-family:inherit;
  }
  .actions button:hover{border-color:var(--accent); color:var(--accent-bright);}
  .actions button.primary{background:var(--accent); border-color:var(--accent); color:var(--ink);}
  html:not([data-mode="dark"]) .actions button.primary{color:#fff;}
  .actions button.primary:hover{background:var(--accent-bright); border-color:var(--accent-bright);}
  .actions button:disabled{opacity:.6; cursor:default;}
  .save-status{margin-top:10px; font-size:11px; color:var(--text-onink-soft); display:flex; align-items:center; gap:6px;}
  .save-status .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--text-onink-soft);}
  .save-status.on .dot{background:var(--accent-bright);}
  .save-status.error{color:var(--debit);}
  .save-status.error .dot{background:var(--debit);}

  /* Login/versleutelings-overlay */
  .auth-gate{position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; background:var(--paper-2); padding:20px;}
  .auth-gate-box{
    width:100%; max-width:370px; background:var(--paper); border:1px solid var(--rule); border-top:3px solid var(--accent);
    border-radius:8px; padding:28px 26px; box-shadow:0 8px 30px rgba(0,0,0,.12);
    display:flex; flex-direction:column; gap:12px;
  }
  .auth-gate-title{font-size:24px; font-weight:700; color:var(--accent); margin-bottom:-6px;}
  .auth-gate-tagline{font-family:Georgia,serif; font-size:14px; color:var(--text-soft); margin-bottom:4px;}
  .auth-gate-title2{font-size:15px; font-weight:700; color:var(--text);}
  .auth-gate-subtitle{font-size:12.5px; color:var(--text-soft); line-height:1.5; margin:0 0 6px;}

  .auth-gate-box input:focus{outline:none; border-color:var(--accent);}
  .auth-gate-box button{font-family:inherit; font-size:13.5px; padding:9px 12px; border-radius:4px; border:1px solid var(--rule); background:transparent; color:var(--text); cursor:pointer;}
  .auth-gate-box button.primary{background:var(--deep); border-color:var(--deep); color:#fff;}
  html[data-mode="dark"] .auth-gate-box button.primary{color:#0c121c;}
  .auth-gate-box button.primary:hover{opacity:.9;}
  .auth-gate-box button.ghost{background:transparent; color:var(--text-soft); border-color:transparent; font-size:12px;}
  .auth-gate-box button.ghost:hover{text-decoration:underline;}
  .auth-gate-box button:disabled{opacity:.6; cursor:default;}
  .auth-gate-error{font-size:12px; color:var(--debit); background:color-mix(in srgb, var(--debit) 12%, transparent); border-radius:4px; padding:8px 10px;}
  .auth-gate-notice{font-size:12px; color:var(--deep); background:color-mix(in srgb, var(--deep) 12%, transparent); border-radius:4px; padding:8px 10px;}
  .auth-gate-warn{font-size:11.5px; color:var(--text-soft); line-height:1.5; border-left:3px solid var(--warm); padding:4px 0 4px 10px;}
</style>
</head>

/* ================= STATE ================= */
function newId(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function emptyState(){
  return {
    version: 1, lang: "nl", darkMode: false,
    settings: { isolatieDatum: "", defaultRuimte: "Woonkamer", refBuiten: 10, locatie: null, autoBuiten: true, lastKlimaat: { cv:"uit", cvTemp:20, airco:"uit", aircoTemp:21 } },
    metingen: [],
    afkoeltests: [],
    activeView: { type: "overview" },
  };
}
function baselineState(){
  const s = emptyState();
  s.metingen = BASELINE_METINGEN.map(m => ({ id:newId(), ...m, ruimte:"Woonkamer", verwarming:"", notitie:"", baseline:true }));
  return s;
}
let state = emptyState();
function migrateState(){
  const d = emptyState();
  if(!state || typeof state !== "object") state = d;
  if(!state.settings) state.settings = d.settings;
  for(const k of Object.keys(d.settings)) if(state.settings[k] === undefined) state.settings[k] = d.settings[k];
  if(!Array.isArray(state.metingen)) state.metingen = [];
  if(!Array.isArray(state.afkoeltests)) state.afkoeltests = [];
  if(!Array.isArray(state.afkoelGenegeerd)) state.afkoelGenegeerd = [];
  if(state.settings.lastKlimaat){ if(!state.settings.lastKlimaat.cv) state.settings.lastKlimaat.cv = "uit"; if(!state.settings.lastKlimaat.airco) state.settings.lastKlimaat.airco = "uit"; }
  if(!state.lang) state.lang = "nl";
  if(typeof state.darkMode !== "boolean") state.darkMode = false;
  if(!state.activeView) state.activeView = { type:"overview" };
  const L = state.settings.locatie;
  if(L && !(typeof L.lat === "number" && typeof L.lon === "number" && isFinite(L.lat) && isFinite(L.lon))) state.settings.locatie = null;
  else if(L && typeof L.naam !== "string") L.naam = "";
  // Alleen echt onbruikbare regels overslaan (geen object, geen geldige datum of temperaturen);
  // getallen die als tekst zijn opgeslagen (bijv. uit een oude back-up) worden omgezet.
  state.metingen = state.metingen.filter(m => m && typeof m === "object").map(m => {
    if(typeof m.binnen !== "number") m.binnen = parseNum(m.binnen);
    if(typeof m.buiten !== "number") m.buiten = parseNum(m.buiten);
    return m;
  }).filter(m => validISODate(m.datum) && m.binnen !== null && m.buiten !== null);
  state.metingen.forEach(m => { if(!m.id) m.id = newId(); if(m.ruimte === undefined) m.ruimte = state.settings.defaultRuimte; if(m.verwarming === undefined) m.verwarming = ""; if(m.notitie === undefined) m.notitie = ""; if(!m.buitenBron) m.buitenBron = "handmatig"; if(m.cv === undefined){ m.cv = m.verwarming === "uit" ? "uit" : ""; m.airco = m.verwarming === "uit" ? "uit" : ""; m.cvTemp = null; m.aircoTemp = null; } });
}

/* ================= HULPFUNCTIES ================= */
function escapeHtml(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function parseNum(v){
  if(v === null || v === undefined) return null;
  if(typeof v === "number") return isFinite(v) ? v : null;
  const s = String(v).trim().replace(/[\u2212\u2013\u2012]/g, "-").replace(/\s|°|c$/gi,"").replace(",", ".");
  if(s === "") return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function fmtT(n, digits){ if(n === null || n === undefined || !isFinite(n)) return "—"; return n.toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { minimumFractionDigits: digits ?? 1, maximumFractionDigits: digits ?? 1 }) + " °C"; }
function fmtDelta(n){ if(n === null || !isFinite(n)) return "—"; const s = n > 0 ? "+ " : n < 0 ? "− " : ""; return s + fmtT(Math.abs(n)); }
function pad2(n){ return String(n).padStart(2,"0"); }
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function nowHM(){ const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function tsOf(m){ const [y,mo,d] = m.datum.split("-").map(Number); const [h,mi] = (m.tijd || "12:00").split(":").map(Number); return new Date(y, mo-1, d, h||0, mi||0).getTime(); }
function fmtDate(iso, withYear){
  if(!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  const mn = t("monthNames")[m-1] || "";
  return `${d} ${mn.slice(0,3)}${withYear ? " " + y : ""}`;
}
/* Een <input type="date" min="2000-01-01" max="2100-12-31"> vuurt al "change" af terwijl je het jaartal nog aan het typen bent
   (2 → 0002, 20 → 0020 …). Alleen een volledig, plausibel jaar telt als echte invoer. */
function validISODate(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return !!m && Number(m[1]) >= 2000 && Number(m[1]) <= 2100; }
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function monthLabel(key){ const [y,m] = key.split("-").map(Number); const n = t("monthNames")[m-1]; return n.charAt(0).toUpperCase() + n.slice(1) + " " + y; }
function sortedMetingen(list){ return list.slice().sort((a,b) => tsOf(a) - tsOf(b)); }
function phaseOf(m){ const iso = state.settings.isolatieDatum; if(!iso) return null; return m.datum < iso ? "voor" : "na"; }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0) / arr.length : null; }
function linReg(points){
  // Kleinste-kwadraten-lijn y = a + b·x; null als er te weinig punten/spreiding is.
  if(points.length < 2) return null;
  const mx = avg(points.map(p=>p.x)), my = avg(points.map(p=>p.y));
  let sxx = 0, sxy = 0;
  points.forEach(p => { sxx += (p.x-mx)**2; sxy += (p.x-mx)*(p.y-my); });
  if(sxx < 1e-9) return null;
  const b = sxy / sxx, a = my - b*mx, n = points.length;
  const sse = points.reduce((acc,p) => acc + (p.y - (a + b*p.x))**2, 0);
  const sres = n > 2 ? Math.sqrt(sse / (n - 2)) : 0;
  return { a, b, n, mx, sxx, sres, minX: Math.min(...points.map(p=>p.x)), maxX: Math.max(...points.map(p=>p.x)), spread: Math.sqrt(sxx/n) };
}
/* Dagdeel op basis van de tijd: nacht 0–6, ochtend 6–12, middag 12–18, avond 18–24. */
function dagdeelOf(tijd){ if(!tijd) return null; const h = Number(tijd.split(":")[0]); return h < 6 ? "nacht" : h < 12 ? "ochtend" : h < 18 ? "middag" : "avond"; }
const DAGDELEN = ["nacht","ochtend","middag","avond"];
function dpLabel(k){ return t("dp" + k.charAt(0).toUpperCase() + k.slice(1)); }
let dagdeelFilter = "all";          // schermvoorkeur, niet opgeslagen
let scatterBasisUser = null;        // "nu" | "24" | null (= automatisch)
function applyDagdeel(list){ return dagdeelFilter === "all" ? list : list.filter(m => dagdeelOf(m.tijd) === dagdeelFilter); }
function visibleMetingen(){
  const v = state.activeView || {};
  let list = state.metingen;
  if(v.type === "month") list = list.filter(m => monthKey(m.datum) === v.key);
  return sortedMetingen(applyKlimaat(applyDagdeel(list)));
}
/* ---- Klimaat per meting ----
   cv: "" | "uit" | "aan" (+ cvTemp)   airco: "" | "uit" | "verwarmen" | "koelen" (+ aircoTemp)
   Oude metingen hebben alleen `verwarming` ("aan"/"uit"); "aan" telt dan als verwarmd zonder instelling. */
const REG_TOL = 0.7;   // binnen deze afstand van de ingestelde temperatuur bepaalt de thermostaat binnen
function klimaatOf(m){
  const heatCv = m.cv === "aan", heatAir = m.airco === "verwarmen", cool = m.airco === "koelen";
  let mode, sp = null;
  if((heatCv || heatAir) && cool) mode = "gemengd";
  else if(heatCv || heatAir){ mode = "verwarmen"; const sps = [heatCv ? m.cvTemp : null, heatAir ? m.aircoTemp : null].filter(v => typeof v === "number"); sp = sps.length ? Math.max(...sps) : null; }
  else if(cool){ mode = "koelen"; sp = typeof m.aircoTemp === "number" ? m.aircoTemp : null; }
  else if(m.cv === "uit" && m.airco === "uit") mode = "vrij";
  else if(!m.cv && !m.airco && m.verwarming === "aan") mode = "verwarmen";
  else if(!m.cv && !m.airco && m.verwarming === "uit") mode = "vrij";
  else mode = "onbekend";
  let reg = null;
  if(sp !== null && (mode === "verwarmen" || mode === "koelen")){
    const d = m.binnen - sp;
    if(Math.abs(d) <= REG_TOL) reg = "gehaald";
    else if(mode === "verwarmen") reg = d < 0 ? "niet" : "boven";
    else reg = d > 0 ? "niet" : "onder";
  }
  const sys = mode === "verwarmen" ? (heatCv && heatAir ? "beide" : heatCv ? "cv" : heatAir ? "airco" : null) : null;
  return { mode, sp, reg, sys };
}
function isRegulated(m){ return klimaatOf(m).reg === "gehaald"; }
let klimaatFilter = "all";   // schermvoorkeur: all | vrij | verwarmen | koelen | onbekend
function applyKlimaat(list){ return klimaatFilter === "all" ? list : list.filter(m => { const k = klimaatOf(m).mode; return klimaatFilter === "onbekend" ? (k === "onbekend" || k === "gemengd") : k === klimaatFilter; }); }
function klimaatTag(m){
  const k = klimaatOf(m);
  const parts = [];
  if(m.cv === "aan") parts.push(`${t("kCv")}${typeof m.cvTemp === "number" ? " " + fmtT(m.cvTemp).replace(" °C","°") : ""}`);
  if(m.airco === "verwarmen" || m.airco === "koelen") parts.push(`${t("kAirco")} ${m.airco === "koelen" ? t("kOptKoelShort").toLowerCase() : t("kOptVerwShort").toLowerCase()}${typeof m.aircoTemp === "number" ? " " + fmtT(m.aircoTemp).replace(" °C","°") : ""}`);
  let txt = parts.length ? parts.join(" + ") : t("kStatus_" + k.mode);
  if(!parts.length && k.mode === "verwarmen") txt = t("kLegacy");
  return { txt, k };
}
function has24(m){ return typeof m.buiten24 === "number" && isFinite(m.buiten24); }
function scatterBasis(){
  if(scatterBasisUser) return scatterBasisUser;
  return state.metingen.filter(has24).length >= 2 ? "24" : "nu";
}
function xOf(m, basis){ return basis === "24" ? (has24(m) ? m.buiten24 : null) : m.buiten; }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ================= VERSLEUTELING (WebCrypto: PBKDF2 + AES-GCM, identiek aan FinBo) ================= */
const PBKDF2_ITERATIONS = 300000;
function bufToBase64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function base64ToBuf(b64){ const bin=atob(b64); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
async function deriveKey(password, saltBytes){
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:saltBytes, iterations:PBKDF2_ITERATIONS, hash:"SHA-256" }, baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptState(obj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { ciphertext: bufToBase64(ct), salt: bufToBase64(salt), iv: bufToBase64(iv) };
}
async function decryptState(record, password){
  const key = await deriveKey(password, base64ToBuf(record.salt));
  let plain;
  try{ plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: base64ToBuf(record.iv) }, key, base64ToBuf(record.ciphertext)); }
  catch(err){ throw new Error("TEMBO_DECRYPT_FAILED"); }
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ================= CLOUD-SYNC ================= */
const cloudClient = (typeof window.supabase !== "undefined") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let cloudSession = null;
let encryptionPassword = null;
let saveErrorFlag = false, saveConflictFlag = false;
let autoSaveTimer = null, retryTimer = null, retryDelay = 0;
let dirty = false, stateGeneration = 0, savedGeneration = 0;
let lastSeenCiphertext = null;

/* Versleutelingswachtwoord 8 uur onthouden in sessionStorage van dít tabblad (zelfde afweging als
   FinBo issue #6): verversen vraagt dan niet opnieuw; uitloggen of het tabblad sluiten wist het. */
const ENC_PW_TTL_MS = 8 * 60 * 60 * 1000;
function encPwKey(uid){ return "tembo_enc_pw_" + uid; }
function saveEncPw(uid, pw){ try{ sessionStorage.setItem(encPwKey(uid), JSON.stringify({ pw, expires: Date.now() + ENC_PW_TTL_MS })); }catch(e){} }
function loadEncPw(uid){
  try{
    const r = JSON.parse(sessionStorage.getItem(encPwKey(uid)) || "null");
    if(!r || !r.pw || Date.now() > r.expires){ sessionStorage.removeItem(encPwKey(uid)); return null; }
    return r.pw;
  }catch(e){ return null; }
}
function clearEncPw(uid){ try{ sessionStorage.removeItem(encPwKey(uid)); }catch(e){} }

function scheduleRetry(){ clearTimeout(retryTimer); retryDelay = retryDelay ? Math.min(retryDelay*2, 60000) : 2000; retryTimer = setTimeout(() => { if(dirty) writeStateToCloud(); }, retryDelay); }
function cancelRetry(){ clearTimeout(retryTimer); retryTimer = null; retryDelay = 0; }
window.addEventListener("online", () => { if(dirty && cloudSession){ cancelRetry(); writeStateToCloud(); } });

/* Schrijfacties strikt ná elkaar: twee overlappende schrijvingen (auto-save + tab-wissel) konden
   anders in omgekeerde volgorde aankomen, waarna een oudere momentopname de nieuwere in de cloud
   overschreef terwijl de app dacht dat alles opgeslagen was. */
let writeChain = Promise.resolve();
function writeStateToCloud(forceOverwrite){
  const run = writeChain.then(() => writeStateToCloudNow(forceOverwrite));
  writeChain = run.catch(() => {});
  return run;
}
async function writeStateToCloudNow(forceOverwrite){
  const sessionAtStart = cloudSession, pwAtStart = encryptionPassword;
  if(!cloudClient || !sessionAtStart || !pwAtStart) return;
  const uidAtStart = sessionAtStart.user.id;
  // Al opgeslagen (een eerdere schrijving in de rij nam deze bewerking al mee)? Dan niets doen.
  if(!forceOverwrite && !dirty && savedGeneration === stateGeneration) return;
  try{
    const genAtStart = stateGeneration;
    const record = await encryptState(state, pwAtStart);
    // Nog steeds dezelfde gebruiker? (Een ververst token geeft een nieuw sessie-object, dat mag.)
    if(!cloudSession || cloudSession.user.id !== uidAtStart || encryptionPassword !== pwAtStart) return;
    if(!forceOverwrite){
      const { data: cur, error: readErr } = await cloudClient.from(TABLE).select("ciphertext").eq("user_id", uidAtStart).maybeSingle();
      if(readErr) throw readErr;
      if(cur && lastSeenCiphertext !== null && cur.ciphertext !== lastSeenCiphertext){
        saveConflictFlag = true; saveErrorFlag = false; cancelRetry(); clearTimeout(autoSaveTimer); updateSaveStatus(); return;
      }
    }
    const { error } = await cloudClient.from(TABLE).upsert({ user_id: uidAtStart, ciphertext: record.ciphertext, salt: record.salt, iv: record.iv });
    if(error) throw error;
    lastSeenCiphertext = record.ciphertext;
    saveConflictFlag = false; saveErrorFlag = false; cancelRetry();
    savedGeneration = Math.max(savedGeneration, genAtStart);
    dirty = stateGeneration !== savedGeneration;
    if(dirty){ clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(writeStateToCloud, AUTOSAVE_DEBOUNCE_MS); }
  }catch(err){
    console.error("Cloud-opslaan mislukt:", err);
    saveErrorFlag = true; scheduleRetry();
  }
  updateSaveStatus();
}
function scheduleAutoSave(){
  dirty = true; stateGeneration++; updateSaveStatus();
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(writeStateToCloud, AUTOSAVE_DEBOUNCE_MS);
}
window.addEventListener("beforeunload", e => { if(dirty){ clearTimeout(autoSaveTimer); writeStateToCloud(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden" && cloudSession && dirty){ clearTimeout(autoSaveTimer); writeStateToCloud(); } });
window.addEventListener("pagehide", () => { if(cloudSession && dirty){ clearTimeout(autoSaveTimer); writeStateToCloud(); } });

function updateSaveStatus(){
  document.querySelectorAll(".save-status").forEach(el => {
    if(!cloudClient){ el.textContent = t("supabaseLibError"); el.className = "save-status error"; return; }
    if(saveConflictFlag){ el.textContent = t("cloudSaveConflictStatus"); el.className = "save-status error"; return; }
    if(saveErrorFlag){ el.textContent = t("cloudSaveErrorStatus"); el.className = "save-status error"; return; }
    if(cloudSession){ el.innerHTML = `<span class="dot"></span>${escapeHtml(t("cloudSaveStatus")(cloudSession.user.email))}`; el.className = "save-status on"; return; }
    el.textContent = t("cloudSaveOff"); el.className = "save-status";
  });
}
async function saveNow(){
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  const btn = document.getElementById("saveNowBtn");
  if(btn){ btn.disabled = true; btn.textContent = t("saveNowSaving"); }
  await writeStateToCloud();
  if(saveConflictFlag){
    if(confirm(t("cloudSaveConflictPrompt"))) await writeStateToCloud(true);
    else { if(btn){ btn.disabled = false; btn.textContent = t("saveNowBtn"); } return; }
  }
  const b2 = document.getElementById("saveNowBtn");
  if(b2){ b2.disabled = false; b2.textContent = saveErrorFlag ? t("saveNowBtn") : t("saveNowSaved"); }
  setTimeout(() => { const b3 = document.getElementById("saveNowBtn"); if(b3) b3.textContent = t("saveNowBtn"); }, SAVE_BUTTON_RESET_MS);
}
async function signOutCloud(){
  clearTimeout(autoSaveTimer); cancelRetry();
  if(dirty) await writeStateToCloud();
  if(dirty && !confirm(t("signOutUnsavedWarn"))){ updateSaveStatus(); return false; }
  if(cloudClient) await cloudClient.auth.signOut();
  if(cloudSession) clearEncPw(cloudSession.user.id);
  cloudSession = null; encryptionPassword = null; dirty = false; lastSeenCiphertext = null;
  state = emptyState();
  setProfilePanel(false); setNavDrawer(false);
  renderAuthGate();
  return true;
}

/* ================= AUTH GATE ================= */
let authGateMode = "signin";
function authGateHTML(inner){ return `<div class="auth-gate-box"><div class="auth-gate-title">Tembo</div><div class="auth-gate-tagline">${escapeHtml(t("tagline"))}</div>${inner}</div>`; }

    if(e.key !== "Enter" || e.isComposing) return;

}

function acceptDecrypted(decrypted, pw){
  state = decrypted; migrateState();
  encryptionPassword = pw;
  saveEncPw(cloudSession.user.id, pw);
  renderAuthGate();
  bootApp();
}
function renderEncryptionPrompt(){
  const el = document.getElementById("authGate");
  el.innerHTML = authGateHTML(`<p class="auth-gate-subtitle">${t("checking")}</p>`);
  cloudClient.from(TABLE).select("*").eq("user_id", cloudSession.user.id).maybeSingle().then(({ data, error }) => {
    if(error){
      el.innerHTML = authGateHTML(`<p class="auth-gate-error">${escapeHtml(error.message || String(error))}</p>
        <button id="cloudRetryBtn">${t("retryBtn")}</button><button id="authSignOutBtn" class="ghost">${t("logoutBtn")}</button>`);
      document.getElementById("cloudRetryBtn").onclick = () => renderAuthGate();
      document.getElementById("authSignOutBtn").onclick = () => signOutCloud();
      return;
    }
    if(data){
      lastSeenCiphertext = data.ciphertext;
      const remembered = loadEncPw(cloudSession.user.id);

        return;
      }
      renderEncryptionExisting(data);

      renderEncryptionNew();

}

function renderEncryptionNew(){

    <label>${t("encPw")}<input type="password" id="encPwInput" autocomplete="new-password" /></label>
    <label>${t("encPw2")}<input type="password" id="encPwInput2" autocomplete="new-password" /></label>
    <label class="radio"><input type="radio" name="startChoice" value="baseline" checked /> ${escapeHtml(t("startBaseline"))}</label>
    <label class="radio"><input type="radio" name="startChoice" value="empty" /> ${escapeHtml(t("startEmpty"))}</label>
    <button id="encSubmitBtn" class="primary">${t("encCreateBtn")}</button>
    <button id="authSignOutBtn" class="ghost">${t("logoutBtn")}</button>`);
  document.getElementById("encPwInput").focus();
  document.getElementById("authSignOutBtn").onclick = () => signOutCloud();
  document.getElementById("encSubmitBtn").onclick = async () => {
    const pw = document.getElementById("encPwInput").value, pw2 = document.getElementById("encPwInput2").value;
    const err = document.getElementById("encError"), btn = document.getElementById("encSubmitBtn");
    err.style.display = "none";
    if(pw.length < 8){ err.textContent = t("encTooShort"); err.style.display = "block"; return; }
    if(pw !== pw2){ err.textContent = t("encMismatch"); err.style.display = "block"; return; }
    btn.disabled = true;
    const choice = (document.querySelector('input[name="startChoice"]:checked') || {}).value;
    const lang = state.lang, dark = state.darkMode;
    state = choice === "empty" ? emptyState() : baselineState();
    state.lang = lang; state.darkMode = dark;
    encryptionPassword = pw;
    saveEncPw(cloudSession.user.id, pw);
    renderAuthGate();
    bootApp();
    dirty = true; stateGeneration++;
    await writeStateToCloud();
  };
}

const DRAFT_FIELDS = ["fDatum","fTijd","fBinnen","fBuiten","fRuimte","fNotitie","fCvTemp","fAirTemp"];

  formDraft = {};

function restoreFormDraft(){
  if(!formDraft) return;
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if(!el || formDraft[id] === undefined) return;
    if(id === "fBuiten" && formBuitenMode === "online") return;   // die vult Tembo zelf
    if((id === "fDatum" || id === "fTijd") && (!formDraft[id] || !formTimeTouched)) return;   // niet-aangeraakte tijd = "nu"
    el.value = formDraft[id];
  });
  formDraft = null;
}

function wireEntryForm(){
  const main = document.getElementById("categories");
  wireEnterSubmit(main);
  lastFormMsg = null;
  formBuitenFetched = null;
  document.querySelectorAll(".src-choice button").forEach(b => b.onclick = () => { formModeTouched = true; setBuitenMode(b.dataset.src, true); });
  // Telefoontoetsenborden met alleen cijfers (iPhone) hebben geen minteken: ± draait het teken om.
  document.getElementById("fBuitenNeg").onclick = () => {
    const f = document.getElementById("fBuiten");
    if(f.readOnly) return;
    const v = f.value.trim();
    f.value = v.startsWith("-") ? v.slice(1) : "-" + v;
    f.focus();
  };
  document.getElementById("fDatum").addEventListener("change", autoFillBuiten);
  document.getElementById("fTijd").addEventListener("change", autoFillBuiten);
  // Zelf datum/tijd aangepast (bijv. een meting van eerder invoeren)? Dan niet meer automatisch bijwerken.
  ["fDatum","fTijd"].forEach(id => document.getElementById(id).addEventListener("input", () => { formTimeTouched = true; }));
  setBuitenMode(formBuitenMode, false);
  document.querySelectorAll("[data-kgroup]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    formKlimaat[g.dataset.kgroup] = b.dataset.kv;
    g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    document.getElementById("cvSpWrap").hidden = formKlimaat.cv !== "aan";
    document.getElementById("airSpWrap").hidden = !(formKlimaat.airco === "verwarmen" || formKlimaat.airco === "koelen");
  }));
  document.getElementById("addBtn").onclick = () => {
    const datum = document.getElementById("fDatum").value;
    const binnen = parseNum(document.getElementById("fBinnen").value);
    const buiten = parseNum(document.getElementById("fBuiten").value);
    const msg = document.getElementById("formMsg");
    if(!validISODate(datum)){ msg.textContent = t("errDate"); msg.className = "form-msg err"; return; }
    if(binnen === null || buiten === null){ msg.textContent = t("errTemps"); msg.className = "form-msg err"; return; }
    state.metingen.push({
      id:newId(), datum, tijd: document.getElementById("fTijd").value || "",
      binnen, buiten,
      buitenBron: (formBuitenMode === "online" && formBuitenFetched !== null && buiten === formBuitenFetched) ? "online" : "handmatig",
      buitenOnline: formBuitenFetched,
      ruimte: document.getElementById("fRuimte").value.trim() || state.settings.defaultRuimte,
      cv: formKlimaat.cv, airco: formKlimaat.airco,
      cvTemp: formKlimaat.cv === "aan" ? parseNum(document.getElementById("fCvTemp").value) : null,
      aircoTemp: (formKlimaat.airco === "verwarmen" || formKlimaat.airco === "koelen") ? parseNum(document.getElementById("fAirTemp").value) : null,
      notitie: document.getElementById("fNotitie").value.trim(),
    });
    // Keuze onthouden voor de volgende meting (instellingen blijven staan, ook als het systeem uit is).
    const last = state.metingen[state.metingen.length - 1];
    state.settings.lastKlimaat = { cv: last.cv, airco: last.airco,
      cvTemp: last.cvTemp ?? formKlimaat.cvTemp ?? 20, aircoTemp: last.aircoTemp ?? formKlimaat.aircoTemp ?? 21 };
    formKlimaat = null;
    formTimeTouched = false;
    DRAFT_FIELDS.forEach(id => { const el = document.getElementById(id); if(el && id !== "fRuimte") el.value = ""; });
    lastFormMsg = { cls:"ok", text:t("addedMsg") };
    formModeTouched = false;
    scheduleAutoSave();
    renderAll();
    backfillOnline();
    const b = document.getElementById("fBinnen"); if(b) b.focus();
  };
}

function niceTicks(min, max, count){
  if(min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(s => s*mag).find(s => s >= step0) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const ticks = []; for(let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v*100)/100);
  return { lo, hi, ticks };
}
