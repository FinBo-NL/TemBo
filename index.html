<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tembo</title>
<style>
  /* Tembo — zelfde opbouw als FinBo (chrome = --ink, kaarten = --paper, --text-onink hoort bij --ink),
     maar met blauw als accent/belettering in plaats van groen. */
  :root{
    --ink:#fbfcfe;
    --ink-2:#f4f7fb;
    --paper:#ffffff;
    --paper-2:#eff3f9;
    --rule:#dfe5ee;
    --accent:#1f5fa8;
    --accent-bright:#2b7bd4;
    --deep:#1a4e8a;
    --warm:#b4532a;
    --debit:#b0463c;
    --text:#16202e;
    --text-soft:#5b6778;
    --text-onink:#16202e;
    --text-onink-soft:#5b6778;
    /* Grafiekkleuren (gevalideerd met de dataviz-validator): binnen = warm oranje, buiten = blauw;
       voor/na isolatie = violet/aqua. */
    --c-binnen:#eb6834;
    --c-buiten:#2a78d6;
    --c-voor:#4a3aa7;
    --c-na:#1baf7a;
    --grid:#e6ebf2;
  }
  html[data-mode="dark"]{
    --ink:#0f1622;
    --ink-2:#0c121c;
    --paper:#151e2b;
    --paper-2:#1a2433;
    --rule:rgba(255,255,255,.09);
    --accent:#4f8fd9;
    --accent-bright:#6ea8ea;
    --deep:#6aa6e8;
    --warm:#f0906a;
    --debit:#e2897a;
    --text:#e6edf6;
    --text-soft:#9aa9bc;
    --text-onink:#e8eef7;
    --text-onink-soft:#9aa9bc;
    --c-binnen:#d95926;
    --c-buiten:#3987e5;
    --c-voor:#9085e9;
    --c-na:#199e70;
    --grid:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:600; margin:0;}
  .mono{font-family:"Courier New",Consolas,monospace; font-variant-numeric:tabular-nums;}

  /* Header */
  header{
    position:sticky; top:0; z-index:60;
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    padding:12px 22px;
    border-bottom:3px solid var(--accent);
  }
  .header-top{display:flex; justify-content:space-between; align-items:center; gap:14px;}
  .header-main{text-align:center; flex:1; min-width:0;}
  header .eyebrow{color:var(--accent); font-weight:700; font-size:28px; margin-bottom:2px; letter-spacing:.01em;}
  header h1{color:var(--text-onink-soft); font-size:16px; font-weight:400; letter-spacing:.01em;}
  .icon-btn, .profile-btn, .mode-btn{
    width:34px; height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 20%, transparent);
    background:transparent; color:var(--text-onink-soft); cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover, .profile-btn:hover, .mode-btn:hover{color:var(--accent-bright); border-color:var(--accent-bright);}
  .icon-btn:focus-visible, .profile-btn:focus-visible{outline:2px solid var(--accent-bright); outline-offset:2px;}
  .icon-btn svg{width:18px; height:18px;}
  .profile-btn svg{width:17px; height:17px;}
  .mode-btn svg{width:16px; height:16px;}
  .profile-btn.active{border-color:var(--accent); color:var(--accent-bright); background:color-mix(in srgb, var(--accent) 14%, transparent);}

  /* Navigatielade (links) */
  .nav-backdrop, .profile-backdrop{
    position:fixed; inset:0; background:rgba(10,18,32,.42);
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .nav-backdrop{z-index:70;}
  .profile-backdrop{z-index:940;}
  html[data-mode="dark"] .nav-backdrop, html[data-mode="dark"] .profile-backdrop{background:rgba(0,0,0,.55);}
  .nav-backdrop.open, .profile-backdrop.open{opacity:1; pointer-events:auto;}
  .nav-drawer{
    position:fixed; top:0; left:0; bottom:0; z-index:80;
    width:290px; max-width:82vw;
    display:flex; flex-direction:column;
    background:var(--paper-2); border-right:1px solid var(--rule);
    box-shadow:0 18px 40px rgba(16,25,40,.18);
    transform:translateX(-100%); visibility:hidden;
    transition:transform .24s cubic-bezier(.4,0,.2,1), visibility 0s linear .24s;
  }
  .nav-drawer.open{transform:translateX(0); visibility:visible; transition-delay:0s;}
  .nav-drawer-head, .profile-panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0;
  }
  .nav-drawer-head{padding:12px 14px; border-bottom:1px solid var(--rule);}
  .nav-drawer-title{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-soft); font-weight:600;}
  .nav-drawer .icon-btn{width:28px; height:28px;}
  .nav-drawer .icon-btn svg{width:15px; height:15px;}
  .tabs{display:flex; flex-direction:column; gap:18px; flex:1 1 auto; overflow-y:auto; padding:14px 12px 18px;}
  .tab-group{display:flex; flex-direction:column; gap:2px;}
  .tab-group-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; padding:0 14px;}
  .tab-group-label{color:var(--text-onink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; flex:1;}
  .tab-group-head.collapsible{cursor:pointer;}
  .tab-group-head.collapsible:hover .tab-group-label{color:var(--accent-bright);}
  .group-collapse-btn{
    width:20px; height:20px; border-radius:50%; padding:0;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent; color:var(--text-onink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .group-collapse-btn:hover{border-color:var(--accent); color:var(--accent-bright);}
  .group-collapse-btn svg{width:12px; height:12px; transition:transform .15s ease;}
  .group-collapse-btn.collapsed svg{transform:rotate(-90deg);}
  .tab{
    display:flex; align-items:center; justify-content:space-between; text-align:left;
    background:transparent; border:none; border-left:3px solid transparent;
    color:var(--text-onink-soft); font-family:Georgia,serif; font-size:14px;
    padding:10px 14px; cursor:pointer; white-space:nowrap;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .tab:hover{color:var(--text-onink); background:color-mix(in srgb, var(--text-onink) 4%, transparent);}
  .tab.active{color:var(--accent-bright); border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .tab .tab-count{font-family:"Segoe UI",sans-serif; font-size:11px; opacity:.6;}
  .tab-upload{
    border:1px dashed color-mix(in srgb, var(--text-onink) 30%, transparent); border-radius:3px;
    color:var(--accent-bright); font-family:"Segoe UI",sans-serif; font-size:12.5px; justify-content:center; gap:8px;
  }
  .tab-upload svg{width:14px; height:14px;}
  .tab-upload:hover, .tab-upload.active{background:color-mix(in srgb, var(--accent) 8%, transparent); border-color:var(--accent);}

  /* Profielpaneel (rechts) */
  .profile-panel{
    position:fixed; top:0; right:0; height:100vh;
    width:30vw; min-width:min(320px, 92vw); max-width:460px;
    background:var(--paper); border-left:1px solid var(--rule);
    box-shadow:-2px 0 28px rgba(0,0,0,.18); z-index:950;
    display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .3s cubic-bezier(.4,0,.2,1), visibility 0s linear .3s;
  }
  .profile-panel.open{transform:translateX(0); visibility:visible; transition-delay:0s;}
  @media (prefers-reduced-motion: reduce){ .nav-drawer,.nav-backdrop,.profile-panel,.profile-backdrop{transition:none;} }
  .profile-panel-head{
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    border-bottom:3px solid var(--accent); padding:16px 16px 14px 20px; flex-wrap:wrap;
  }
  .profile-panel-title{font-family:Georgia,serif; font-weight:600; font-size:18px; color:var(--text-onink); flex:1 1 auto;}
  .profile-panel-head-controls{display:flex; align-items:center; gap:8px;}
  .lang-toggle{display:flex; gap:4px;}
  .lang-btn{
    background:transparent; border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft); padding:5px 11px; font-size:11px; letter-spacing:.06em; border-radius:3px; cursor:pointer;
  }
  .lang-btn:hover{border-color:var(--accent); color:var(--accent-bright);}
  .lang-btn.active{border-color:var(--accent); color:var(--accent-bright); background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .profile-close-btn{
    width:30px; height:30px; border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent; color:var(--text-onink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .profile-close-btn:hover{border-color:var(--debit); color:var(--debit);}
  .profile-close-btn svg{width:15px; height:15px;}
  .profile-panel-tabs{display:flex; gap:4px; padding:14px 20px 0; border-bottom:1px solid var(--rule);}
  .profile-tab-btn{
    background:transparent; border:none; border-bottom:2px solid transparent; color:var(--text-soft);
    padding:8px 4px 10px; margin-right:18px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .profile-tab-btn:hover{color:var(--text);}
  .profile-tab-btn.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
  .profile-panel-body{flex:1 1 auto; overflow-y:auto; padding:22px 20px 28px; display:flex; flex-direction:column; gap:26px;}
  .profile-section-title{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-soft); margin:0 0 4px;}
  .profile-current-email{font-size:14px; background:var(--paper-2); border:1px solid var(--rule); border-radius:5px; padding:9px 11px; word-break:break-all;}
  .profile-field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-soft); margin-top:10px;}
  .profile-field input, .profile-field select{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);
  }
  .profile-field input:focus, .profile-field select:focus{outline:none; border-color:var(--accent);}
  .profile-panel-body button{
    font-family:inherit; font-size:13px; padding:8px 12px; border-radius:4px;
    border:1px solid var(--rule); background:transparent; color:var(--text); cursor:pointer; margin-top:12px;
  }
  .profile-panel-body button.primary{background:var(--deep); border-color:var(--deep); color:#fff;}
  html[data-mode="dark"] .profile-panel-body button.primary{color:#0c121c;}
  .profile-panel-body button:disabled{opacity:.6; cursor:default;}
  .profile-msg{font-size:12px; border-radius:4px; padding:8px 10px; margin-top:10px;}
  .profile-msg.error{color:var(--debit); background:color-mix(in srgb, var(--debit) 12%, transparent);}
  .profile-msg.notice{color:var(--deep); background:color-mix(in srgb, var(--deep) 12%, transparent);}
  .profile-hint{font-size:11.5px; color:var(--text-soft); line-height:1.5; margin:4px 0 0;}
  .profile-divider{border:none; border-top:1px solid var(--rule); margin:0;}
  .loc-search-row{display:flex; gap:8px; margin-top:10px;}
  .loc-search-row input{flex:1; min-width:0; font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);}
  .loc-search-row input:focus{outline:none; border-color:var(--accent);}
  .loc-search-row button{margin-top:0 !important;}
  .loc-results{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
  .loc-results button{margin-top:0 !important; text-align:left; font-size:13px;}
  .loc-results button:hover{border-color:var(--accent); color:var(--accent);}
  .loc-src{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:3px; padding:1px 5px; margin-right:7px; vertical-align:1px;}
  .loc-results .none{font-size:12px; color:var(--text-soft);}
  .loc-btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .profile-check{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--text); margin-top:12px; line-height:1.4;}
  .src-choice{display:inline-flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden; margin-top:4px; align-self:flex-start;}
  .src-choice button{font-family:inherit; font-size:11px; padding:4px 9px; border:none; background:transparent; color:var(--text-soft); cursor:pointer;}
  .src-choice button + button{border-left:1px solid var(--rule);}
  .src-choice button.on{background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); font-weight:600;}
  #fBuiten[readonly]{background:var(--paper-2); color:var(--accent);}
  .online-was{font-size:10px; color:var(--text-soft); font-family:"Courier New",monospace; white-space:nowrap;}
  .buiten-cell .t-num{width:56px;}
  .src-hint{font-size:10.5px; color:var(--text-soft); min-height:13px; line-height:1.3;}
  .src-hint.online{color:var(--accent);}
  .src-hint.err{color:var(--debit);}
  .buiten-cell{display:inline-flex; align-items:center; gap:4px; justify-content:flex-end;}
  .online-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  /* Layout */
  .layout{display:grid; grid-template-columns:minmax(0,1fr) 380px; align-items:start;}
  main.categories, aside.summary{min-width:0;}
  main.categories{padding:28px 24px 60px 32px;}
  @media (max-width:980px){
    .layout{grid-template-columns:minmax(0,1fr);}
    aside.summary{position:static !important; min-height:0 !important; border-left:none !important; border-top:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);}
  }
  @media (max-width:640px){
    header{padding:12px 14px;}
    header .eyebrow{font-size:24px;}
    header h1{font-size:14px;}
    main.categories{padding:18px 14px 36px;}
    aside.summary{padding:20px 16px 32px !important;}
    .card-head{padding:9px 14px 7px !important;}
    .card-body{padding:12px 14px !important;}
  }

  .card{background:var(--paper); border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:2px; margin-bottom:20px; box-shadow:0 1px 0 rgba(0,0,0,.04);}
  .card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 18px 8px; border-bottom:1px solid color-mix(in srgb, var(--accent) 30%, var(--rule));
    background:color-mix(in srgb, var(--accent) 9%, var(--paper-2));
  }
  .card-head .htitle{display:flex; align-items:center; gap:9px; color:var(--deep); min-width:0;}
  .card-head h2{font-size:15px; color:inherit;}
  .card-head .head-extra{font-size:12px; color:var(--text-soft);}
  .cat-icon{width:17px; height:17px; flex-shrink:0;}
  .card-body{padding:14px 18px 16px;}
  .card-note{font-size:12px; color:var(--text-soft); line-height:1.55; margin:0;}

  /* Invoerformulier */
  .entry-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px;}
  .entry-grid label, .import-box label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-soft); letter-spacing:.02em;}
  .entry-grid input, .entry-grid select, .rtable input, .rtable select{
    font-family:inherit; font-size:14px; padding:7px 9px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text); min-width:0; width:100%;
  }
  .entry-grid input:focus, .entry-grid select:focus, .rtable input:focus, .rtable select:focus{outline:none; border-color:var(--accent);}
  .entry-grid .wide{grid-column:1 / -1;}
  .entry-actions{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap;}
  .btn{
    font-family:inherit; font-size:13px; padding:8px 14px; border-radius:4px; cursor:pointer;
    border:1px solid var(--rule); background:transparent; color:var(--text);
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--deep); border-color:var(--deep); color:#fff;}
  html[data-mode="dark"] .btn.primary{color:#0c121c;}
  .btn.primary:hover{opacity:.9; color:#fff;}
  html[data-mode="dark"] .btn.primary:hover{color:#0c121c;}
  .form-msg{font-size:12px;}
  .form-msg.ok{color:var(--deep);}
  .form-msg.err{color:var(--debit);}

  /* Grafieken */
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text-soft); margin:0 0 8px;}
  .chart-legend .key{display:inline-flex; align-items:center; gap:6px;}
  .chart-legend .sw{width:14px; height:3px; border-radius:2px;}
  .chart-legend .sw.dot{width:9px; height:9px; border-radius:50%;}
  .chart-legend .sw.dash{height:0; border-top:2px dashed var(--text-soft); background:none;}
  .chart-wrap{position:relative; width:100%;}
  .chart-wrap svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart-wrap text{font-family:"Segoe UI",system-ui,sans-serif; font-size:11px; fill:var(--text-soft);}
  .chart-wrap .lbl-strong{fill:var(--text); font-weight:600;}
  .chart-tooltip{
    position:absolute; pointer-events:none; z-index:5;
    background:var(--paper); border:1px solid var(--rule); border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.12); padding:8px 10px; font-size:12px; color:var(--text);
    min-width:150px; opacity:0; transition:opacity .1s;
  }
  .chart-tooltip .tt-head{font-weight:600; margin-bottom:4px;}
  .chart-tooltip .tt-row{display:flex; align-items:center; gap:7px; justify-content:space-between;}
  .chart-tooltip .tt-row span:first-child{display:inline-flex; align-items:center; gap:6px; color:var(--text-soft);}
  .chart-tooltip .tt-key{width:9px; height:9px; border-radius:50%;}
  .chart-tooltip .tt-val{font-family:"Courier New",monospace; font-weight:700;}
  .chart-empty{font-size:13px; color:var(--text-soft); padding:22px 0; text-align:center;}

  /* Metingentabel */
  .table-scroll{overflow-x:auto; margin:0 -4px;}
  .rtable{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  .rtable th{
    text-align:left; font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-soft); padding:6px 4px; border-bottom:1px solid var(--rule); white-space:nowrap;
  }
  .rtable th.num, .rtable td.num{text-align:right;}
  .rtable td{padding:4px; border-bottom:1px solid var(--rule); vertical-align:middle;}
  .rtable tr:last-child td{border-bottom:none;}
  .rtable input, .rtable select{font-size:13px; padding:5px 6px; border-color:transparent; background:transparent;}
  .rtable input:hover, .rtable select:hover{border-color:var(--rule);}
  .rtable input.t-num{width:70px; text-align:right; font-family:"Courier New",monospace;}
  .rtable input.t-date{width:150px;}
  .rtable input.t-time{width:118px;}
  .rtable .delta{font-family:"Courier New",monospace; font-weight:700; white-space:nowrap;}
  .rtable .phase{font-size:10px; padding:2px 7px; border-radius:20px; white-space:nowrap; font-weight:600;}
  .phase.voor{color:var(--c-voor); background:color-mix(in srgb, var(--c-voor) 13%, transparent);}
  .phase.na{color:var(--c-na); background:color-mix(in srgb, var(--c-na) 14%, transparent);}
  .row-del{
    width:24px; height:24px; border-radius:50%; padding:0; cursor:pointer;
    border:1px solid transparent; background:transparent; color:var(--text-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .row-del:hover{border-color:var(--debit); color:var(--debit); background:color-mix(in srgb, var(--debit) 10%, transparent);}
  .row-del svg{width:13px; height:13px;}

  /* Import */
  .import-drop{
    border:1.5px dashed color-mix(in srgb, var(--accent) 50%, var(--rule)); border-radius:6px;
    padding:26px 18px; text-align:center; color:var(--text-soft); font-size:13px; cursor:pointer;
    background:color-mix(in srgb, var(--accent) 4%, transparent);
  }
  .import-drop:hover, .import-drop.drag{border-color:var(--accent); color:var(--accent);}
  .import-drop strong{color:var(--accent); display:block; font-size:14px; margin-bottom:4px;}
  .import-result{margin-top:14px; font-size:13px; line-height:1.6;}

  /* Samenvatting rechts */
  aside.summary{
    position:sticky; top:62px; background:var(--ink); color:var(--text-onink);
    padding:28px 24px 40px; min-height:calc(100vh - 62px);
    border-left:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
  }
  aside.summary h2{font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-onink-soft); margin-bottom:16px; font-family:"Segoe UI",sans-serif;}
  aside.summary h3{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-onink-soft); margin:26px 0 8px; font-family:"Segoe UI",sans-serif;}

/* ================= STATE ================= */
function newId(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function emptyState(){
  return {
    version: 1, lang: "nl", darkMode: false,
    settings: { isolatieDatum: "", defaultRuimte: "Woonkamer", refBuiten: 10, locatie: null, autoBuiten: true },
    metingen: [],
    activeView: { type: "overview" },
  };
}
function baselineState(){
  const s = emptyState();
  s.metingen = BASELINE_METINGEN.map(m => ({ id:newId(), ...m, ruimte:"Woonkamer", verwarming:"", notitie:"", baseline:true }));
  return s;
}
let state = emptyState();
function migrateState(){
  const d = emptyState();
  if(!state || typeof state !== "object") state = d;
  if(!state.settings) state.settings = d.settings;
  for(const k of Object.keys(d.settings)) if(state.settings[k] === undefined) state.settings[k] = d.settings[k];
  if(!Array.isArray(state.metingen)) state.metingen = [];
  if(!state.lang) state.lang = "nl";
  if(typeof state.darkMode !== "boolean") state.darkMode = false;
  if(!state.activeView) state.activeView = { type:"overview" };
  state.metingen.forEach(m => { if(!m.id) m.id = newId(); if(m.ruimte === undefined) m.ruimte = state.settings.defaultRuimte; if(m.verwarming === undefined) m.verwarming = ""; if(m.notitie === undefined) m.notitie = ""; if(!m.buitenBron) m.buitenBron = "handmatig"; });
}

/* ================= HULPFUNCTIES ================= */
function escapeHtml(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function parseNum(v){
  if(v === null || v === undefined) return null;
  if(typeof v === "number") return isFinite(v) ? v : null;
  const s = String(v).trim().replace(/\s|°|c$/gi,"").replace(",", ".");
  if(s === "") return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function fmtT(n, digits){ if(n === null || n === undefined || !isFinite(n)) return "—"; return n.toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { minimumFractionDigits: digits ?? 1, maximumFractionDigits: digits ?? 1 }) + " °C"; }
function fmtDelta(n){ if(n === null || !isFinite(n)) return "—"; const s = n > 0 ? "+ " : n < 0 ? "− " : ""; return s + fmtT(Math.abs(n)); }
function pad2(n){ return String(n).padStart(2,"0"); }
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function nowHM(){ const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function tsOf(m){ const [y,mo,d] = m.datum.split("-").map(Number); const [h,mi] = (m.tijd || "12:00").split(":").map(Number); return new Date(y, mo-1, d, h||0, mi||0).getTime(); }
function fmtDate(iso, withYear){
  if(!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  const mn = t("monthNames")[m-1] || "";
  return `${d} ${mn.slice(0,3)}${withYear ? " " + y : ""}`;
}
/* Een <input type="date" min="2000-01-01" max="2100-12-31"> vuurt al "change" af terwijl je het jaartal nog aan het typen bent
   (2 → 0002, 20 → 0020 …). Alleen een volledig, plausibel jaar telt als echte invoer. */
function validISODate(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return !!m && Number(m[1]) >= 2000 && Number(m[1]) <= 2100; }
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function monthLabel(key){ const [y,m] = key.split("-").map(Number); const n = t("monthNames")[m-1]; return n.charAt(0).toUpperCase() + n.slice(1) + " " + y; }
function sortedMetingen(list){ return list.slice().sort((a,b) => tsOf(a) - tsOf(b)); }
function phaseOf(m){ const iso = state.settings.isolatieDatum; if(!iso) return null; return m.datum < iso ? "voor" : "na"; }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0) / arr.length : null; }
function linReg(points){
  // Kleinste-kwadraten-lijn y = a + b·x; null als er te weinig punten/spreiding is.
  if(points.length < 2) return null;
  const mx = avg(points.map(p=>p.x)), my = avg(points.map(p=>p.y));
  let sxx = 0, sxy = 0;
  points.forEach(p => { sxx += (p.x-mx)**2; sxy += (p.x-mx)*(p.y-my); });
  if(sxx < 1e-9) return null;
  const b = sxy / sxx;
  return { a: my - b*mx, b, minX: Math.min(...points.map(p=>p.x)), maxX: Math.max(...points.map(p=>p.x)), spread: Math.sqrt(sxx/points.length) };
}
function visibleMetingen(){
  const v = state.activeView || {};
  let list = state.metingen;
  if(v.type === "month") list = list.filter(m => monthKey(m.datum) === v.key);
  return sortedMetingen(list);
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ================= VERSLEUTELING (WebCrypto: PBKDF2 + AES-GCM, identiek aan FinBo) ================= */
const PBKDF2_ITERATIONS = 300000;
function bufToBase64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function base64ToBuf(b64){ const bin=atob(b64); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
async function deriveKey(password, saltBytes){
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:saltBytes, iterations:PBKDF2_ITERATIONS, hash:"SHA-256" }, baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptState(obj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { ciphertext: bufToBase64(ct), salt: bufToBase64(salt), iv: bufToBase64(iv) };
}
async function decryptState(record, password){
  const key = await deriveKey(password, base64ToBuf(record.salt));
  let plain;
  try{ plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: base64ToBuf(record.iv) }, key, base64ToBuf(record.ciphertext)); }
  catch(err){ throw new Error("TEMBO_DECRYPT_FAILED"); }
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ================= CLOUD-SYNC ================= */
const cloudClient = (typeof window.supabase !== "undefined") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let cloudSession = null;
let encryptionPassword = null;
let saveErrorFlag = false, saveConflictFlag = false;
let autoSaveTimer = null, retryTimer = null, retryDelay = 0;
let dirty = false, stateGeneration = 0, savedGeneration = 0;
let lastSeenCiphertext = null;

/* Versleutelingswachtwoord 8 uur onthouden in sessionStorage van dít tabblad (zelfde afweging als
   FinBo issue #6): verversen vraagt dan niet opnieuw; uitloggen of het tabblad sluiten wist het. */
const ENC_PW_TTL_MS = 8 * 60 * 60 * 1000;
function encPwKey(uid){ return "tembo_enc_pw_" + uid; }
function saveEncPw(uid, pw){ try{ sessionStorage.setItem(encPwKey(uid), JSON.stringify({ pw, expires: Date.now() + ENC_PW_TTL_MS })); }catch(e){} }
function loadEncPw(uid){
  try{
    const r = JSON.parse(sessionStorage.getItem(encPwKey(uid)) || "null");
    if(!r || !r.pw || Date.now() > r.expires){ sessionStorage.removeItem(encPwKey(uid)); return null; }
    return r.pw;
  }catch(e){ return null; }
}
function clearEncPw(uid){ try{ sessionStorage.removeItem(encPwKey(uid)); }catch(e){} }

function scheduleRetry(){ clearTimeout(retryTimer); retryDelay = retryDelay ? Math.min(retryDelay*2, 60000) : 2000; retryTimer = setTimeout(() => { if(dirty) writeStateToCloud(); }, retryDelay); }
function cancelRetry(){ clearTimeout(retryTimer); retryTimer = null; retryDelay = 0; }
window.addEventListener("online", () => { if(dirty && cloudSession){ cancelRetry(); writeStateToCloud(); } });

async function writeStateToCloud(forceOverwrite){
  const sessionAtStart = cloudSession, pwAtStart = encryptionPassword;
  if(!cloudClient || !sessionAtStart || !pwAtStart) return;
  try{
    const genAtStart = stateGeneration;
    const record = await encryptState(state, pwAtStart);
    if(cloudSession !== sessionAtStart) return;
    if(!forceOverwrite){
      const { data: cur, error: readErr } = await cloudClient.from(TABLE).select("ciphertext").eq("user_id", sessionAtStart.user.id).maybeSingle();
      if(readErr) throw readErr;
      if(cur && lastSeenCiphertext !== null && cur.ciphertext !== lastSeenCiphertext){
        saveConflictFlag = true; saveErrorFlag = false; cancelRetry(); clearTimeout(autoSaveTimer); updateSaveStatus(); return;
      }
    }
    const { error } = await cloudClient.from(TABLE).upsert({ user_id: sessionAtStart.user.id, ciphertext: record.ciphertext, salt: record.salt, iv: record.iv });
    if(error) throw error;
    lastSeenCiphertext = record.ciphertext;
    saveConflictFlag = false; saveErrorFlag = false; cancelRetry();
    savedGeneration = Math.max(savedGeneration, genAtStart);
    dirty = stateGeneration !== savedGeneration;
    if(dirty){ clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(writeStateToCloud, AUTOSAVE_DEBOUNCE_MS); }
  }catch(err){
    console.error("Cloud-opslaan mislukt:", err);
    saveErrorFlag = true; scheduleRetry();
  }
  updateSaveStatus();
}
function scheduleAutoSave(){
  dirty = true; stateGeneration++; updateSaveStatus();
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(writeStateToCloud, AUTOSAVE_DEBOUNCE_MS);
}
window.addEventListener("beforeunload", e => { if(dirty){ clearTimeout(autoSaveTimer); writeStateToCloud(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden" && cloudSession && dirty){ clearTimeout(autoSaveTimer); writeStateToCloud(); } });
window.addEventListener("pagehide", () => { if(cloudSession && dirty){ clearTimeout(autoSaveTimer); writeStateToCloud(); } });

function updateSaveStatus(){
  document.querySelectorAll(".save-status").forEach(el => {
    if(!cloudClient){ el.textContent = t("supabaseLibError"); el.className = "save-status error"; return; }
    if(saveConflictFlag){ el.textContent = t("cloudSaveConflictStatus"); el.className = "save-status error"; return; }
    if(saveErrorFlag){ el.textContent = t("cloudSaveErrorStatus"); el.className = "save-status error"; return; }
    if(cloudSession){ el.innerHTML = `<span class="dot"></span>${escapeHtml(t("cloudSaveStatus")(cloudSession.user.email))}`; el.className = "save-status on"; return; }
    el.textContent = t("cloudSaveOff"); el.className = "save-status";
  });
}
async function saveNow(){
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  const btn = document.getElementById("saveNowBtn");
  if(btn){ btn.disabled = true; btn.textContent = t("saveNowSaving"); }
  await writeStateToCloud();
  if(saveConflictFlag){
    if(confirm(t("cloudSaveConflictPrompt"))) await writeStateToCloud(true);
    else { if(btn){ btn.disabled = false; btn.textContent = t("saveNowBtn"); } return; }
  }
  const b2 = document.getElementById("saveNowBtn");
  if(b2){ b2.disabled = false; b2.textContent = saveErrorFlag ? t("saveNowBtn") : t("saveNowSaved"); }
  setTimeout(() => { const b3 = document.getElementById("saveNowBtn"); if(b3) b3.textContent = t("saveNowBtn"); }, SAVE_BUTTON_RESET_MS);
}
async function signOutCloud(){
  clearTimeout(autoSaveTimer); cancelRetry();
  if(dirty) await writeStateToCloud();
  if(dirty && !confirm(t("signOutUnsavedWarn"))){ updateSaveStatus(); return false; }
  if(cloudClient) await cloudClient.auth.signOut();
  if(cloudSession) clearEncPw(cloudSession.user.id);
  cloudSession = null; encryptionPassword = null; dirty = false; lastSeenCiphertext = null;
  state = emptyState();
  setProfilePanel(false); setNavDrawer(false);
  renderAuthGate();
  return true;
}

/* ================= AUTH GATE ================= */
let authGateMode = "signin";
function authGateHTML(inner){ return `<div class="auth-gate-box"><div class="auth-gate-title">Tembo</div><div class="auth-gate-tagline">${escapeHtml(t("tagline"))}</div>${inner}</div>`; }
function wireEnterSubmit(container){
  if(!container || container.dataset.enterWired) return;
  container.dataset.enterWired = "1";
  container.addEventListener("keydown", e => {
    if(e.key !== "Enter" || e.isComposing) return;
    const f = e.target;
    if(!f || f.tagName !== "INPUT" || ["checkbox","radio","button","submit","file"].includes(f.type)) return;
    const block = f.closest("[data-submit-block]") || container;
    const btn = block.querySelector("button.primary:not([disabled])");
    if(!btn) return;
    e.preventDefault(); btn.click();
  });
}
function renderAuthGate(){
  const el = document.getElementById("authGate");
  applyMode();
  wireEnterSubmit(el);
  if(!cloudClient){ el.style.display = "flex"; el.innerHTML = authGateHTML(`<p class="auth-gate-error">${escapeHtml(t("supabaseLibError"))}</p>`); return; }
  if(!cloudSession){ el.style.display = "flex"; renderLoginForm(); return; }
  if(!encryptionPassword){ el.style.display = "flex"; renderEncryptionPrompt(); return; }
  el.style.display = "none";
}
function renderLoginForm(){
  const el = document.getElementById("authGate");
  const isSignUp = authGateMode === "signup";
  el.innerHTML = authGateHTML(`
    <p class="auth-gate-subtitle">${escapeHtml(t("loginSubtitle"))}</p>
    <div id="authGateError" class="auth-gate-error" style="display:none;"></div>
    <div id="authGateNotice" class="auth-gate-notice" style="display:none;"></div>
    <label>${t("loginEmailLabel")}<input type="email" id="authEmailInput" autocomplete="username" /></label>
    <label>${t("loginPasswordLabel")}<input type="password" id="authPasswordInput" autocomplete="${isSignUp ? "new-password" : "current-password"}" /></label>
    <button id="authSubmitBtn" class="primary">${isSignUp ? t("loginSignUpBtn") : t("loginSignInBtn")}</button>
    <button id="authToggleModeBtn" class="ghost">${isSignUp ? t("loginToggleToSignIn") : t("loginToggleToSignUp")}</button>`);
  document.getElementById("authToggleModeBtn").onclick = () => { authGateMode = isSignUp ? "signin" : "signup"; renderLoginForm(); };
  document.getElementById("authSubmitBtn").onclick = async () => {
    const email = document.getElementById("authEmailInput").value.trim();
    const password = document.getElementById("authPasswordInput").value;
    const errEl = document.getElementById("authGateError"), noticeEl = document.getElementById("authGateNotice");
    errEl.style.display = "none"; noticeEl.style.display = "none";
    const btn = document.getElementById("authSubmitBtn"); btn.disabled = true;
    try{
      if(isSignUp){
        const { data, error } = await cloudClient.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){ noticeEl.textContent = t("loginConfirmEmailNotice"); noticeEl.style.display = "block"; btn.disabled = false; return; }
        cloudSession = data.session;
      } else {
        const { data, error } = await cloudClient.auth.signInWithPassword({ email, password });
        if(error) throw error;
        cloudSession = data.session;
      }
      renderAuthGate();
    }catch(err){
      errEl.textContent = t("loginErrorPrefix") + (err.message || String(err));
      errEl.style.display = "block"; btn.disabled = false;
    }
  };
  setTimeout(() => { const i = document.getElementById("authEmailInput"); if(i) i.focus(); }, 0);
}
function acceptDecrypted(decrypted, pw){
  state = decrypted; migrateState();
  encryptionPassword = pw;
  saveEncPw(cloudSession.user.id, pw);
  renderAuthGate();
  bootApp();
}
function renderEncryptionPrompt(){
  const el = document.getElementById("authGate");
  el.innerHTML = authGateHTML(`<p class="auth-gate-subtitle">${t("checking")}</p>`);
  cloudClient.from(TABLE).select("*").eq("user_id", cloudSession.user.id).maybeSingle().then(({ data, error }) => {
    if(error){
      el.innerHTML = authGateHTML(`<p class="auth-gate-error">${escapeHtml(error.message || String(error))}</p>
        <button id="cloudRetryBtn">${t("retryBtn")}</button><button id="authSignOutBtn" class="ghost">${t("logoutBtn")}</button>`);
      document.getElementById("cloudRetryBtn").onclick = () => renderAuthGate();
      document.getElementById("authSignOutBtn").onclick = () => signOutCloud();
      return;
    }
    if(data){
      lastSeenCiphertext = data.ciphertext;
      const remembered = loadEncPw(cloudSession.user.id);
      if(remembered){
        decryptState(data, remembered).then(d => acceptDecrypted(d, remembered)).catch(() => { clearEncPw(cloudSession.user.id); renderEncryptionExisting(data); });
        return;
      }
      renderEncryptionExisting(data);
    } else {
      lastSeenCiphertext = null;
      renderEncryptionNew();
    }
  });
}
function renderEncryptionExisting(record){
  const el = document.getElementById("authGate");
  el.innerHTML = authGateHTML(`
    <div class="auth-gate-title2">${t("encTitleExisting")}</div>
    <p class="auth-gate-subtitle">${escapeHtml(t("encSubExisting"))}</p>
    <div id="encError" class="auth-gate-error" style="display:none;"></div>

    <button id="encSubmitBtn" class="primary">${t("encOpenBtn")}</button>
    <button id="authSignOutBtn" class="ghost">${t("logoutBtn")}</button>`);
  const input = document.getElementById("encPwInput"); input.focus();
  document.getElementById("authSignOutBtn").onclick = () => signOutCloud();
  document.getElementById("encSubmitBtn").onclick = async () => {
    const btn = document.getElementById("encSubmitBtn"), err = document.getElementById("encError");
    btn.disabled = true; err.style.display = "none";
    try{ const d = await decryptState(record, input.value); acceptDecrypted(d, input.value); }
    catch(e){ err.textContent = t("encWrong"); err.style.display = "block"; btn.disabled = false; input.select(); }
  };
}
function renderEncryptionNew(){
  const el = document.getElementById("authGate");
  el.innerHTML = authGateHTML(`
    <div class="auth-gate-title2">${t("encTitleNew")}</div>
    <p class="auth-gate-subtitle">${escapeHtml(t("encSubNew"))}</p>
    <div class="auth-gate-warn">${escapeHtml(t("encWarn"))}</div>
    <div id="encError" class="auth-gate-error" style="display:none;"></div>
    <label>${t("encPw")}<input type="password" id="encPwInput" autocomplete="new-password" /></label>

    <label class="radio"><input type="radio" name="startChoice" value="baseline" checked /> ${escapeHtml(t("startBaseline"))}</label>
    <label class="radio"><input type="radio" name="startChoice" value="empty" /> ${escapeHtml(t("startEmpty"))}</label>
    <button id="encSubmitBtn" class="primary">${t("encCreateBtn")}</button>

  document.getElementById("encPwInput").focus();
  document.getElementById("authSignOutBtn").onclick = () => signOutCloud();
  document.getElementById("encSubmitBtn").onclick = async () => {
    const pw = document.getElementById("encPwInput").value, pw2 = document.getElementById("encPwInput2").value;
    const err = document.getElementById("encError"), btn = document.getElementById("encSubmitBtn");
    err.style.display = "none";
    if(pw.length < 8){ err.textContent = t("encTooShort"); err.style.display = "block"; return; }
    if(pw !== pw2){ err.textContent = t("encMismatch"); err.style.display = "block"; return; }
    btn.disabled = true;
    const choice = (document.querySelector('input[name="startChoice"]:checked') || {}).value;
    const lang = state.lang, dark = state.darkMode;
    state = choice === "empty" ? emptyState() : baselineState();
    state.lang = lang; state.darkMode = dark;
    encryptionPassword = pw;
    saveEncPw(cloudSession.user.id, pw);
    renderAuthGate();
    bootApp();
    dirty = true; stateGeneration++;

  };
}

function wireTable(){
  document.querySelectorAll(".rtable tbody tr").forEach(tr => {
    const m = state.metingen.find(x => x.id === tr.dataset.id);
    if(!m) return;
    tr.querySelectorAll("[data-f]").forEach(inp => {
      if(inp.dataset.f === "datum") inp.addEventListener("blur", () => { if(!validISODate(inp.value)) inp.value = m.datum; else if(inp.value !== m.datum) inp.dispatchEvent(new Event("change")); });
      inp.addEventListener("change", () => {
        const f = inp.dataset.f;
        if(f === "binnen" || f === "buiten"){
          const n = parseNum(inp.value);
          if(n === null){ inp.value = String(m[f]); return; }
          m[f] = n;
          if(f === "buiten") m.buitenBron = "handmatig";
        } else if(f === "datum"){
          if(!inp.value){ inp.value = m.datum; return; }
          if(!validISODate(inp.value)) return;          // jaartal nog niet compleet
          if(inp.value === m.datum) return;
          m.datum = inp.value;
        } else m[f] = inp.value.trim ? inp.value.trim() : inp.value;
        scheduleAutoSave();
        renderAll({ keepFocus: { id: m.id, f } });
      });
    });
    tr.querySelector(".row-del").onclick = () => {
      if(!confirm(t("deleteConfirm"))) return;
      state.metingen = state.metingen.filter(x => x.id !== m.id);
      scheduleAutoSave();
      if(state.activeView.type === "month" && !state.metingen.some(x => monthKey(x.datum) === state.activeView.key)) state.activeView = { type:"overview" };
      renderAll();
    };
  });
}

/* ================= GRAFIEKEN (eigen SVG, geen library) ================= */
function niceTicks(min, max, count){
  if(min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(s => s*mag).find(s => s >= step0) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const ticks = []; for(let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v*100)/100);
  return { lo, hi, ticks };
}
function chartWidth(el){ return Math.max(300, Math.round(el.clientWidth || 600)); }
function attachTooltip(wrap){
  const tt = document.createElement("div"); tt.className = "chart-tooltip"; wrap.appendChild(tt);
  return {
    show(html, x, y){
      tt.innerHTML = html; tt.style.opacity = "1";
      const w = wrap.clientWidth, tw = tt.offsetWidth;
      tt.style.left = Math.max(0, Math.min(w - tw, x - tw/2)) + "px";
      tt.style.top = Math.max(0, y - tt.offsetHeight - 14) + "px";
    },
    hide(){ tt.style.opacity = "0"; }
  };
}
function ttRow(color, label, val){ return `<div class="tt-row"><span><i class="tt-key" style="background:${color}"></i>${escapeHtml(label)}</span><span class="tt-val">${val}</span></div>`; }

function drawTimeChart(el, list){
  if(!el) return;
  if(list.length < 2){ el.innerHTML = `<div class="chart-empty">${escapeHtml(t("chartNeed"))}</div>`; return; }
  const W = chartWidth(el), H = Math.round(Math.min(320, Math.max(220, W*0.42)));
  const m = { l:42, r:62, t:14, b:30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = list.map(tsOf);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const all = list.flatMap(p => [p.binnen, p.buiten]);
  const yt = niceTicks(Math.min(...all), Math.max(...all), 5);
  const X = v => m.l + (x1 === x0 ? iw/2 : (v - x0) / (x1 - x0) * iw);
  const Y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  const cIn = "var(--c-binnen)", cOut = "var(--c-buiten)";
  // x-as: dagen
  const dayMs = 86400000;
  const firstDay = new Date(x0); firstDay.setHours(0,0,0,0);
  const days = []; for(let d = firstDay.getTime(); d <= x1; d += dayMs){ if(d >= x0 - dayMs) days.push(d); }
  const maxLabels = Math.max(2, Math.floor(iw / 70));
  const every = Math.max(1, Math.ceil(days.length / maxLabels));
  let grid = yt.ticks.map(v => `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" /><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v.toLocaleString(state.lang==="en"?"en-GB":"nl-NL")}°</text>`).join("");
  const isoOfTs = ts => { const dt = new Date(ts); return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; };
  const inRange = days.filter((d,i) => d >= x0 && !(i % every));
  grid += inRange.map(d => `<line x1="${X(d)}" x2="${X(d)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)" /><text x="${X(d)}" y="${H-10}" text-anchor="middle">${escapeHtml(fmtDate(isoOfTs(d)))}</text>`).join("");
  // Eerste dag begint vóór middernacht-lijn in beeld? Dan het eerste punt zelf labelen (als er ruimte is).
  if(!inRange.length || X(inRange[0]) - X(x0) > 60) grid += `<text x="${X(x0)}" y="${H-10}" text-anchor="start">${escapeHtml(fmtDate(isoOfTs(x0)))}</text>`;
  // isolatiemarkering
  let iso = "";
  if(state.settings.isolatieDatum){
    const [y,mo,d] = state.settings.isolatieDatum.split("-").map(Number);
    const it = new Date(y, mo-1, d).getTime();
    if(it >= x0 && it <= x1) iso = `<line x1="${X(it)}" x2="${X(it)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-soft)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${X(it)+5}" y="${m.t+11}" class="lbl-strong">${escapeHtml(t("lIsolatie"))}</text>`;
  }
  const path = key => list.map((p,i) => `${i?"L":"M"}${X(tsOf(p)).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  const dots = (key, c) => list.map(p => `<circle cx="${X(tsOf(p))}" cy="${Y(p[key])}" r="4" fill="${c}" stroke="var(--paper)" stroke-width="2"/>`).join("");
  const last = list[list.length-1];
  let ly1 = Y(last.binnen), ly2 = Y(last.buiten);
  if(Math.abs(ly1-ly2) < 14){ const mid = (ly1+ly2)/2; if(ly1 <= ly2){ ly1 = mid-7; ly2 = mid+7; } else { ly1 = mid+7; ly2 = mid-7; } }
  const lx = X(tsOf(last)) + 9;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t("chartTime"))}">
    ${grid}${iso}
    <path d="${path("buiten")}" fill="none" stroke="${cOut}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path("binnen")}" fill="none" stroke="${cIn}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots("buiten", cOut)}${dots("binnen", cIn)}
    <text x="${lx}" y="${ly1+4}" class="lbl-strong">${escapeHtml(t("lBinnen"))}</text>
    <text x="${lx}" y="${ly2+4}" class="lbl-strong">${escapeHtml(t("lBuiten"))}</text>
    <line id="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-soft)" stroke-width="1" opacity="0"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg>`;
  el.innerHTML = `<div class="chart-legend"><span class="key"><i class="sw" style="background:${cIn}"></i>${t("lBinnen")}</span><span class="key"><i class="sw" style="background:${cOut}"></i>${t("lBuiten")}</span>${iso ? `<span class="key"><i class="sw dash"></i>${t("lIsolatie")}</span>` : ""}</div><div class="chart-wrap">${svg}</div>`;
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = attachTooltip(wrap);
  const xh = svgEl.querySelector("#xhair");
  const onMove = ev => {
    const r = svgEl.getBoundingClientRect(), scale = W / r.width;
    const px = (ev.clientX - r.left) * scale;
    let best = list[0], bd = Infinity;
    list.forEach(p => { const d = Math.abs(X(tsOf(p)) - px); if(d < bd){ bd = d; best = p; } });
    const bx = X(tsOf(best));
    xh.setAttribute("x1", bx); xh.setAttribute("x2", bx); xh.setAttribute("opacity", "0.5");
    tip.show(`<div class="tt-head">${escapeHtml(fmtDate(best.datum, true))}${best.tijd ? " · " + escapeHtml(best.tijd) : ""}</div>
      ${ttRow(cIn, t("lBinnen"), fmtT(best.binnen))}${ttRow(cOut, t("lBuiten"), fmtT(best.buiten))}
      <div class="tt-row"><span>${t("thVerschil")}</span><span class="tt-val">${fmtDelta(best.binnen - best.buiten)}</span></div>`,
      bx / scale, Y(Math.max(best.binnen, best.buiten)) / scale);
  };
  const hit = svgEl.querySelector("#hit");
  hit.addEventListener("pointermove", onMove);
  hit.addEventListener("pointerdown", onMove);
  hit.addEventListener("pointerleave", () => { tip.hide(); xh.setAttribute("opacity","0"); });
}

function drawScatterChart(el, list){
  if(!el) return;
  if(list.length < 2){ el.innerHTML = `<div class="chart-empty">${escapeHtml(t("chartNeed"))}</div>`; return; }
  const hasIso = !!state.settings.isolatieDatum;
  const groups = hasIso
    ? [{ key:"voor", label:t("lVoor"), color:"var(--c-voor)", pts:list.filter(p=>phaseOf(p)==="voor") }, { key:"na", label:t("lNa"), color:"var(--c-na)", pts:list.filter(p=>phaseOf(p)==="na") }].filter(g => g.pts.length)
    : [{ key:"alle", label:t("lAlle"), color:"var(--accent)", pts:list }];
  const W = chartWidth(el), H = Math.round(Math.min(320, Math.max(220, W*0.42)));
  const m = { l:42, r:16, t:28, b:36 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xt = niceTicks(Math.min(...list.map(p=>p.buiten)), Math.max(...list.map(p=>p.buiten)), 6);
  const yt = niceTicks(Math.min(...list.map(p=>p.binnen)), Math.max(...list.map(p=>p.binnen)), 5);
  const X = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  const Y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  const nf = v => v.toLocaleString(state.lang==="en"?"en-GB":"nl-NL");
  let grid = yt.ticks.map(v => `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${nf(v)}°</text>`).join("");
  grid += xt.ticks.map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)"/><text x="${X(v)}" y="${m.t+ih+16}" text-anchor="middle">${nf(v)}°</text>`).join("");
  grid += `<text x="${m.l+iw}" y="${H-2}" text-anchor="end">${escapeHtml(t("lBuiten"))} →</text><text x="${m.l-34}" y="${m.t-16}">${escapeHtml(t("lBinnen"))} ↑</text>`;
  let lines = "", dots = "";
  groups.forEach(g => {
    const reg = linReg(g.pts.map(p => ({ x:p.buiten, y:p.binnen })));
    if(reg && g.pts.length >= 3) lines += `<line x1="${X(reg.minX)}" y1="${Y(reg.a+reg.b*reg.minX)}" x2="${X(reg.maxX)}" y2="${Y(reg.a+reg.b*reg.maxX)}" stroke="${g.color}" stroke-width="2" stroke-dasharray="6 4" opacity=".85"/>`;
    dots += g.pts.map(p => `<circle cx="${X(p.buiten)}" cy="${Y(p.binnen)}" r="5" fill="${g.color}" stroke="var(--paper)" stroke-width="2" data-id="${p.id}" data-g="${g.key}"/>`).join("");
  });
  el.innerHTML = `<div class="chart-legend">${groups.map(g => `<span class="key"><i class="sw dot" style="background:${g.color}"></i>${escapeHtml(g.label)} (${g.pts.length})</span>`).join("")}</div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t("chartScatter"))}">${grid}${lines}${dots}</svg></div>`;
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = attachTooltip(wrap);
  svgEl.addEventListener("pointermove", ev => {
    const r = svgEl.getBoundingClientRect(), scale = W / r.width;
    const px = (ev.clientX - r.left) * scale, py = (ev.clientY - r.top) * scale;
    let best = null, bd = 18;
    list.forEach(p => { const d = Math.hypot(X(p.buiten) - px, Y(p.binnen) - py); if(d < bd){ bd = d; best = p; } });
    if(!best){ tip.hide(); return; }
    const g = groups.find(gg => gg.pts.includes(best));
    tip.show(`<div class="tt-head">${escapeHtml(fmtDate(best.datum, true))}${best.tijd ? " · " + escapeHtml(best.tijd) : ""}</div>
      ${ttRow(g.color, t("lBinnen"), fmtT(best.binnen))}${ttRow(g.color, t("lBuiten"), fmtT(best.buiten))}`, X(best.buiten)/scale, Y(best.binnen)/scale);
  });
  svgEl.addEventListener("pointerleave", () => tip.hide());
}

function excelSerialToDate(n){ const ms = Math.round((n - 25569) * 86400000); const d = new Date(ms); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes()); }
function normDate(v){
  if(v === null || v === undefined || v === "") return null;
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  if(typeof v === "number" && v > 20000 && v < 80000){ const d = excelSerialToDate(v); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if(m){ const y = m[3].length === 2 ? "20"+m[3] : m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
  return null;
}
function normTime(v){
  if(v === null || v === undefined || v === "") return "";
  if(v instanceof Date && !isNaN(v)) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
  if(typeof v === "number" && v >= 0 && v < 1){ const mins = Math.round(v * 1440); return `${pad2(Math.floor(mins/60)%24)}:${pad2(mins%60)}`; }
  const m = String(v).trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? `${pad2(m[1])}:${m[2]}` : "";
}
function detectColumns(header){
  const h = header.map(x => String(x || "").toLowerCase().trim());
  const find = re => h.findIndex(x => re.test(x));
  return {
    datum: find(/datum|date|dag/),
    tijd: find(/tijd|time|uur/),
    buiten: find(/buiten|outdoor|outside|buitentemp/),
    binnen: (() => { const i = find(/binnen|indoor|inside|woonkamer|kamer|living/); return i >= 0 ? i : h.findIndex((x,idx) => /temp/.test(x) && !/buiten|outdoor|outside/.test(x) && idx !== find(/buiten|outdoor|outside/)); })(),
    ruimte: find(/ruimte|room|locatie/),
    notitie: find(/notitie|note|opmerking/),
    verwarming: find(/verwarming|heating|airco/),
  };
}
function ruimteFromHeader(label){ const m = String(label||"").match(/temp(?:eratuur)?\s+(.+)/i); if(m && !/binnen|indoor|inside/i.test(m[1])) return m[1].trim().charAt(0).toUpperCase() + m[1].trim().slice(1); return null; }
function importRows(rows){
  let hi = rows.findIndex(r => r && r.some(c => /datum|date/i.test(String(c||""))));
  if(hi < 0) hi = 0;
  const cols = detectColumns(rows[hi] || []);
  if(cols.binnen < 0 || cols.buiten < 0 || cols.datum < 0) throw new Error(t("importNoCols"));
  const defRuimte = ruimteFromHeader(rows[hi][cols.binnen]) || state.settings.defaultRuimte;
  const existing = new Set(state.metingen.map(m => `${m.datum}|${m.tijd}|${(m.ruimte||"").toLowerCase()}`));
  let added = 0, dup = 0, empty = 0;
  rows.slice(hi+1).forEach(r => {
    if(!r || r.every(c => c === null || c === undefined || c === "")) return;
    const datum = normDate(r[cols.datum]);
    const binnen = parseNum(r[cols.binnen]), buiten = parseNum(r[cols.buiten]);
    if(!datum || binnen === null || buiten === null){ empty++; return; }
    const tijd = cols.tijd >= 0 ? normTime(r[cols.tijd]) : "";
    const ruimte = (cols.ruimte >= 0 && r[cols.ruimte]) ? String(r[cols.ruimte]).trim() : defRuimte;
    const key = `${datum}|${tijd}|${ruimte.toLowerCase()}`;
    if(existing.has(key)){ dup++; return; }
    existing.add(key);
    const vw = cols.verwarming >= 0 ? String(r[cols.verwarming]||"").toLowerCase() : "";
    state.metingen.push({ id:newId(), datum, tijd, binnen, buiten, ruimte,
      verwarming: /aan|on|ja|yes|1/.test(vw) ? "aan" : /uit|off|nee|no|0/.test(vw) ? "uit" : "",
      notitie: cols.notitie >= 0 ? String(r[cols.notitie]||"").trim() : "" });
    added++;
  });
  return { added, dup, empty };
}
function parseCsv(text){
  const first = text.split(/\r?\n/)[0] || "";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* ================= BUITENTEMPERATUUR ONLINE (Open-Meteo) =================
   Geen achtergrondtaak en geen 92 dagen vooruit ophalen: alleen de buitentemperatuur voor het uur
   van de meting die je op dat moment invoert. Recente datums via de forecast-API (die ook de
   afgelopen weken bevat), oudere datums via de archief-API. Tussen twee hele uren wordt lineair
   geïnterpoleerd (bijv. 13:10 → 5/6 van 13:00 + 1/6 van 14:00). */
let formBuitenMode = "eigen", formBuitenFetched = null, fetchSeq = 0, formModeTouched = false;
const weatherCache = {};
function addDaysISO(iso, n){ const [y,m,d] = iso.split("-").map(Number); const dt = new Date(y, m-1, d + n); return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function daysBetween(a, b){ const pa = a.split("-").map(Number), pb = b.split("-").map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000); }
async function fetchHourly(loc, datum){
  const key = `${loc.lat.toFixed(3)},${loc.lon.toFixed(3)},${datum}`;
  if(weatherCache[key]) return weatherCache[key];
  const pr = fetchHourlyUncached(loc, datum).catch(err => { delete weatherCache[key]; throw err; });
  weatherCache[key] = pr;   // lopende aanvraag delen i.p.v. dezelfde dag twee keer op te halen
  return pr;
}
async function fetchHourlyUncached(loc, datum){
  const ago = daysBetween(datum, todayISO());
  if(ago < -14) throw new Error("te ver in de toekomst");
  const base = ago > 60 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  // Afgerond op 2 decimalen (~1 km): ruim nauwkeurig voor een weermodel met ~2 km-raster, en je
  // exacte adres gaat zo nooit naar Open-Meteo.
  const url = `${base}?latitude=${loc.lat.toFixed(2)}&longitude=${loc.lon.toFixed(2)}&hourly=temperature_2m&timezone=auto&start_date=${datum}&end_date=${addDaysISO(datum, 1)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if(!data.hourly || !Array.isArray(data.hourly.time)) throw new Error("onverwacht antwoord");
  const map = {};
  data.hourly.time.forEach((tm, i) => { const v = data.hourly.temperature_2m[i]; if(v !== null && v !== undefined) map[tm] = v; });
  return map;
}
async function fetchOutdoorTemp(loc, datum, tijd){
  const [h, mi] = (tijd || "12:00").split(":").map(Number);
  const map = await fetchHourly(loc, datum);
  const k0 = `${datum}T${pad2(h)}:00`;
  const k1 = h === 23 ? `${addDaysISO(datum,1)}T00:00` : `${datum}T${pad2(h+1)}:00`;
  const v0 = map[k0], v1 = map[k1], f = (mi || 0) / 60;
  if(v0 === undefined) return null;
  const v = (v1 === undefined || f === 0) ? v0 : v0 + (v1 - v0) * f;
  return Math.round(v * 10) / 10;
}
function setSrcHint(text, cls){ const el = document.getElementById("fBuitenSrc"); if(el){ el.textContent = text || ""; el.className = "src-hint" + (cls ? " " + cls : ""); } }
function setBuitenMode(mode, userClick){
  const fB = document.getElementById("fBuiten");
  if(!fB) return;
  if(!state.settings.locatie) mode = "eigen";
  const prev = formBuitenMode;
  formBuitenMode = mode;
  document.querySelectorAll(".src-choice button").forEach(b => { b.classList.toggle("on", b.dataset.src === mode); b.setAttribute("aria-checked", b.dataset.src === mode ? "true" : "false"); });
  fB.readOnly = mode === "online";
  if(mode === "eigen"){
    // Overstappen van Online naar Eigen: veld leegmaken zodat je niet per ongeluk de online waarde bewaart.
    if(userClick && prev === "online"){ fB.value = ""; fB.focus(); }
    if(!state.settings.locatie){ setSrcHint(state.settings.autoBuiten ? t("srcNoLoc") : ""); }
    else setSrcHint(t("srcOwnHint")(formBuitenFetched === null ? null : fmtT(formBuitenFetched)));
  }
  autoFillBuiten();
}
async function autoFillBuiten(){
  const fB = document.getElementById("fBuiten");
  const loc = state.settings.locatie;
  if(!fB || !loc) return;
  const datum = document.getElementById("fDatum").value, tijd = document.getElementById("fTijd").value;
  if(!validISODate(datum)) return;
  const seq = ++fetchSeq;
  // Ook bij "Eigen meting" halen we de online waarde op (en bewaren die mee), zodat je later je
  // eigen thermometer met het weermodel kunt vergelijken.
  if(formBuitenMode === "online"){ fB.value = ""; setSrcHint(t("srcFetching")); }
  try{
    const v = await fetchOutdoorTemp(loc, datum, tijd);
    if(seq !== fetchSeq || !document.getElementById("fBuiten")) return;
    formBuitenFetched = v;
    if(formBuitenMode === "online"){
      if(v === null){ setSrcHint(t("srcFail"), "err"); return; }
      document.getElementById("fBuiten").value = String(v).replace(".", state.lang === "en" ? "." : ",");
      setSrcHint(t("srcOnline")(fmtT(v), loc.naam), "online");
    } else {
      setSrcHint(t("srcOwnHint")(v === null ? null : fmtT(v)));
    }
  }catch(err){
    if(seq !== fetchSeq) return;
    console.warn("Buitentemperatuur ophalen mislukt:", err);
    formBuitenFetched = null;
    if(formBuitenMode === "online"){ setSrcHint(t("srcFail"), "err"); setBuitenMode("eigen", true); setSrcHint(t("srcFail"), "err"); }
  }
}
/* Locatie zoeken: PDOK Locatieserver (Nederlandse overheid: adressen, postcodes met huisnummer,
   straten, wijken, buurten, plaatsen) en Open-Meteo/GeoNames (plaatsen wereldwijd) tegelijk.
   PDOK-resultaten eerst. Faalt één van de twee, dan tonen we gewoon de andere. */
async function searchLocations(q){
  const pdok = fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${encodeURIComponent(q)}&rows=6&fl=weergavenaam,centroide_ll,type`)
    .then(r => r.json())
    .then(d => ((d && d.response && d.response.docs) || []).map(doc => {
      const m = /POINT\(([-\d.]+) ([-\d.]+)\)/.exec(doc.centroide_ll || "");
      if(!m) return null;
      return { bron: pdokTypeLabel(doc.type), label: doc.weergavenaam, naam: doc.weergavenaam, lat: Number(m[2]), lon: Number(m[1]) };
    }).filter(Boolean))
    .catch(() => []);
  const om = fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=4&language=${state.lang}&format=json`)
    .then(r => r.json())
    .then(d => ((d && d.results) || []).map(r => ({ bron: t("locSrcPlace"), label: [r.name, r.admin2 && r.admin2 !== r.name ? r.admin2 : null, r.admin1, r.country_code].filter(Boolean).join(", "), naam: r.name, lat: r.latitude, lon: r.longitude })))
    .catch(() => []);
  const [a, b] = await Promise.all([pdok, om]);
  // Dubbele plaatsen (zelfde naam, binnen ~2 km) uit Open-Meteo weglaten als PDOK ze al heeft.
  const extra = b.filter(x => !a.some(y => Math.abs(y.lat - x.lat) < 0.02 && Math.abs(y.lon - x.lon) < 0.03 && y.label.toLowerCase().includes(x.naam.toLowerCase())));
  return a.concat(extra);
}
function pdokTypeLabel(type){
  const nl = { adres:"Adres", postcode:"Postcode", weg:"Straat", woonplaats:"Plaats", buurt:"Buurt", wijk:"Wijk", gemeente:"Gemeente", provincie:"Provincie" };
  const en = { adres:"Address", postcode:"Postcode", weg:"Street", woonplaats:"Town", buurt:"Neighbourhood", wijk:"District", gemeente:"Municipality", provincie:"Province" };
  return ((state.lang === "en" ? en : nl)[type]) || type || "";
}
function wireLocationSettings(){
  const setLoc = loc => { state.settings.locatie = loc; formModeTouched = false; scheduleAutoSave(); renderAll(); };
  const results = document.getElementById("locResults");
  document.getElementById("locSearchBtn").onclick = async () => {
    const q = document.getElementById("locQuery").value.trim();
    if(q.length < 2) return;
    results.innerHTML = `<span class="none">${t("checking")}</span>`;
    const list = await searchLocations(q);
    if(!list.length){ results.innerHTML = `<span class="none">${escapeHtml(t("setLocNoResults"))}</span>`; return; }
    results.innerHTML = list.map((r, i) => `<button data-i="${i}"><span class="loc-src">${escapeHtml(r.bron)}</span>${escapeHtml(r.label)}</button>`).join("");
    results.querySelectorAll("button").forEach(b => b.onclick = () => { const r = list[Number(b.dataset.i)]; setLoc({ naam: r.naam, lat: r.lat, lon: r.lon }); });
  };
  document.getElementById("locGpsBtn").onclick = () => {
    if(!navigator.geolocation){ results.innerHTML = `<span class="none">—</span>`; return; }
    navigator.geolocation.getCurrentPosition(
      pos => setLoc({ naam: t("setLocGpsName"), lat: Math.round(pos.coords.latitude*1000)/1000, lon: Math.round(pos.coords.longitude*1000)/1000 }),
      err => { results.innerHTML = `<span class="none">${escapeHtml(err.message)}</span>`; },
      { timeout: 10000 });
  };
  const clr = document.getElementById("locClearBtn");
  if(clr) clr.onclick = () => setLoc(null);
  document.getElementById("setAuto").onchange = e => { state.settings.autoBuiten = e.target.checked; formModeTouched = false; scheduleAutoSave(); renderAll(); };
}

/* ================= PROFIELPANEEL ================= */
let profileTab = "settings";
function renderProfilePanel(){
  document.getElementById("profilePanelTitle").textContent = t("profileTitle");
  document.getElementById("profilePanelTabs").innerHTML = ["settings","account"].map(k => `<button class="profile-tab-btn ${profileTab===k?"active":""}" data-tab="${k}">${t(k==="account"?"tabAccount":"tabSettings")}</button>`).join("");
  document.querySelectorAll(".profile-tab-btn").forEach(b => b.onclick = () => { profileTab = b.dataset.tab; renderProfilePanel(); });
  const body = document.getElementById("profilePanelBody");
  wireEnterSubmit(body);
  if(profileTab === "settings"){
    body.innerHTML = `
      <div>
        <label class="profile-field">${t("setIso")}<input type="date" min="2000-01-01" max="2100-12-31" id="setIso" value="${escapeHtml(state.settings.isolatieDatum)}" /></label>
        <p class="profile-hint">${escapeHtml(t("setIsoHint"))}</p>
      </div>
      <div>
        <label class="profile-field">${t("setRef")}<input type="number" step="1" id="setRef" value="${escapeHtml(state.settings.refBuiten)}" /></label>
        <p class="profile-hint">${escapeHtml(t("setRefHint"))}</p>
      </div>
      <div><label class="profile-field">${t("setRuimte")}<input type="text" id="setRuimte" value="${escapeHtml(state.settings.defaultRuimte)}" /></label></div>
      <hr class="profile-divider">
      <div data-submit-block>
        <div class="profile-section-title">${t("setLoc")}</div>
        <div class="profile-current-email" id="locCurrent">${state.settings.locatie ? `${t("setLocCurrent")} ${escapeHtml(state.settings.locatie.naam)} <span class="profile-hint">(${state.settings.locatie.lat.toFixed(3)}, ${state.settings.locatie.lon.toFixed(3)})</span>` : escapeHtml(t("setLocNone"))}</div>
        <div class="loc-search-row"><input type="text" id="locQuery" placeholder="6411 AB 12 / Heerlen" /><button class="primary" id="locSearchBtn">${t("setLocSearch")}</button></div>
        <div class="loc-results" id="locResults"></div>
        <div class="loc-btn-row"><button id="locGpsBtn">${t("setLocGps")}</button>${state.settings.locatie ? `<button id="locClearBtn">${t("setLocClear")}</button>` : ""}</div>
        <p class="profile-hint">${escapeHtml(t("setLocHint"))}</p>
        <label class="profile-check"><input type="checkbox" id="setAuto" ${state.settings.autoBuiten ? "checked" : ""} /> ${escapeHtml(t("setAuto"))}</label>
      </div>`;
    wireLocationSettings();
    const isoInp = document.getElementById("setIso");
    const commitIso = () => {
      const v = isoInp.value;
      if(v !== "" && !validISODate(v)) return;          // nog bezig met typen
      if(v === state.settings.isolatieDatum) return;
      state.settings.isolatieDatum = v; scheduleAutoSave(); renderAll({ skipProfile: true });
    };
    isoInp.addEventListener("change", commitIso);
    isoInp.addEventListener("blur", commitIso);
    document.getElementById("setRef").onchange = e => { const n = parseNum(e.target.value); if(n !== null){ state.settings.refBuiten = n; scheduleAutoSave(); renderAll(); } };
    document.getElementById("setRuimte").onchange = e => { state.settings.defaultRuimte = e.target.value.trim() || "Woonkamer"; scheduleAutoSave(); renderAll(); };
  } else {
    const email = cloudSession ? cloudSession.user.email : "";
    body.innerHTML = `
      <div data-submit-block>
        <div class="profile-section-title">${t("accEmail")}</div>
        <div class="profile-current-email">${escapeHtml(email)}</div>
        <label class="profile-field">${t("accNewEmail")}<input type="email" id="accEmail" autocomplete="email" /></label>
        <button class="primary" id="accEmailBtn">${t("accUpdateEmail")}</button>
        <div id="accEmailMsg"></div>
      </div>
      <hr class="profile-divider">
      <div data-submit-block>
        <label class="profile-field">${t("accNewPw")}<input type="password" id="accPw" autocomplete="new-password" /></label>
        <p class="profile-hint">${escapeHtml(t("accPwHint"))}</p>
        <button class="primary" id="accPwBtn">${t("accUpdatePw")}</button>
        <div id="accPwMsg"></div>
      </div>
      <hr class="profile-divider">
      <div><button id="accLogout">${t("logoutBtn")}</button></div>`;
    const upd = async (payload, msgId) => {
      const box = document.getElementById(msgId);
      try{ const { error } = await cloudClient.auth.updateUser(payload); if(error) throw error; box.className = "profile-msg notice"; box.textContent = t("accUpdated"); }
      catch(err){ box.className = "profile-msg error"; box.textContent = err.message || String(err); }
    };
    document.getElementById("accEmailBtn").onclick = () => { const v = document.getElementById("accEmail").value.trim(); if(v) upd({ email:v }, "accEmailMsg"); };
    document.getElementById("accPwBtn").onclick = () => { const v = document.getElementById("accPw").value; if(v) upd({ password:v }, "accPwMsg"); };
    document.getElementById("accLogout").onclick = signOutCloud;
  }
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));
}

/* ================= RENDER ================= */
function applyMode(){
  document.documentElement.setAttribute("data-mode", state.darkMode ? "dark" : "light");
  document.documentElement.lang = state.lang;
  const moon = document.getElementById("modeIconMoon"), sun = document.getElementById("modeIconSun");
  if(moon){ moon.style.display = state.darkMode ? "none" : ""; sun.style.display = state.darkMode ? "" : "none"; }
}
function renderAll(opts){
  applyMode();
  document.getElementById("mainTitle").textContent = t("tagline");
  document.getElementById("navDrawerTitle").textContent = t("navTitle");
  renderTabs();
  renderMain();
  renderSummary();
  if(document.getElementById("profilePanel").classList.contains("open") && !(opts && opts.skipProfile)) renderProfilePanel();
  if(opts && opts.keepFocus){
    const inp = document.querySelector(`tr[data-id="${opts.keepFocus.id}"] [data-f="${opts.keepFocus.f}"]`);
    if(inp) inp.focus();
  }
}
function bootApp(){
  state.activeView = { type:"overview" };
  dirty = false; stateGeneration = 0; savedGeneration = 0;
  renderAll();
}

/* ================= EVENTS ================= */
document.getElementById("navToggleBtn").onclick = () => setNavDrawer(true);
document.getElementById("navCloseBtn").onclick = () => setNavDrawer(false);
document.getElementById("navBackdrop").onclick = () => setNavDrawer(false);
document.getElementById("profileBtn").onclick = () => setProfilePanel(!document.getElementById("profilePanel").classList.contains("open"));
document.getElementById("profileCloseBtn").onclick = () => setProfilePanel(false);
document.getElementById("profileBackdrop").onclick = () => setProfilePanel(false);
document.addEventListener("keydown", e => { if(e.key === "Escape"){ setNavDrawer(false); setProfilePanel(false); } });
document.getElementById("modeBtn").onclick = () => { state.darkMode = !state.darkMode; scheduleAutoSave(); renderAll(); };
document.querySelectorAll(".lang-btn").forEach(b => b.onclick = () => { state.lang = b.dataset.lang; scheduleAutoSave(); renderAll(); });
document.getElementById("importFileInput").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if(f) handleImportFile(f); });
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if(encryptionPassword && state.activeView.type !== "import"){ const list = visibleMetingen(); drawTimeChart(document.getElementById("timeChart"), list); drawScatterChart(document.getElementById("scatterChart"), list); } }, 150); });

/* ================= START ================= */
(async function start(){
  try{ if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) state.darkMode = true; }catch(e){}
  applyMode();
  if(cloudClient){
    try{ const { data } = await cloudClient.auth.getSession(); cloudSession = data && data.session ? data.session : null; }catch(e){ cloudSession = null; }
  }
  renderAuthGate();
})();
</script>
