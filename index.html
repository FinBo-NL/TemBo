/* ---- Tijdgrafiek: periode, per-dag samenvatten, gaten, verschil-weergave ----
   Met veel metingen werd de grafiek een onleesbare zigzag (ochtend/middag/avond door elkaar), liep
   de lijn dwars over weken zonder metingen heen en verdween de kleine binnenvariatie op een as van
   0–25 °C. Nu: een periodekeuze (7 dagen / 30 dagen / 3 maanden / alles) met bladeren, bij meer
   dan 10 dagen per dag samengevat (binnen = daggemiddelde, buiten = band laagste–hoogste met het
   daggemiddelde), onderbroken lijnen bij gaten, en een schakelaar naar "verschil binnen − buiten"
   (één as, geen misleidende dubbele schaal). */
let timePeriod = "1";       // "1" | "7" | "30" | "90" | "all"   (schermvoorkeur, niet opgeslagen; standaard vandaag)
let timeZoom = null;        // null = voorkeuzeperiode; anders { start, end } na zoomen/verschuiven/bladeren
let timeView = "temp";      // "temp" | "diff"
const DAY = 86400000, HOUR = 3600000;
/* Maximaal inzoomen: tot uurniveau, waarbij één uur nooit breder wordt dan ~60 px. Verder
   inzoomen zou alleen de kolommen uitrekken zonder extra informatie. Op een telefoon (smalle
   grafiek) kom je zo tot ~5 uur in beeld, op de computer tot ~12 uur. */
const MAX_PX_PER_HOUR = 60;
let lastTimeIw = 700;
function minSpanMs(){ return Math.max(2 * HOUR, (lastTimeIw / MAX_PX_PER_HOUR) * HOUR); }
function dayStart(ts){ return tsFrom(tsToISO(ts), "00:00"); }
/* Grenzen waarbinnen je kunt zoomen en verschuiven: van de eerste tot na de laatste meting
   (of de gekozen maand in de maandweergave). */
function timeBounds(list){
  const v = state.activeView || {};
  if(v.type === "month"){
    const lo = tsFrom(v.key + "-01", "00:00");
    return { lo, hi: tsFrom(addDaysISO(v.key + "-01", 32).slice(0,7) + "-01", "00:00") };
  }
  // Altijd t/m vandaag, ook als de laatste meting van eerder is: de grafiek start op "vandaag".
  const latest = Math.max(list.length ? tsOf(list[list.length-1]) : 0, Date.now());
  const hi = tsFrom(addDaysISO(tsToISO(latest), 1), "00:00");
  const lo = list.length ? dayStart(tsOf(list[0])) : hi - 30*DAY;
  return { lo, hi };
}
function clampWin(start, end, b){
  let span = Math.max(minSpanMs(), end - start);
  if(span > end - start){ const c = (start + end) / 2; start = c - span / 2; }   // rond het midden begrenzen
  span = Math.min(span, Math.max(DAY, b.hi - b.lo));
  if(start < b.lo){ start = b.lo; }
  if(start + span > b.hi){ start = b.hi - span; }
  if(start < b.lo) start = b.lo;
  return { start, end: start + span };
}
function timeWindow(list){
  const v = state.activeView || {}, b = timeBounds(list);
  let w;
  if(timeZoom) w = clampWin(timeZoom.start, timeZoom.end, b);
  else if(v.type === "month" || timePeriod === "all") w = { start: b.lo, end: b.hi };
  else { const days = Number(timePeriod); w = { start: tsFrom(addDaysISO(tsToISO(b.hi - 1), -(days - 1)), "00:00"), end: b.hi }; }
  return Object.assign(w, { bounds: b, atFirst: w.start <= b.lo + 60000, atLatest: w.end >= b.hi - 60000 });
}
function fmtWinLabel(w){
  const span = w.end - w.start;
  const hm0 = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  // Ingezoomd binnen één dag (minder dan ~20 uur): datum plus van–tot-tijd.
  if(span < 20 * HOUR && tsToISO(w.start) === tsToISO(w.end - 1)) return `${fmtDate(tsToISO(w.start), true)} · ${hm0(w.start)}–${hm0(w.end)}`;
  if(span <= 1.05 * DAY && tsToISO(w.start) === tsToISO(w.end - 1)) return fmtDate(tsToISO(w.start), true);
  if(span < 3 * DAY){ const hm = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }; return `${fmtDate(tsToISO(w.start))} ${hm(w.start)} – ${fmtDate(tsToISO(w.end))} ${hm(w.end)}`; }
  return `${fmtDate(tsToISO(w.start), true)} – ${fmtDate(tsToISO(w.end - 1), true)}`;
}
function timeToolbarHTML(){
  const v = state.activeView || {};
  const list = visibleMetingen(), w = timeWindow(list);
  const presets = v.type === "month" ? "" : `<span class="seg small">${[["1","tp1"],["7","tp7"],["30","tp30"],["90","tp90"],["all","tpAll"]].map(([k,l]) => `<button type="button" data-tp="${k}" class="${!timeZoom && timePeriod===k?"on":""}">${t(l)}</button>`).join("")}</span>`;
  return `<div class="chart-toolbar">${presets}
    <span class="tnav"><button type="button" class="tnav-btn" data-tnav="-1" ${w.atFirst?"disabled":""} aria-label="${escapeHtml(t("tpPrev"))}">‹</button><span class="tnav-label" id="tnavLabel">${escapeHtml(fmtWinLabel(w))}</span><button type="button" class="tnav-btn" data-tnav="1" ${w.atLatest?"disabled":""} aria-label="${escapeHtml(t("tpNext"))}">›</button></span>
    <span class="tnav"><button type="button" class="tnav-btn" data-tzoom="out" aria-label="${escapeHtml(t("zoomOut"))}" title="${escapeHtml(t("zoomOut"))}">−</button><button type="button" class="tnav-btn" data-tzoom="in" aria-label="${escapeHtml(t("zoomIn"))}" title="${escapeHtml(t(w.end - w.start <= minSpanMs() + 60000 ? "zoomMax" : "zoomIn"))}" ${w.end - w.start <= minSpanMs() + 60000 ? "disabled" : ""}>+</button>${timeZoom ? `<button type="button" class="tnav-reset" data-tzoom="reset">${t("zoomReset")}</button>` : ""}</span>
    <span class="seg small">${["temp","diff"].map(k => `<button type="button" data-tview="${k}" class="${timeView===k?"on":""}">${t(k==="temp"?"tvTemp":"tvDiff")}</button>`).join("")}</span>
  </div>`;
}
function setZoom(start, end){
  const list = visibleMetingen(), b = timeBounds(list);
  timeZoom = clampWin(start, end, b);
}
function zoomAround(factor, centerTs){
  const w = timeWindow(visibleMetingen());
  const c = centerTs ?? (w.start + w.end) / 2;
  const f = (c - w.start) / (w.end - w.start);
  const span = (w.end - w.start) * factor;
  setZoom(c - f * span, c - f * span + span);
}
function wireTimeToolbar(){
  document.querySelectorAll("[data-tp]").forEach(b => b.onclick = () => { timePeriod = b.dataset.tp; timeZoom = null; refreshTimeCard(); });
  document.querySelectorAll("[data-tview]").forEach(b => b.onclick = () => { timeView = b.dataset.tview; refreshTimeCard(); });
  document.querySelectorAll("[data-tnav]").forEach(b => b.onclick = () => {
    if(b.disabled) return;
    const w = timeWindow(visibleMetingen()), span = w.end - w.start, dir = Number(b.dataset.tnav);
    // Staat de periode op hele dagen, blader dan per kalenderdag (anders schuift hij rond de
    // zomer-/wintertijd een uur op).
    const aligned = dayStart(w.start) === w.start && dayStart(w.end) === w.end;
    if(aligned){ const n = Math.round(span / DAY); const s0 = tsFrom(addDaysISO(tsToISO(w.start), dir * n), "00:00"); setZoom(s0, tsFrom(addDaysISO(tsToISO(s0), n), "00:00")); }
    else setZoom(w.start + dir * span, w.end + dir * span);
    refreshTimeCard();
  });
  document.querySelectorAll("[data-tzoom]").forEach(b => b.onclick = () => {
    const k = b.dataset.tzoom;
    if(b.disabled) return;
    if(k === "reset") timeZoom = null; else zoomAround(k === "in" ? 0.5 : 2);
    refreshTimeCard();
  });
}
function refreshTimeCard(){
  const bar = document.getElementById("timeToolbar");
  if(bar){ bar.innerHTML = timeToolbarHTML(); wireTimeToolbar(); }
  drawTimeChart(document.getElementById("timeChart"), visibleMetingen());
}
/* ---- Buitentemperatuur per uur (online) als achtergrondlijn bij inzoomen (≤ 7 dagen) ---- */
const weatherResolved = {};
function hourlyOnlineFor(w, onReady){
  const loc = state.settings.locatie;
  if(!loc || w.end - w.start > 7.5 * DAY) return null;
  const out = []; let missing = false;
  for(let d = tsToISO(w.start - HOUR); tsFrom(d, "00:00") <= w.end; d = addDaysISO(d, 1)){
    if(daysBetween(d, todayISO()) < -1) break;
    const key = `${loc.lat.toFixed(3)},${loc.lon.toFixed(3)},${d}`;
    const map = weatherResolved[key];
    if(map){ Object.keys(map).forEach(k => { const ts = keyToTs(k); if(k.startsWith(d) && ts >= w.start - HOUR && ts <= w.end + HOUR && ts <= Date.now()) out.push({ ts, v: map[k] }); }); }
    else { missing = true; fetchHourly(loc, d).then(m => { weatherResolved[key] = m; onReady(); }).catch(() => { weatherResolved[key] = {}; }); }
  }
  return out.sort((a, b) => a.ts - b.ts);
}
/* ---- Zoomen en verschuiven ----
   Mobiel: knijpen met twee vingers = zoomen, één vinger horizontaal slepen = verschuiven
   (verticaal scrollen van de pagina blijft werken dankzij touch-action: pan-y), dubbeltik = naar
   die dag. Computer: Ctrl + scrollwiel of touchpad-knijpen = zoomen, slepen = verschuiven,
   dubbelklik = naar die dag / verder inzoomen. De listeners zitten op de vaste container (#timeChart),
   omdat de SVG bij elk frame opnieuw wordt getekend. */
function wireTimeZoom(el){
  if(!el || el.dataset.zoomWired) return;
  el.dataset.zoomWired = "1";
  const pts = new Map();
  let g = null, raf = 0, lastTap = { t: 0, x: 0 };
  const geom = () => el._geom;
  const tsAt = clientX => { const G = geom(); if(!G) return null; const r = el.querySelector("svg").getBoundingClientRect(); const px = (clientX - r.left) * (G.W / r.width); return G.start + (px - G.m.l) / G.iw * (G.end - G.start); };
  const redraw = () => { if(raf) return; raf = requestAnimationFrame(() => { raf = 0; drawTimeChart(el, visibleMetingen(), true); const lbl = document.getElementById("tnavLabel"); if(lbl) lbl.textContent = fmtWinLabel(timeWindow(visibleMetingen())); }); };
  const finish = () => { const bar = document.getElementById("timeToolbar"); if(bar){ bar.innerHTML = timeToolbarHTML(); wireTimeToolbar(); } drawTimeChart(el, visibleMetingen()); };
  el.addEventListener("pointerdown", e => {
    if(!e.target.closest || !e.target.closest("svg")) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const w = timeWindow(visibleMetingen());
    el._gesture = true;
    if(pts.size === 1) g = { type:"pan", x0: e.clientX, y0: e.clientY, w0: { start: w.start, end: w.end }, moved: false };
    else if(pts.size === 2){ const [a, b] = [...pts.values()]; g = { type:"pinch", d0: Math.abs(a.x - b.x) || 1, c0: tsAt((a.x + b.x) / 2), w0: { start: w.start, end: w.end }, moved: true }; }
  });
  el.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const G = geom(); if(!G) return;
    const r = el.querySelector("svg").getBoundingClientRect(), pxPerMs = (r.width * G.iw / G.W) / (g.w0.end - g.w0.start);
    if(g.type === "pan" && pts.size === 1){
      const dx = e.clientX - g.x0;
      if(!g.moved && Math.abs(dx) < 6) return;
      g.moved = true;
      const shift = -dx / pxPerMs;
      setZoom(g.w0.start + shift, g.w0.end + shift); redraw();
    } else if(g.type === "pinch" && pts.size === 2){
      const [a, b] = [...pts.values()], d = Math.abs(a.x - b.x) || 1;
      const span = (g.w0.end - g.w0.start) * (g.d0 / d), f = (g.c0 - g.w0.start) / (g.w0.end - g.w0.start);
      setZoom(g.c0 - f * span, g.c0 - f * span + span); redraw();
    }
  });
  const up = e => {
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(g && g.type === "pan" && !g.moved && e.type === "pointerup"){
      // Tik/klik zonder slepen: dubbel = naar die dag (of verder inzoomen als je al op dagniveau zit).
      const now = Date.now();
      if(now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 30){
        const ts = tsAt(e.clientX), w = timeWindow(visibleMetingen());
        if(ts !== null){
          if(w.end - w.start > 1.5 * DAY){ const d0 = dayStart(ts); setZoom(d0, d0 + DAY); }
          else zoomAround(0.5, ts);
          finish();
        }
        lastTap = { t: 0, x: 0 };
      } else lastTap = { t: now, x: e.clientX };
    }
    if(pts.size === 0){ if(g && g.moved) finish(); g = null; el._gesture = false; }
    else if(pts.size === 1 && g && g.type === "pinch"){ const [p] = [...pts.values()]; const w = timeWindow(visibleMetingen()); g = { type:"pan", x0: p.x, y0: p.y, w0: { start: w.start, end: w.end }, moved: true }; }
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("wheel", e => {
    if(!(e.ctrlKey || e.metaKey)) return;             // gewoon scrollen blijft de pagina scrollen
    if(!e.target.closest || !e.target.closest("svg")) return;
    e.preventDefault();
    // ~20% per muiswieltik (deltaY ≈ 100); touchpad-knijpen geeft kleine delta's en zoomt dus vloeiend.
    zoomAround(Math.exp(Math.max(-3, Math.min(3, e.deltaY * 0.0022))), tsAt(e.clientX));
    redraw();
    clearTimeout(el._wheelT); el._wheelT = setTimeout(finish, 250);
  }, { passive: false });
  el.addEventListener("dblclick", e => e.preventDefault());
}
function drawTimeChart(el, listAll, fast){
  if(!el) return;
  wireTimeZoom(el);
  const w = timeWindow(listAll);
  const list = listAll.filter(m => { const ts = tsOf(m); return ts >= w.start && ts < w.end; });
  const hourly = (!fast || el._hourlyOk) ? hourlyOnlineFor(w, () => { if(document.getElementById("timeChart") === el) drawTimeChart(el, visibleMetingen()); }) : null;
  const span = (w.end - w.start) / DAY;
  const daily = span > 10.5;
  const diff = timeView === "diff";
  // Alle punten (ruw of per dag) over ALLE metingen, zodat we het eerste punt net buiten beeld aan
  // beide kanten kunnen meenemen: de lijn loopt dan door tot de rand en wordt daar afgesneden,
  // in plaats van te verdwijnen zodra het beginpunt van dat lijnstuk uit beeld schuift.
  let all;
  if(!daily){
    all = listAll.map(m => ({ ts: tsOf(m), bin: m.binnen, bu: m.buiten, d: m.binnen - m.buiten, m, n:1 }));
  } else {
    const byDay = {};
    listAll.forEach(m => { (byDay[m.datum] = byDay[m.datum] || []).push(m); });
    all = Object.keys(byDay).sort().map(d => { const a = byDay[d], bu = a.map(x => x.buiten), dd = a.map(x => x.binnen - x.buiten);
      return { ts: tsFrom(d, "12:00"), datum: d, bin: avg(a.map(x => x.binnen)), bu: avg(bu), buMin: Math.min(...bu), buMax: Math.max(...bu), d: avg(dd), dMin: Math.min(...dd), dMax: Math.max(...dd), n: a.length }; });
  }
  const gap = daily ? 1.6 * DAY : 36 * HOUR;
  let ia = all.findIndex(p => p.ts >= w.start); if(ia < 0) ia = all.length;
  let ib = all.findIndex(p => p.ts >= w.end); if(ib < 0) ib = all.length;
  const pts = all.slice(ia, ib);                       // punten ín beeld (tooltip, labels, stippen)
  let before = ia > 0 ? all[ia - 1] : null, after = ib < all.length ? all[ib] : null;
  const firstIn = pts.length ? pts[0] : after, lastIn = pts.length ? pts[pts.length - 1] : before;
  if(before && !(firstIn && firstIn.ts - before.ts <= gap)) before = null;
  if(after && !(lastIn && after.ts - lastIn.ts <= gap)) after = null;
  const drawPts = (before ? [before] : []).concat(pts, after ? [after] : []);
  if(!pts.length && !(before && after) && !(hourly && hourly.length)){
    el._geom = null;
    const isToday = w.start <= Date.now() && Date.now() < w.end && w.end - w.start <= 1.05 * DAY;
    el.innerHTML = `<div class="chart-empty">${escapeHtml(!listAll.length ? t("chartNeed") : isToday ? t("tpEmptyToday") : t("tpEmpty"))}</div>`;
    return;
  }
  const segs = []; drawPts.forEach((p, i) => { if(!i || p.ts - drawPts[i-1].ts > gap) segs.push([]); segs[segs.length-1].push(p); });
  const showHourly = !diff && hourly && hourly.length >= 2;
  const W = chartWidth(el), narrow = W < 520;
  const H = Math.round(Math.min(340, Math.max(narrow ? 260 : 220, W*0.42)));
  const m = { l:42, r: diff ? 16 : (narrow ? 50 : 62), t:14, b:30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  el._geom = { W, m, iw, start: w.start, end: w.end };
  lastTimeIw = iw;
  const X = v => m.l + (v - w.start) / (w.end - w.start) * iw;
  const valsOf = p => diff ? (daily ? [p.dMin, p.dMax] : [p.d]) : (daily ? [p.bin, p.buMin, p.buMax] : [p.bin, p.bu]);
  let yVals = pts.flatMap(valsOf).concat(diff ? [0] : []);
  // Waar de lijn de linker/rechter rand kruist (lineair tussen het punt buiten en binnen beeld).
  const edgeVals = (outP, inP, edgeTs) => { if(!outP || !inP) return []; const f = (edgeTs - outP.ts) / (inP.ts - outP.ts); const a = valsOf(outP), b = valsOf(inP); return a.map((v, k) => v + (b[k] - v) * f); };
  yVals = yVals.concat(edgeVals(before, pts[0] || after, w.start), edgeVals(after, pts[pts.length-1] || before, w.end));
  if(showHourly) yVals = yVals.concat(hourly.filter(h => h.ts >= w.start && h.ts <= w.end).map(h => h.v));
  if(!yVals.length) yVals = [0, 20];
  const yt = niceTicks(Math.min(...yVals), Math.max(...yVals), 5);
  const Y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  const nfv = v => v.toLocaleString(state.lang==="en"?"en-GB":"nl-NL");
  const cIn = "var(--c-binnen)", cOut = "var(--c-buiten)", cDiff = "var(--accent)";
  let grid = yt.ticks.map(v => `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${diff && v > 0 ? "+" : ""}${nfv(v)}°</text>`).join("");
  if(diff && yt.lo < 0 && yt.hi > 0) grid += `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--text-soft)" stroke-width="1"/>`;
  // x-as: uren (≤ 3 dagen), dagen, of maanden (> 120 dagen)
  const monthLbl = d => { const [y, mo] = d.split("-").map(Number); return t("monthNames")[mo-1].slice(0,3) + (mo === 1 ? " " + y : ""); };
  const tickLine = (x, strong) => `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="${strong ? "var(--text-soft)" : "var(--grid)"}" ${strong ? 'stroke-opacity=".35"' : ""}/>`;
  if(span <= 3){
    // Uurstap op basis van de beschikbare breedte: minstens ~46 px (mobiel) / 52 px tussen labels.
    const pxPerHour = iw / (span * 24), minPx = narrow ? 46 : 52;
    const stepH = [1, 2, 3, 6, 12].find(h => h * pxPerHour >= minPx) || 24;
    for(let ts = Math.ceil(w.start / HOUR) * HOUR; ts <= w.end; ts += HOUR){
      const d = new Date(ts), h = d.getHours();
      if(h % stepH && h !== 0) continue;
      const x = X(ts), mid = h === 0;
      // Geen uurlabel vlak naast een datumlabel (middernacht).
      if(!mid){ const nextMid = dayStart(ts) + DAY; if((nextMid - ts) * pxPerHour / HOUR < minPx * 0.9 && nextMid <= w.end) continue; if((ts - dayStart(ts)) * pxPerHour / HOUR < minPx * 0.9 && dayStart(ts) >= w.start) continue; }
      const anchor = x < m.l + 22 ? "start" : x > m.l + iw - 22 ? "end" : "middle";
      grid += tickLine(x, mid) + `<text x="${x}" y="${H-10}" text-anchor="${anchor}" ${mid ? 'class="lbl-strong"' : ""}>${mid ? escapeHtml(fmtDate(tsToISO(ts))) : pad2(h) + ":00"}</text>`;
    }
  } else {
    const dayTicks = []; for(let d = tsToISO(w.start); tsFrom(d, "00:00") < w.end; d = addDaysISO(d, 1)) if(tsFrom(d, "00:00") >= w.start) dayTicks.push(d);
    let ticks;
    if(span > 120) ticks = dayTicks.filter(d => d.endsWith("-01"));
    else { const maxL = Math.max(2, Math.floor(iw / (narrow ? 60 : 70))), every = Math.max(1, Math.ceil(dayTicks.length / maxL)); ticks = dayTicks.filter((d, i) => !(i % every)); }
    grid += ticks.map(d => { const x = X(tsFrom(d, "00:00")); return tickLine(x) + `<text x="${x}" y="${H-10}" text-anchor="${x < m.l + 20 ? "start" : x > m.l + iw - 20 ? "end" : "middle"}">${escapeHtml(span > 120 ? monthLbl(d) : fmtDate(d))}</text>`; }).join("");
  }
  let iso = "";
  if(state.settings.isolatieDatum){ const it = tsFrom(state.settings.isolatieDatum, "00:00"); if(it > w.start && it < w.end){ const xi = X(it), right = xi > m.l + iw - 70; iso = `<line x1="${xi}" x2="${xi}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-soft)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${right ? xi - 5 : xi + 5}" y="${m.t+ih-6}" text-anchor="${right ? "end" : "start"}" class="lbl-strong">${escapeHtml(t("lIsolatie"))}</text>`; } }
  const nowTs = Date.now();
  let nowMark = "";
  if(nowTs > w.start && nowTs < w.end && span <= 7.5){ const xn = X(nowTs); nowMark = `<line x1="${xn}" x2="${xn}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--accent)" stroke-width="1.2" opacity=".7"/><text x="${xn}" y="${m.t+10}" text-anchor="${xn > m.l + iw - 20 ? "end" : "middle"}" class="now-lbl">${escapeHtml(t("nowLbl"))}</text>`; }
  const pathOf = (seg, key) => seg.map((p, i) => `${i?"L":"M"}${X(p.ts).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  const bandOf = (seg, lo, hi) => seg.length < 2 ? "" : `M${seg.map(p => `${X(p.ts).toFixed(1)},${Y(p[hi]).toFixed(1)}`).join("L")}L${seg.slice().reverse().map(p => `${X(p.ts).toFixed(1)},${Y(p[lo]).toFixed(1)}`).join("L")}Z`;
  const showDots = pts.length <= (narrow ? 35 : 60);
  const r = daily ? 3 : 4;
  let marks = "";
  if(showHourly) marks += `<path d="${hourly.map((h, i) => `${i?"L":"M"}${X(h.ts).toFixed(1)},${Y(h.v).toFixed(1)}`).join("")}" fill="none" stroke="${cOut}" stroke-width="1.5" stroke-dasharray="2 3" opacity=".75"/>`;
  segs.forEach(seg => {
    if(diff){
      if(daily) marks += `<path d="${bandOf(seg, "dMin", "dMax")}" fill="color-mix(in srgb, ${cDiff} 16%, transparent)" stroke="none"/>`;
      marks += `<path d="${pathOf(seg, "d")}" fill="none" stroke="${cDiff}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(showDots || seg.length === 1) marks += seg.map(p => `<circle cx="${X(p.ts)}" cy="${Y(p.d)}" r="${r}" fill="${cDiff}" stroke="var(--paper)" stroke-width="1.5"/>`).join("");
    } else {
      if(daily) marks += `<path d="${bandOf(seg, "buMin", "buMax")}" fill="color-mix(in srgb, ${cOut} 16%, transparent)" stroke="none"/>`;
      marks += `<path d="${pathOf(seg, "bu")}" fill="none" stroke="${cOut}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      marks += `<path d="${pathOf(seg, "bin")}" fill="none" stroke="${cIn}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(showDots || seg.length === 1) marks += seg.map(p => `<circle cx="${X(p.ts)}" cy="${Y(p.bu)}" r="${r}" fill="${cOut}" stroke="var(--paper)" stroke-width="1.5"/><circle cx="${X(p.ts)}" cy="${Y(p.bin)}" r="${r}" fill="${cIn}" stroke="var(--paper)" stroke-width="1.5"/>`).join("");
    }
  });
  let labels = "";
  if(!diff && (pts.length || (before && after))){
    // Loopt de lijn rechts door buiten beeld, dan de labels aan de rechterrand op de hoogte waar de
    // lijn die rand kruist; anders naast het laatste punt in beeld.
    const last = pts.length ? pts[pts.length-1] : before;
    let vb = last.bin, vu = last.bu, lx = Math.min(X(last.ts) + 8, m.l + iw + 6);
    if(after){ const f = (w.end - last.ts) / (after.ts - last.ts); vb = last.bin + (after.bin - last.bin) * f; vu = last.bu + (after.bu - last.bu) * f; lx = m.l + iw + 6; }
    let ly1 = Y(vb), ly2 = Y(vu);
    if(Math.abs(ly1-ly2) < 14){ const mid = (ly1+ly2)/2; if(ly1 <= ly2){ ly1 = mid-7; ly2 = mid+7; } else { ly1 = mid+7; ly2 = mid-7; } }
    labels = `<text x="${lx}" y="${ly1+4}" class="lbl-strong">${escapeHtml(t("lBinnen"))}</text><text x="${lx}" y="${ly2+4}" class="lbl-strong">${escapeHtml(t("lBuiten"))}</text>`;
  }
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t("chartTime"))}"><defs><clipPath id="tcClip"><rect x="${m.l}" y="0" width="${iw}" height="${H}"/></clipPath></defs>${grid}<g clip-path="url(#tcClip)">${iso}${nowMark}${marks}</g>${labels}
    <line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-soft)" stroke-width="1" opacity="0"/>
    <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const sw = (c, lbl, band, dash) => `<span class="key"><i class="sw${band ? " band" : ""}${dash ? " dashc" : ""}" style="${dash ? `border-color:${c}; border-top-style:dotted` : `background:${band ? `color-mix(in srgb, ${c} 25%, transparent)` : c}`}"></i>${escapeHtml(lbl)}</span>`;
  const legend = diff
    ? sw(cDiff, daily ? t("tlDiffAvg") : t("tvDiff")) + (daily ? sw(cDiff, t("tlDiffBand"), true) : "")
    : sw(cIn, daily ? t("tlInAvg") : t("lBinnen")) + sw(cOut, daily ? t("tlOutAvg") : t("lBuiten")) + (daily ? sw(cOut, t("tlOutBand"), true) : "") + (showHourly ? sw(cOut, t("tlHourly"), false, true) : "");
  el.innerHTML = `<div class="chart-legend">${legend}${iso ? `<span class="key"><i class="sw dash"></i>${t("lIsolatie")}</span>` : ""}</div><div class="chart-wrap tc-zoom">${svg}</div><p class="zoom-hint">${escapeHtml(t("zoomHint"))}</p>${daily ? `<p class="card-note" style="margin-top:4px;">${escapeHtml(t("tpDailyNote")(list.length, pts.length))}</p>` : ""}`;
  el._hourlyOk = true;
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = attachTooltip(wrap), xh = svgEl.querySelector(".xhair");
  const showAt = clientX => {
    if(!pts.length) return;
    const rc = svgEl.getBoundingClientRect(), sc = W / rc.width, px = (clientX - rc.left) * sc;
    let best = pts[0], bd = Infinity;
    pts.forEach(p => { const d = Math.abs(X(p.ts) - px); if(d < bd){ bd = d; best = p; } });
    const bx = X(best.ts);
    if(bx < m.l || bx > m.l + iw){ tip.hide(); return; }
    xh.setAttribute("x1", bx); xh.setAttribute("x2", bx); xh.setAttribute("opacity", "0.5");
    let html;
    if(!daily) html = `<div class="tt-head">${escapeHtml(fmtDate(best.m.datum, true))}${best.m.tijd ? " · " + escapeHtml(best.m.tijd) : ""}</div>${ttRow(cIn, t("lBinnen"), fmtT(best.bin))}${ttRow(cOut, t("lBuiten"), fmtT(best.bu))}<div class="tt-row"><span>${t("thVerschil")}</span><span class="tt-val">${fmtDelta(best.d)}</span></div>`;
    else html = `<div class="tt-head">${escapeHtml(fmtDate(best.datum, true))} · ${escapeHtml(t("tpN")(best.n))}</div>${ttRow(cIn, t("tlInAvg"), fmtT(best.bin))}${ttRow(cOut, t("tlOutAvg"), fmtT(best.bu))}${ttRow(cOut, t("tlOutBand"), fmtT(best.buMin) + " – " + fmtT(best.buMax))}<div class="tt-row"><span>${t("thVerschil")}</span><span class="tt-val">${fmtDelta(best.d)}</span></div>`;
    const yTop = diff ? Y(daily ? best.dMax : best.d) : Y(Math.max(best.bin, daily ? best.buMax : best.bu));
    tip.show(html, bx / sc, yTop / sc);
  };
  const hit = svgEl.querySelector(".hit");
  hit.addEventListener("pointermove", ev => { if(ev.pointerType === "mouse" && ev.buttons === 0) showAt(ev.clientX); });
  hit.addEventListener("pointerup", ev => showAt(ev.clientX));
  hit.addEventListener("pointerleave", () => { tip.hide(); xh.setAttribute("opacity","0"); });
}

function drawScatterChart(el, listAll){
  if(!el) return;
  const basis = scatterBasis();
  const list = listAll.filter(p => xOf(p, basis) !== null);
  const missing = listAll.length - list.length;
  if(list.length < 2){ el.innerHTML = `<div class="chart-empty">${escapeHtml(t("chartNeed"))}${missing ? "<br>" + escapeHtml(t("basis24Missing")(missing)) : ""}</div>`; return; }
  const hasIso = !!state.settings.isolatieDatum;
  const groups = hasIso
    ? [{ key:"voor", label:t("lVoor"), color:"var(--c-voor)", pts:list.filter(p=>phaseOf(p)==="voor") }, { key:"na", label:t("lNa"), color:"var(--c-na)", pts:list.filter(p=>phaseOf(p)==="na") }].filter(g => g.pts.length)
    : [{ key:"alle", label:t("lAlle"), color:"var(--accent)", pts:list }];
  const W = chartWidth(el), H = Math.round(Math.min(320, Math.max(220, W*0.42)));
  const m = { l:42, r:16, t:28, b:36 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xt = niceTicks(Math.min(...list.map(p=>xOf(p,basis))), Math.max(...list.map(p=>xOf(p,basis))), 6);
  const yt = niceTicks(Math.min(...list.map(p=>p.binnen)), Math.max(...list.map(p=>p.binnen)), 5);
  const X = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  const Y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  const nf = v => v.toLocaleString(state.lang==="en"?"en-GB":"nl-NL");
  let grid = yt.ticks.map(v => `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${nf(v)}°</text>`).join("");
  grid += xt.ticks.map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)"/><text x="${X(v)}" y="${m.t+ih+16}" text-anchor="middle">${nf(v)}°</text>`).join("");
  grid += `<text x="${m.l+iw}" y="${H-2}" text-anchor="end">${escapeHtml(basis==="24" ? t("basis24") : t("lBuiten"))} →</text><text x="${m.l-34}" y="${m.t-16}">${escapeHtml(t("lBinnen"))} ↑</text>`;
  // Trendlijnen uit precies dezelfde metingen als de conclusie rechts (zelfde filter, zonder
  // thermostaat-metingen, en bij genoeg "alles uit"-metingen alleen die), zodat grafiek en
  // conclusie altijd hetzelfde verhaal vertellen.
  const an = hasIso ? analyzeBest(listAll, basis) : null;
  const trendSet = p => !isRegulated(p) && (!an || !an.vrijOnly || klimaatOf(p).mode === "vrij");
  let lines = "", dots = "", marker = "";
  const trendKeys = [];
  groups.forEach(g => {
    const free = g.pts.filter(trendSet);
    const reg = linReg(free.map(p => ({ x:xOf(p,basis), y:p.binnen })));
    if(reg && free.length >= 3){
      lines += `<line x1="${X(reg.minX)}" y1="${Y(reg.a+reg.b*reg.minX)}" x2="${X(reg.maxX)}" y2="${Y(reg.a+reg.b*reg.maxX)}" stroke="${g.color}" stroke-width="2" stroke-dasharray="6 4" opacity=".9"/>`;
      trendKeys.push(g);
    }
    dots += g.pts.map(p => isRegulated(p)
      ? `<circle cx="${X(xOf(p,basis))}" cy="${Y(p.binnen)}" r="4.5" fill="var(--paper)" stroke="${g.color}" stroke-width="2" data-id="${p.id}"/>`
      : `<circle cx="${X(xOf(p,basis))}" cy="${Y(p.binnen)}" r="5" fill="${g.color}" stroke="var(--paper)" stroke-width="2" data-id="${p.id}" data-g="${g.key}"/>`).join("");
  });
  // Vergelijkpunt: waar de conclusie rechts de twee lijnen vergelijkt.
  const showMarker = an && an.status !== "insufficient" && an.ref >= xt.lo && an.ref <= xt.hi;
  if(showMarker){
    const xr = X(an.ref), yv = Y(an.ev), yn = Y(an.en);
    const lx = xr > m.l + iw - 90 ? xr - 8 : xr + 8, anchor = xr > m.l + iw - 90 ? "end" : "start";
    marker = `<line x1="${xr}" x2="${xr}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-soft)" stroke-width="1.2" stroke-dasharray="2 3"/>
      <line x1="${xr}" x2="${xr}" y1="${Math.min(yv,yn)}" y2="${Math.max(yv,yn)}" stroke="var(--text)" stroke-width="2"/>
      <circle cx="${xr}" cy="${yv}" r="4" fill="var(--c-voor)" stroke="var(--paper)" stroke-width="1.5"/>
      <circle cx="${xr}" cy="${yn}" r="4" fill="var(--c-na)" stroke="var(--paper)" stroke-width="1.5"/>
      <text x="${lx}" y="${(yv+yn)/2 + 4}" text-anchor="${anchor}" class="lbl-strong">${escapeHtml(fmtDelta(an.diff).replace(" °C","°"))}</text>
      <text x="${xr}" y="${m.t - 4}" text-anchor="middle">${escapeHtml(t("scatterRef")(nf(an.ref)))}</text>`;
  }
  const legendTrend = trendKeys.map(g => `<span class="key"><i class="sw dashc" style="border-color:${g.color}"></i>${escapeHtml(t("scatterTrend")(g.key === "voor" ? t("lVoor") : g.key === "na" ? t("lNa") : t("lAlle")))}${an && an.vrijOnly ? " · " + escapeHtml(t("kStatus_vrij").toLowerCase()) : ""}</span>`).join("");
  el.innerHTML = `<div class="chart-legend">${groups.map(g => `<span class="key"><i class="sw dot" style="background:${g.color}"></i>${escapeHtml(g.label)} (${g.pts.length})</span>`).join("")}${legendTrend}${showMarker ? `<span class="key"><i class="sw dashc" style="border-color:var(--text-soft); border-top-style:dotted"></i>${escapeHtml(t("scatterRefLegend"))}</span>` : ""}${list.some(isRegulated) ? `<span class="key"><i class="sw dot hollow"></i>${escapeHtml(t("scatterHollow"))}</span>` : ""}</div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t("chartScatter"))}">${grid}${lines}${marker}${dots}</svg></div>${missing ? `<p class="card-note" style="margin-top:6px;">${escapeHtml(t("basis24Missing")(missing))}</p>` : ""}`;
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = attachTooltip(wrap);
  svgEl.addEventListener("pointermove", ev => {
    const r = svgEl.getBoundingClientRect(), scale = W / r.width;
    const px = (ev.clientX - r.left) * scale, py = (ev.clientY - r.top) * scale;
    let best = null, bd = 18;
    list.forEach(p => { const d = Math.hypot(X(xOf(p,basis)) - px, Y(p.binnen) - py); if(d < bd){ bd = d; best = p; } });
    if(!best){ tip.hide(); return; }
    const g = groups.find(gg => gg.pts.includes(best));
    tip.show(`<div class="tt-head">${escapeHtml(fmtDate(best.datum, true))}${best.tijd ? " · " + escapeHtml(best.tijd) : ""}</div>
      ${ttRow(g.color, t("lBinnen"), fmtT(best.binnen))}${ttRow(g.color, t("lBuiten"), fmtT(best.buiten))}${has24(best) ? ttRow(g.color, t("basis24"), fmtT(best.buiten24)) : ""}`, X(xOf(best,basis))/scale, Y(best.binnen)/scale);
  });
  svgEl.addEventListener("pointerleave", () => tip.hide());
}


/* ================= CONCLUSIE VÓÓR / NA =================
   Vergelijkt bij dezelfde buitentemperatuur (referentie, of het midden van het bereik dat in
   beide periodes gemeten is) de geschatte binnentemperatuur vóór en na isolatie. Onzekerheid:
   de standaardfout van beide schattingen (regressie) gecombineerd, met een ondergrens van 0,3 °C
   voor de nauwkeurigheid van een gewone thermometer. Het oordeel:
   - verschil > +marge  → isolatie biedt meerwaarde
   - verschil < −marge  → na isolatie juist koeler (geen meerwaarde zichtbaar)
   - daartussen         → nog geen duidelijk verschil
   waarbij marge = max(0,3 °C, 2 × standaardfout). */
const MEAS_UNCERTAINTY = 0.3;
function predSE(r, x0){
  // Kleine steekproef zonder spreiding rond de lijn → sres 0; gebruik dan de meetonzekerheid.
  const s = Math.max(r.sres, MEAS_UNCERTAINTY / 2);
  return s * Math.sqrt(1 / r.n + (x0 - r.mx) ** 2 / r.sxx);
}
function analyzeVoorNa(listIn, basis){
  const excluded = listIn.filter(isRegulated).length;
  const list = listIn.filter(p => !isRegulated(p));
  const voor = list.filter(p => phaseOf(p) === "voor" && xOf(p, basis) !== null);
  const na = list.filter(p => phaseOf(p) === "na" && xOf(p, basis) !== null);
  const res = { nv: voor.length, nn: na.length, status: "insufficient", excluded };
  const rv = linReg(voor.map(p => ({ x:xOf(p,basis), y:p.binnen })));
  const rn = linReg(na.map(p => ({ x:xOf(p,basis), y:p.binnen })));
  const ok = r => r && r.n >= 3 && r.spread >= 1;
  if(!ok(rv) || !ok(rn)) return res;
  let ref = Number(state.settings.refBuiten), extrap = false, refMoved = false;
  const lo = Math.max(rv.minX, rn.minX), hi = Math.min(rv.maxX, rn.maxX);
  if(!isFinite(ref)) ref = 10;
  if(lo <= hi){
    if(ref < lo || ref > hi){ ref = Math.round((lo + hi) / 2); refMoved = true; }
  } else extrap = true;
  const ev = rv.a + rv.b*ref, en = rn.a + rn.b*ref, diff = en - ev;
  const se = Math.sqrt(predSE(rv, ref) ** 2 + predSE(rn, ref) ** 2);
  const margin = Math.max(MEAS_UNCERTAINTY, 2 * se);
  Object.assign(res, { ref, ev, en, diff, se, margin, extrap, refMoved });
  res.status = diff > margin ? "good" : diff < -margin ? "bad" : "neutral";
  const minN = Math.min(voor.length, na.length), z = Math.abs(diff) / Math.max(se, 1e-6);
  res.confidence = extrap ? "low" : (minN >= 8 && z >= 3) ? "high" : (minN >= 5 && z >= 2) ? "medium" : "low";
  // Verwarming/airco-gebruik vergelijken: een groot verschil vertekent het beeld.
  const share = arr => { const k = arr.filter(p => { const md = klimaatOf(p).mode; return md !== "onbekend"; }); return k.length ? k.filter(p => { const md = klimaatOf(p).mode; return md === "verwarmen" || md === "koelen" || md === "gemengd"; }).length / k.length : null; };
  const hv = share(voor), hn = share(na);
  if(hv !== null && hn !== null && Math.abs(hv - hn) >= 0.5) res.heatWarn = { hv, hn };
  return res;
}
/* Bij klimaatfilter "Alle": als er genoeg "alles uit"-metingen zijn, is dát het eerlijkste vergelijk
   (verwarmen/koelen vermengen anders het beeld). Anders alle metingen minus thermostaat-metingen. */
function analyzeBest(list, basis){
  if(klimaatFilter === "all"){
    const v = analyzeVoorNa(list.filter(m => klimaatOf(m).mode === "vrij"), basis);
    if(v.status !== "insufficient"){ v.vrijOnly = true; return v; }
  }
  return analyzeVoorNa(list, basis);
}
function conclusionHTML(r, dpName){
  const icon = { good:"✓", bad:"✗", neutral:"≈", insufficient:"…" }[r.status];
  let head, body = "";
  if(r.status === "insufficient"){
    head = t("conInsufficient");
    body = t("conInsufficientBody")(r.nv, r.nn);
  } else {
    head = t("con_" + r.status);
    body = t("conBody_" + r.status)(fmtT(r.ref, 0), fmtT(Math.abs(r.diff)), fmtT(r.margin), dpName);
    if(r.refMoved) body += " " + t("conRefMoved")(fmtT(r.ref, 0));
    if(r.extrap) body += " " + t("conExtrap");
    if(r.heatWarn) body += " " + t("conHeatWarn2")(Math.round(r.heatWarn.hv*100), Math.round(r.heatWarn.hn*100));
  }
  if(r.excluded) body += " " + t("conExcluded")(r.excluded);
  if(r.vrijOnly) body += " " + t("conVrijOnly");
  const conf = r.confidence ? `<div class="con-conf">${t("conConfidence")}: <strong>${t("conf_" + r.confidence)}</strong> · ${escapeHtml(t("conCounts")(r.nv, r.nn))}</div>` : "";
  return `<div class="conclusion ${r.status}"><div class="con-head"><span class="con-icon" aria-hidden="true">${icon}</span>${escapeHtml(head)}</div><p>${escapeHtml(body)}</p>${conf}</div>`;
}
function perDagdeelHTML(basis){

/* ================= KLIMAAT & COMFORT =================
   Blijft nuttig als vóór/na er niet meer toe doet. Drie invalshoeken:
   1. "Alles uit"-metingen: hoe het huis zélf presteert (verschil binnen − buiten), per maand.
   2. Verwarmen: wordt de ingestelde temperatuur gehaald (per systeem), en vanaf welke buitentemp
      wordt er gestookt (stookgrens).
   3. Koelen: vanaf welke buitentemp wordt er gekoeld (koelgrens), hoe vaak.
   De grens is de buitentemperatuur die "alles uit"-metingen en "systeem aan"-metingen het best
   van elkaar scheidt (minste verkeerd ingedeelde metingen). */
function kBasis(){ return scatterBasis(); }
function kx(m){ const v = xOf(m, kBasis()); return v === null ? m.buiten : v; }
function findGrens(offVals, onVals, onBelow){
  if(offVals.length < 3 || onVals.length < 3) return null;
  const all = offVals.concat(onVals).sort((a,b) => a-b);
  let best = null;
  for(let i = 0; i < all.length - 1; i++){
    const T = (all[i] + all[i+1]) / 2;
    const err = onBelow ? offVals.filter(v => v < T).length + onVals.filter(v => v >= T).length
                        : offVals.filter(v => v > T).length + onVals.filter(v => v <= T).length;
    if(!best || err < best.err) best = { T, err, from:T, to:T };
    else if(err === best.err){ best.to = T; }
  }
  const T = Math.round(((best.from + best.to) / 2) * 2) / 2;
  return { T, err: best.err, n: all.length };
}
function klimaatStats(){
  const all = sortedMetingen(state.metingen);
  const withK = all.map(m => ({ m, k: klimaatOf(m) }));
  const vrij = withK.filter(x => x.k.mode === "vrij");
  const verw = withK.filter(x => x.k.mode === "verwarmen");
  const koel = withK.filter(x => x.k.mode === "koelen");
  const counts = {}; withK.forEach(x => { const key = x.k.mode === "gemengd" ? "onbekend" : x.k.mode; counts[key] = (counts[key]||0) + 1; });
  const stook = findGrens(vrij.map(x => kx(x.m)), verw.map(x => kx(x.m)), true);
  const koelG = findGrens(vrij.map(x => kx(x.m)), koel.map(x => kx(x.m)), false);
  const regPct = arr => { const k = arr.filter(x => x.k.reg); return k.length ? Math.round(k.filter(x => x.k.reg !== "niet").length / k.length * 100) : null; };
  return { all, withK, vrij, verw, koel, counts, stook, koelG, verwPct: regPct(verw), koelPct: regPct(koel) };
}

function drawKlimaatChart(el){
  if(!el) return;
  const S = klimaatStats();
  const pts = S.withK.filter(x => x.k.mode !== "onbekend" && x.k.mode !== "gemengd");
  if(pts.length < 2){ el.innerHTML = `<div class="chart-empty">${escapeHtml(t("chartNeed"))}</div>`; return; }
  const col = { vrij:"var(--k-vrij)", verwarmen:"var(--k-verw)", koelen:"var(--k-koel)" };
  const W = chartWidth(el), H = Math.round(Math.min(320, Math.max(220, W*0.42)));
  const m = { l:42, r:16, t:28, b:36 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = pts.map(x => kx(x.m)), ys = pts.map(x => x.m.binnen).concat(pts.filter(x => x.k.sp !== null).map(x => x.k.sp));
  const xt = niceTicks(Math.min(...xs), Math.max(...xs), 6), yt = niceTicks(Math.min(...ys), Math.max(...ys), 5);
  const X = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw, Y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  const nfv = v => v.toLocaleString(state.lang==="en"?"en-GB":"nl-NL");
  let g = yt.ticks.map(v => `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${nfv(v)}°</text>`).join("");
  g += xt.ticks.map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)"/><text x="${X(v)}" y="${m.t+ih+16}" text-anchor="middle">${nfv(v)}°</text>`).join("");
  g += `<text x="${m.l+iw}" y="${H-2}" text-anchor="end">${escapeHtml(kBasis()==="24" ? t("basis24") : t("lBuiten"))} →</text><text x="${m.l-34}" y="${m.t-16}">${escapeHtml(t("lBinnen"))} ↑</text>`;
  const grens = (G, label, c) => (G && G.T >= xt.lo && G.T <= xt.hi) ? `<line x1="${X(G.T)}" x2="${X(G.T)}" y1="${m.t}" y2="${m.t+ih}" stroke="${c}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${X(G.T)+5}" y="${m.t+11}" class="lbl-strong">${escapeHtml(label)} ~${nfv(G.T)}°</text>` : "";
  g += grens(S.stook, t("kpStook"), "var(--k-verw)") + grens(S.koelG, t("kpKoel"), "var(--k-koel)");
  const dots = pts.map(x => { const c = col[x.k.mode]; return x.k.reg === "gehaald"
    ? `<circle cx="${X(kx(x.m))}" cy="${Y(x.m.binnen)}" r="4.5" fill="var(--paper)" stroke="${c}" stroke-width="2"/>`
    : `<circle cx="${X(kx(x.m))}" cy="${Y(x.m.binnen)}" r="5" fill="${c}" stroke="var(--paper)" stroke-width="2"/>`; }).join("");
  const present = ["vrij","verwarmen","koelen"].filter(k => pts.some(x => x.k.mode === k));
  el.innerHTML = `<div class="chart-legend">${present.map(k => `<span class="key"><i class="sw dot" style="background:${col[k]}"></i>${t("kStatus_"+k)} (${pts.filter(x => x.k.mode===k).length})</span>`).join("")}${pts.some(x => x.k.reg==="gehaald") ? `<span class="key"><i class="sw dot hollow"></i>${escapeHtml(t("kReg_gehaald"))}</span>` : ""}</div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t("kpChart"))}">${g}${dots}</svg></div>`;
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = attachTooltip(wrap);
  svgEl.addEventListener("pointermove", ev => {
    const r = svgEl.getBoundingClientRect(), sc = W / r.width, px = (ev.clientX - r.left) * sc, py = (ev.clientY - r.top) * sc;
    let best = null, bd = 18;
    pts.forEach(x => { const d = Math.hypot(X(kx(x.m)) - px, Y(x.m.binnen) - py); if(d < bd){ bd = d; best = x; } });
    if(!best){ tip.hide(); return; }
    const c = col[best.k.mode], tag = klimaatTag(best.m);
    tip.show(`<div class="tt-head">${escapeHtml(fmtDate(best.m.datum, true))}${best.m.tijd ? " · " + escapeHtml(best.m.tijd) : ""}</div>
      ${ttRow(c, tag.txt, best.k.reg ? escapeHtml(t("kReg_" + best.k.reg)) : "")}${ttRow(c, t("lBinnen"), fmtT(best.m.binnen))}${ttRow(c, kBasis()==="24" ? t("basis24") : t("lBuiten"), fmtT(kx(best.m)))}`, X(kx(best.m))/sc, Y(best.m.binnen)/sc);
  });
  svgEl.addEventListener("pointerleave", () => tip.hide());
}

function renderKlimaatSummary(el){
  const S = klimaatStats();
  const stamp = (G, label, sub, cls) => `<div class="stamp ${cls}"><div class="stamp-label">${label}</div><div class="stamp-value">${G ? "~" + escapeHtml(fmtT(G.T)) : "—"}</div><div class="stamp-sub">${escapeHtml(G ? sub(fmtT(G.T)) : t("kpGrensNeed"))}</div></div>`;

function excelSerialToDate(n){ const ms = Math.round((n - 25569) * 86400000); const d = new Date(ms); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes()); }
function normDate(v){
  if(v === null || v === undefined || v === "") return null;
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  if(typeof v === "number" && v > 20000 && v < 80000){ const d = excelSerialToDate(v); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if(m){ const y = m[3].length === 2 ? "20"+m[3] : m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
  return null;
}
function normTime(v){
  if(v === null || v === undefined || v === "") return "";
  if(v instanceof Date && !isNaN(v)) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
  if(typeof v === "number" && v >= 0 && v < 1){ const mins = Math.round(v * 1440); return `${pad2(Math.floor(mins/60)%24)}:${pad2(mins%60)}`; }
  const m = String(v).trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? `${pad2(m[1])}:${m[2]}` : "";
}
function detectColumns(header){
  const h = header.map(x => String(x || "").toLowerCase().trim());
  const find = re => h.findIndex(x => re.test(x));
  return {
    datum: find(/datum|date|dag/),
    tijd: find(/tijd|time|uur/),
    buiten: find(/buiten|outdoor|outside|buitentemp/),
    binnen: (() => { const i = find(/binnen|indoor|inside|woonkamer|kamer|living/); return i >= 0 ? i : h.findIndex((x,idx) => /temp/.test(x) && !/buiten|outdoor|outside/.test(x) && idx !== find(/buiten|outdoor|outside/)); })(),
    ruimte: find(/ruimte|room|locatie/),
    notitie: find(/notitie|note|opmerking/),
    verwarming: find(/verwarming|heating/),
    cv: find(/^cv|ketel|boiler/),
    airco: find(/airco|\bac\b|warmtepomp/),
  };
}
function ruimteFromHeader(label){ const m = String(label||"").match(/temp(?:eratuur)?\s+(.+)/i); if(m && !/binnen|indoor|inside/i.test(m[1])) return m[1].trim().charAt(0).toUpperCase() + m[1].trim().slice(1); return null; }
function importRows(rows){
  let hi = rows.findIndex(r => r && r.some(c => /datum|date/i.test(String(c||""))));
  if(hi < 0) hi = 0;
  const cols = detectColumns(rows[hi] || []);
  if(cols.binnen < 0 || cols.buiten < 0 || cols.datum < 0) throw new Error(t("importNoCols"));
  const defRuimte = ruimteFromHeader(rows[hi][cols.binnen]) || state.settings.defaultRuimte;
  const existing = new Set(state.metingen.map(m => `${m.datum}|${m.tijd}|${(m.ruimte||"").toLowerCase()}`));
  let added = 0, dup = 0, empty = 0;
  rows.slice(hi+1).forEach(r => {
    if(!r || r.every(c => c === null || c === undefined || c === "")) return;
    const datum = normDate(r[cols.datum]);
    const binnen = parseNum(r[cols.binnen]), buiten = parseNum(r[cols.buiten]);
    if(!datum || binnen === null || buiten === null){ empty++; return; }
    const tijd = cols.tijd >= 0 ? normTime(r[cols.tijd]) : "";
    const ruimte = (cols.ruimte >= 0 && r[cols.ruimte]) ? String(r[cols.ruimte]).trim() : defRuimte;
    const key = `${datum}|${tijd}|${ruimte.toLowerCase()}`;
    if(existing.has(key)){ dup++; return; }
    existing.add(key);
    const vw = cols.verwarming >= 0 ? String(r[cols.verwarming]||"").toLowerCase() : "";
    state.metingen.push({ id:newId(), datum, tijd, binnen, buiten, ruimte,
      verwarming: /aan|on|ja|yes|1/.test(vw) ? "aan" : /uit|off|nee|no|0/.test(vw) ? "uit" : "",
      cv: (() => { if(cols.cv < 0) return ""; const x = String(r[cols.cv]||"").toLowerCase(); return /aan|on|ja|yes|1/.test(x) ? "aan" : /uit|off|nee|no|0/.test(x) ? "uit" : ""; })(),
      airco: (() => { if(cols.airco < 0) return ""; const x = String(r[cols.airco]||"").toLowerCase(); return /koel|cool/.test(x) ? "koelen" : /verw|heat|warm/.test(x) ? "verwarmen" : /uit|off|nee|no|0/.test(x) ? "uit" : ""; })(),
      cvTemp: null, aircoTemp: null,
      notitie: cols.notitie >= 0 ? String(r[cols.notitie]||"").trim() : "" });
    added++;
  });
  return { added, dup, empty };
}
function parseCsv(text){
  const first = text.split(/\r?\n/)[0] || "";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function handleImportFile(file){
  const name = file.name.toLowerCase();

    if(name.endsWith(".json")){

/* ================= BUITENTEMPERATUUR ONLINE (Open-Meteo) =================
   Geen achtergrondtaak en geen 92 dagen vooruit ophalen: alleen de buitentemperatuur voor het uur
   van de meting die je op dat moment invoert. Recente datums via de forecast-API (die ook de
   afgelopen weken bevat), oudere datums via de archief-API. Tussen twee hele uren wordt lineair
   geïnterpoleerd (bijv. 13:10 → 5/6 van 13:00 + 1/6 van 14:00). */
let formBuitenMode = "eigen", formBuitenFetched = null, fetchSeq = 0, formModeTouched = false;
const weatherCache = {};
function addDaysISO(iso, n){ const [y,m,d] = iso.split("-").map(Number); const dt = new Date(y, m-1, d + n); return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function daysBetween(a, b){ const pa = a.split("-").map(Number), pb = b.split("-").map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000); }
async function fetchHourly(loc, datum){
  const key = `${loc.lat.toFixed(3)},${loc.lon.toFixed(3)},${datum}`;
  if(weatherCache[key]) return weatherCache[key];
  const pr = fetchHourlyUncached(loc, datum).then(m => { weatherResolved[key] = m; return m; }).catch(err => { delete weatherCache[key]; throw err; });
  weatherCache[key] = pr;   // lopende aanvraag delen i.p.v. dezelfde dag twee keer op te halen
  return pr;
}
async function fetchHourlyUncached(loc, datum){
  const ago = daysBetween(datum, todayISO());
  if(ago < -14) throw new Error("te ver in de toekomst");
  const base = ago > 60 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  // Afgerond op 2 decimalen (~1 km): ruim nauwkeurig voor een weermodel met ~2 km-raster, en je
  // exacte adres gaat zo nooit naar Open-Meteo.
  const url = `${base}?latitude=${loc.lat.toFixed(2)}&longitude=${loc.lon.toFixed(2)}&hourly=temperature_2m&timezone=auto&start_date=${datum}&end_date=${addDaysISO(datum, 1)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if(!data.hourly || !Array.isArray(data.hourly.time)) throw new Error("onverwacht antwoord");
  const map = {};
  data.hourly.time.forEach((tm, i) => { const v = data.hourly.temperature_2m[i]; if(v !== null && v !== undefined) map[tm] = v; });
  return map;
}
async function fetchOutdoorTemp(loc, datum, tijd){
  const [h, mi] = (tijd || "12:00").split(":").map(Number);
  const map = await fetchHourly(loc, datum);
  const k0 = `${datum}T${pad2(h)}:00`;
  const k1 = h === 23 ? `${addDaysISO(datum,1)}T00:00` : `${datum}T${pad2(h+1)}:00`;
  const v0 = map[k0], v1 = map[k1], f = (mi || 0) / 60;
  if(v0 === undefined) return null;
  const v = (v1 === undefined || f === 0) ? v0 : v0 + (v1 - v0) * f;
  return Math.round(v * 10) / 10;
}
function setSrcHint(text, cls){ const el = document.getElementById("fBuitenSrc"); if(el){ el.textContent = text || ""; el.className = "src-hint" + (cls ? " " + cls : ""); } }
function setBuitenMode(mode, userClick){
  const fB = document.getElementById("fBuiten");
  if(!fB) return;
  if(!state.settings.locatie) mode = "eigen";
  const prev = formBuitenMode;
  formBuitenMode = mode;
  document.querySelectorAll(".src-choice button").forEach(b => { b.classList.toggle("on", b.dataset.src === mode); b.setAttribute("aria-checked", b.dataset.src === mode ? "true" : "false"); });
  fB.readOnly = mode === "online";
  if(mode === "eigen"){
    // Overstappen van Online naar Eigen: veld leegmaken zodat je niet per ongeluk de online waarde bewaart.
    if(userClick && prev === "online"){ fB.value = ""; fB.focus(); }
    if(!state.settings.locatie){ setSrcHint(state.settings.autoBuiten ? t("srcNoLoc") : ""); }
    else setSrcHint(t("srcOwnHint")(formBuitenFetched === null ? null : fmtT(formBuitenFetched)));
  }
  autoFillBuiten();
}
async function autoFillBuiten(){
  const fB = document.getElementById("fBuiten");
  const loc = state.settings.locatie;
  if(!fB || !loc) return;
  const datum = document.getElementById("fDatum").value, tijd = document.getElementById("fTijd").value;
  if(!validISODate(datum)) return;
  const seq = ++fetchSeq;
  // Ook bij "Eigen meting" halen we de online waarde op (en bewaren die mee), zodat je later je
  // eigen thermometer met het weermodel kunt vergelijken.
  if(formBuitenMode === "online"){ fB.value = ""; setSrcHint(t("srcFetching")); }
  try{
    const v = await fetchOutdoorTemp(loc, datum, tijd);
    if(seq !== fetchSeq || !document.getElementById("fBuiten")) return;
    formBuitenFetched = v;
    if(formBuitenMode === "online"){
      if(v === null){ setBuitenMode("eigen", true); setSrcHint(t("srcFail"), "err"); return; }
      document.getElementById("fBuiten").value = String(v).replace(".", state.lang === "en" ? "." : ",");
      setSrcHint(t("srcOnline")(fmtT(v), loc.naam.split(",").pop().trim()), "online");
    } else {
      if(v === null) setSrcHint(t("srcFail"), "err");
      else setSrcHint(t("srcOwnHint")(fmtT(v)));
    }
  }catch(err){
    if(seq !== fetchSeq) return;
    console.warn("Buitentemperatuur ophalen mislukt:", err);
    formBuitenFetched = null;
    if(formBuitenMode === "online"){ setSrcHint(t("srcFail"), "err"); setBuitenMode("eigen", true); setSrcHint(t("srcFail"), "err"); }
  }
}
/* Locatie zoeken: PDOK Locatieserver (Nederlandse overheid: adressen, postcodes met huisnummer,
   straten, wijken, buurten, plaatsen) en Open-Meteo/GeoNames (plaatsen wereldwijd) tegelijk.
   PDOK-resultaten eerst. Faalt één van de twee, dan tonen we gewoon de andere. */
async function searchLocations(q){
  const pdok = fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${encodeURIComponent(q)}&rows=6&fl=weergavenaam,centroide_ll,type`)
    .then(r => r.json())
    .then(d => ((d && d.response && d.response.docs) || []).map(doc => {
      const m = /POINT\(([-\d.]+) ([-\d.]+)\)/.exec(doc.centroide_ll || "");
      if(!m) return null;
      return { bron: pdokTypeLabel(doc.type), label: doc.weergavenaam, naam: doc.weergavenaam, lat: Number(m[2]), lon: Number(m[1]) };
    }).filter(Boolean))
    .catch(() => []);
  const om = fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=4&language=${state.lang}&format=json`)
    .then(r => r.json())
    .then(d => ((d && d.results) || []).map(r => ({ bron: t("locSrcPlace"), label: [r.name, r.admin2 && r.admin2 !== r.name ? r.admin2 : null, r.admin1, r.country_code].filter(Boolean).join(", "), naam: r.name, lat: r.latitude, lon: r.longitude })))
    .catch(() => []);
  const [a, b] = await Promise.all([pdok, om]);
  // Dubbele plaatsen (zelfde naam, binnen ~2 km) uit Open-Meteo weglaten als PDOK ze al heeft.
  const extra = b.filter(x => !a.some(y => Math.abs(y.lat - x.lat) < 0.02 && Math.abs(y.lon - x.lon) < 0.03 && y.label.toLowerCase().includes(x.naam.toLowerCase())));
  return a.concat(extra);
}
function pdokTypeLabel(type){
  const nl = { adres:"Adres", postcode:"Postcode", weg:"Straat", woonplaats:"Plaats", buurt:"Buurt", wijk:"Wijk", gemeente:"Gemeente", provincie:"Provincie" };
  const en = { adres:"Address", postcode:"Postcode", weg:"Street", woonplaats:"Town", buurt:"Neighbourhood", wijk:"District", gemeente:"Municipality", provincie:"Province" };
  return ((state.lang === "en" ? en : nl)[type]) || type || "";
}
function wireLocationSettings(){
  const setLoc = loc => {
    state.settings.locatie = loc; formModeTouched = false;
    state.metingen.forEach(m => { delete m.buiten24; });
    state.afkoeltests.forEach(a => { if(a.buitenGemBron !== "handmatig"){ a.buitenGem = null; a.buitenGemBron = null; delete a.buitenUur; } });
    scheduleAutoSave(); renderAll(); backfillOnline();
  };
  const results = document.getElementById("locResults");
  document.getElementById("locSearchBtn").onclick = async () => {
    const q = document.getElementById("locQuery").value.trim();
    if(q.length < 2) return;
    results.innerHTML = `<span class="none">${t("checking")}</span>`;
    const list = await searchLocations(q);
    if(!list.length){ results.innerHTML = `<span class="none">${escapeHtml(t("setLocNoResults"))}</span>`; return; }
    results.innerHTML = list.map((r, i) => `<button data-i="${i}"><span class="loc-src">${escapeHtml(r.bron)}</span>${escapeHtml(r.label)}</button>`).join("");
    results.querySelectorAll("button").forEach(b => b.onclick = () => { const r = list[Number(b.dataset.i)]; setLoc({ naam: r.naam, lat: r.lat, lon: r.lon }); });
  };
  document.getElementById("locGpsBtn").onclick = () => {
    if(!navigator.geolocation){ results.innerHTML = `<span class="none">—</span>`; return; }
    navigator.geolocation.getCurrentPosition(
      pos => setLoc({ naam: t("setLocGpsName"), lat: Math.round(pos.coords.latitude*1000)/1000, lon: Math.round(pos.coords.longitude*1000)/1000 }),
      err => { results.innerHTML = `<span class="none">${escapeHtml(err.message)}</span>`; },
      { timeout: 10000 });
  };
  const clr = document.getElementById("locClearBtn");
  if(clr) clr.onclick = () => setLoc(null);
  document.getElementById("setAuto").onchange = e => { state.settings.autoBuiten = e.target.checked; formModeTouched = false; scheduleAutoSave(); renderAll(); };
}


/* ================= 24-UURSGEMIDDELDE BUITEN & ONLINE BIJVULLEN =================
   Binnen reageert traag op buiten (muren en vloeren houden warmte vast). Daarom bewaart Tembo per
   meting ook de gemiddelde buitentemperatuur van de 24 uur vóór de meting (`buiten24`). Alleen voor
   metingen die je hebt — er wordt niets "op voorraad" opgehaald. */
function keyToTs(k){ const [d, hm] = k.split("T"); const [y,mo,da] = d.split("-").map(Number); const [h,mi] = hm.split(":").map(Number); return new Date(y, mo-1, da, h, mi).getTime(); }
function tsToISO(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function tsFrom(datum, tijd){ const [y,mo,d] = datum.split("-").map(Number); const [h,mi] = (tijd || "12:00").split(":").map(Number); return new Date(y, mo-1, d, h||0, mi||0).getTime(); }
async function hourlyBetween(loc, fromTs, toTs){
  const days = [];
  for(let d = tsToISO(fromTs); d <= tsToISO(toTs); d = addDaysISO(d, 1)) days.push(d);
  const merged = {};
  for(const d of days){ Object.assign(merged, await fetchHourly(loc, d)); }
  return Object.keys(merged).filter(k => { const ts = keyToTs(k); return ts >= fromTs && ts <= toTs; }).map(k => merged[k]);
}
async function mean24(loc, m){
  const end = tsOf(m);
  if(end > Date.now()) return null;
  const vals = await hourlyBetween(loc, end - 24*3600000, end);
  if(vals.length < 20) return null;
  return Math.round(avg(vals) * 10) / 10;
}
async function hourlySeries(loc, fromTs, toTs){
  const days = [];
  for(let d = tsToISO(fromTs); d <= tsToISO(toTs); d = addDaysISO(d, 1)) days.push(d);
  const merged = {};
  for(const d of days){ Object.assign(merged, await fetchHourly(loc, d)); }
  return Object.keys(merged).map(k => ({ ts: keyToTs(k), v: merged[k] })).filter(x => x.ts >= fromTs && x.ts <= toTs).sort((x,y) => x.ts - y.ts);
}
async function meanBetween(loc, fromTs, toTs){
  if(toTs > Date.now()) return null;
  const vals = await hourlyBetween(loc, Math.floor(fromTs/3600000)*3600000, Math.ceil(toTs/3600000)*3600000);
  if(!vals.length) return null;
  return Math.round(avg(vals) * 10) / 10;
}
/* Datum/tijd van een meting gewijzigd: de online buitentemperatuur hoort bij het oude moment. Haal
   hem opnieuw op; stond de meting op "online", pas dan ook de buitenwaarde zelf aan. */
async function refreshOnlineFor(m){
  const loc = state.settings.locatie, stateRef = state;
  if(!loc){ if(m.buitenBron !== "online") m.buitenOnline = null; return; }
  try{
    const v = await fetchOutdoorTemp(loc, m.datum, m.tijd);
    if(state !== stateRef || !state.metingen.includes(m)) return;
    m.buitenOnline = v;
    if(m.buitenBron === "online" && v !== null) m.buiten = v;
    if(m.buitenBron === "online" && v === null) m.buitenBron = "handmatig";
    scheduleAutoSave();
    const ae = document.activeElement;
    if(!ae || !["INPUT","SELECT","TEXTAREA"].includes(ae.tagName)) renderAll({ skipProfile:true });
  }catch(err){ console.warn("Buitentemperatuur opnieuw ophalen mislukt:", err); }
}
let backfillRunning = false, backfillAgain = false;
async function backfillOnline(){
  const loc = state.settings.locatie;
  if(!loc || !encryptionPassword) return;
  if(backfillRunning){ backfillAgain = true; return; }
  backfillRunning = true;
  let changed = false;
  const stateRef = state;
  try{
    for(const m of state.metingen.slice()){
      if(m.buiten24 !== undefined || !validISODate(m.datum)) continue;
      try{ const v = await mean24(loc, m); if(state !== stateRef) return; if(v !== null || tsOf(m) < Date.now() - 3*86400000){ m.buiten24 = v; changed = true; } }
      catch(err){ console.warn("24-uursgemiddelde ophalen mislukt:", err); break; }
    }
    for(const a of state.afkoeltests.slice()){
      if(a.buitenGemBron === "handmatig" || !coolComplete(a) || coolEndTs(a) > Date.now()) continue;
      if(typeof a.buitenGem === "number" && Array.isArray(a.buitenUur)) continue;
      try{
        const ser = await hourlySeries(loc, coolStartTs(a) - 3600000, coolEndTs(a) + 3600000);
        if(state !== stateRef) return;
        if(ser.length){
          const inRange = ser.filter(x => x.ts >= Math.floor(coolStartTs(a)/3600000)*3600000 && x.ts <= Math.ceil(coolEndTs(a)/3600000)*3600000);
          a.buitenUur = ser; a.buitenGem = Math.round(avg((inRange.length ? inRange : ser).map(x => x.v)) * 10) / 10; a.buitenGemBron = "online"; changed = true;
        }
      }
      catch(err){ console.warn("Buitengemiddelde afkoeltest ophalen mislukt:", err); break; }
    }
  } finally {
    backfillRunning = false;
  }
  if(state !== stateRef) return;
  if(changed){
    scheduleAutoSave();
    // Niet midden in het typen alles opnieuw opbouwen: alleen als er geen invoerveld focus heeft.
    const ae = document.activeElement;
    if(!ae || !["INPUT","SELECT","TEXTAREA"].includes(ae.tagName)) renderAll({ skipProfile:true });
    else { renderTabs(); renderSummary(); redrawCharts(); }
  }
  if(backfillAgain){ backfillAgain = false; backfillOnline(); }
}

/* ================= AFKOELTESTS =================
   Verwarming en airco uit, binnen meten bij start (bijv. 23:00) en eind (bijv. 07:00).
   Newton-afkoeling: (T_eind − T_buiten) = (T_start − T_buiten) · e^(−Δt/τ)
   → τ = −Δt / ln((T_eind − T_buiten) / (T_start − T_buiten)).
   τ (uren) is de tijdconstante van het huis: hoe hoger, hoe trager het afkoelt en hoe beter het
   isoleert. Omdat τ gecorrigeerd is voor hoe koud het buiten was, zijn tests op verschillende
   avonden (en vóór/na isolatie) eerlijk met elkaar te vergelijken. */
function coolStartTs(a){ return tsFrom(a.startDatum, a.startTijd); }
function coolEndTs(a){ return tsFrom(a.eindDatum, a.eindTijd); }
function coolComplete(a){ return validISODate(a.startDatum) && a.startTijd && typeof a.startBinnen === "number" && validISODate(a.eindDatum) && a.eindTijd && typeof a.eindBinnen === "number" && coolEndTs(a) > coolStartTs(a); }
/* Metingen uit "Alle metingen" die binnen de test vallen: zelfde ruimte, cv én airco uit, strikt
   tussen start en eind. Die maken de curve betrouwbaarder. */
function coolRuimte(a){ return (a.ruimte || state.settings.defaultRuimte || "").toLowerCase(); }
function coolIntermediates(a){
  const s = coolStartTs(a), e = coolEndTs(a), r = coolRuimte(a);
  return sortedMetingen(state.metingen.filter(m => {
    const ts = tsOf(m);
    return ts > s + 60000 && ts < e - 60000 && (m.ruimte || "").toLowerCase() === r && klimaatOf(m).mode === "vrij";
  }));
}
/* Buitentemperatuur op elk moment tijdens de test: uurwaarden (online) lineair geïnterpoleerd, of
   een vast gemiddelde (handmatig ingevuld of geen uurwaarden beschikbaar). */
function coolOutFn(a){
  if(a.buitenGemBron !== "handmatig" && Array.isArray(a.buitenUur) && a.buitenUur.length >= 2){
    const u = a.buitenUur;
    return ts => {
      if(ts <= u[0].ts) return u[0].v;
      for(let i = 1; i < u.length; i++) if(ts <= u[i].ts){ const f = (ts - u[i-1].ts) / (u[i].ts - u[i-1].ts); return u[i-1].v + (u[i].v - u[i-1].v) * f; }
      return u[u.length-1].v;
    };
  }
  return typeof a.buitenGem === "number" ? (() => a.buitenGem) : null;
}
/* Newton-afkoeling met variërende buitentemperatuur: dT/dt = −(T − T_buiten(t)) / τ.
   Voor een gegeven τ simuleren we de binnentemperatuur vanaf de start (stapjes van 5 min) en
   vergelijken met alle gemeten punten; τ is de waarde met de kleinste kwadratische fout
   (gulden-snede-zoektocht op log τ tussen 2 en 5000 uur). Met alleen start + eind en een vast
   buitengemiddelde komt dit exact uit op de klassieke formule τ = −Δt / ln(...). */
function simulateCool(points, outAt, tau){
  const step = 5 * 60000; let T = points[0].T, ts = points[0].ts; const pred = [];
  for(let i = 1; i < points.length; i++){
    while(ts < points[i].ts){ const dt = Math.min(step, points[i].ts - ts); const out = outAt(ts + dt/2); T = out + (T - out) * Math.exp(-(dt/3600000) / tau); ts += dt; }
    pred.push(T);
  }
  return pred;
}
function fitTau(points, outAt){
  const obs = points.slice(1).map(p => p.T);
  const sse = tau => simulateCool(points, outAt, tau).reduce((acc, v, i) => acc + (v - obs[i]) ** 2, 0);
  let lo = Math.log(2), hi = Math.log(5000);
  const g = (Math.sqrt(5) - 1) / 2;
  let c = hi - g*(hi-lo), d = lo + g*(hi-lo), fc = sse(Math.exp(c)), fd = sse(Math.exp(d));
  for(let k = 0; k < 60; k++){
    if(fc < fd){ hi = d; d = c; fd = fc; c = hi - g*(hi-lo); fc = sse(Math.exp(c)); }
    else { lo = c; c = d; fc = fd; d = lo + g*(hi-lo); fd = sse(Math.exp(d)); }
  }
  const tau = Math.exp((lo + hi) / 2);
  const rms = Math.sqrt(sse(tau) / obs.length);
  return { tau, rms, atBound: tau > 4900 || tau < 2.1 };
}
function coolCalc(a){
  if(!coolComplete(a) || coolEndTs(a) > Date.now()) return { status:"running" };
  const dtH = (coolEndTs(a) - coolStartTs(a)) / 3600000;
  const drop = a.startBinnen - a.eindBinnen;
  const outAt = coolOutFn(a);
  const out = typeof a.buitenGem === "number" ? a.buitenGem : null;
  const mids = coolIntermediates(a);
  const res = { status:"ok", dtH, drop, dropPerH: drop / dtH, out, tau:null, small:false, nPoints: 2 + mids.length, mids: mids.length, rise:false, rough:false, heated:false };
  // Stond er tijdens de test (zelfde ruimte) toch verwarming of koeling aan volgens "Alle metingen"?
  const sT = coolStartTs(a), eT = coolEndTs(a), room = coolRuimte(a);
  res.heated = state.metingen.some(m => { const ts = tsOf(m), md = klimaatOf(m).mode; return ts > sT && ts < eT && (m.ruimte || "").toLowerCase() === room && (md === "verwarmen" || md === "koelen" || md === "gemengd"); });
  if(!outAt){ res.status = "noout"; return res; }
  const points = [{ ts: coolStartTs(a), T: a.startBinnen }].concat(mids.map(m => ({ ts: tsOf(m), T: m.binnen }))).concat([{ ts: coolEndTs(a), T: a.eindBinnen }]);
  // Stijging tussendoor = waarschijnlijk toch verwarmd, zon of een open deur: test onbetrouwbaar.
  for(let i = 1; i < points.length; i++) if(points[i].T - points[i-1].T > 0.3) res.rise = true;
  const d0 = a.startBinnen - outAt(points[0].ts);
  res.small = d0 < 3;
  if(points.some(p => p.T - outAt(p.ts) <= 0)){ res.status = "invalid"; return res; }
  if(drop <= 0){ res.status = "nodrop"; return res; }
  const fit = fitTau(points, outAt);
  if(fit.atBound && fit.tau > 4900){ res.status = "nodrop"; return res; }
  res.tau = fit.tau; res.rms = fit.rms;
  res.rough = points.length > 2 && fit.rms > 0.4;
  res.drop8at10 = 10 * (1 - Math.exp(-8 / res.tau));
  return res;
}
function coolPhase(a){ const iso = state.settings.isolatieDatum; if(!iso) return null; return a.startDatum < iso ? "voor" : "na"; }
function fmtH(n){ if(n === null || n === undefined || !isFinite(n)) return "—"; return n.toLocaleString(state.lang==="en"?"en-GB":"nl-NL", { maximumFractionDigits: n >= 100 ? 0 : 1 }); }
function sortedCool(){ return state.afkoeltests.slice().sort((x,y) => coolStartTs(x) - coolStartTs(y)); }
function coolTauText(a, c){
  if(c.status === "running") return `<span class="phase">${t("coolRunning")}</span>`;
  if(c.status === "noout") return `<span class="muted" title="${escapeHtml(t("coolNeedOut"))}">?</span>`;
  if(c.status === "nodrop") return `<span class="muted">${t("coolNoDrop")}</span>`;
  if(c.status === "invalid") return "—";
  const warns = [c.heated ? t("coolHeated") : null, c.small ? t("coolSmallDelta") : null, c.rise ? t("coolRise") : null, c.rough ? t("coolRough") : null].filter(Boolean);
  return `<strong class="mono">${fmtH(c.tau)}</strong>${warns.length ? ` <span class="warn-dot" title="${escapeHtml(warns.join(" · "))}">!</span>` : ""}<div class="pts">${escapeHtml(t("coolPoints")(c.nPoints))}</div>`;
}
/* Afkoeltests herkennen in "Alle metingen": een meting met alles uit tussen 18:00 en 02:00 (start),
   gevolgd door metingen in dezelfde ruimte die allemaal alles-uit zijn, tot een meting tussen 04:00
   en 10:00 (eind), 4–16 uur later, met een lagere binnentemperatuur. Een meting mét verwarming of
   koeling (of onbekend) ertussen breekt de reeks. Niet voorgesteld als hij overlapt met een
   bestaande test of eerder genegeerd is. */
function coolCandidates(){
  const dismissed = new Set(state.afkoelGenegeerd || []);
  const byRoom = {};
  sortedMetingen(state.metingen).forEach(m => { const r = (m.ruimte || "").toLowerCase(); (byRoom[r] = byRoom[r] || []).push(m); });
  const hourOf = m => Number((m.tijd || "12:00").split(":")[0]);
  const isStartH = h => h >= 18 || h < 2, isEndH = h => h >= 4 && h < 10;
  const out = [];
  Object.values(byRoom).forEach(list => {
    for(let i = 0; i < list.length; i++){
      const s = list[i];
      if(klimaatOf(s).mode !== "vrij" || !s.tijd || !isStartH(hourOf(s))) continue;
      let best = null;
      for(let j = i + 1; j < list.length; j++){
        const e = list[j], dtH = (tsOf(e) - tsOf(s)) / 3600000;
        if(dtH > 16) break;
        if(klimaatOf(e).mode !== "vrij") break;
        if(e.tijd && isEndH(hourOf(e)) && dtH >= 4 && e.binnen < s.binnen) best = { e, j };
      }
      if(!best) continue;
      const key = s.id + "|" + best.e.id;
      if(dismissed.has(key)) continue;
      const sT = tsOf(s), eT = tsOf(best.e);
      if(state.afkoeltests.some(a => validISODate(a.startDatum) && coolStartTs(a) < eT && (coolComplete(a) ? coolEndTs(a) : coolStartTs(a) + 12*3600000) > sT)) continue;
      out.push({ key, s, e: best.e, mids: best.j - i - 1 });
      i = best.j;   // geen overlappende voorstellen binnen dezelfde reeks
    }
  });
  return out.sort((x, y) => tsOf(y.s) - tsOf(x.s));
}

    <th>${t("thStart")}</th><th class="num">${t("thBinnen")}</th><th>${t("thEind")}</th><th class="num">${t("thBinnen")}</th><th class="num">${t("thBuitenGem")}</th>

  </tr></thead><tbody>${rows}</tbody></table></div>`;
}
function wireCoolTable(){
  document.querySelectorAll(".ctable tbody tr").forEach(tr => {
    const a = state.afkoeltests.find(x => x.id === tr.dataset.id);
    if(!a) return;
    tr.querySelectorAll("[data-f]").forEach(inp => {
      const f = inp.dataset.f;
      if(f === "startDatum" || f === "eindDatum") inp.addEventListener("blur", () => { if(inp.value && !validISODate(inp.value)) inp.value = a[f] || ""; });
      inp.addEventListener("change", () => {
        if(f === "startDatum" || f === "eindDatum"){
          if(inp.value && !validISODate(inp.value)) return;
          if(!inp.value && f === "startDatum"){ inp.value = a.startDatum; return; }
          a[f] = inp.value;
        } else if(["startBinnen","eindBinnen","buitenGem"].includes(f)){
          const n = parseNum(inp.value);
          if(inp.value.trim() !== "" && n === null){ inp.value = a[f] ?? ""; return; }
          if(f === "startBinnen" && n === null){ inp.value = a[f]; return; }
          a[f] = n;
          if(f === "buitenGem"){ a.buitenGemBron = n === null ? null : "handmatig"; if(n === null) delete a.buitenUur; }
        } else a[f] = inp.value.trim ? inp.value.trim() : inp.value;
        if(["startDatum","startTijd","eindDatum","eindTijd"].includes(f) && a.buitenGemBron !== "handmatig"){ a.buitenGem = null; a.buitenGemBron = null; delete a.buitenUur; }
