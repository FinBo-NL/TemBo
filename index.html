  const hasIso = !!state.settings.isolatieDatum;
  const colorOf = p => !hasIso ? "var(--accent)" : coolPhase(p.a) === "voor" ? "var(--c-voor)" : "var(--c-na)";
  const W = chartWidth(el), H = Math.round(Math.min(300, Math.max(210, W*0.38)));
  const m = { l:46, r:20, t:18, b:30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = pts.map(p => coolStartTs(p.a));
  let bx0 = Math.min(...xs), bx1 = Math.max(...xs);
  if(bx1 - bx0 < 2*86400000){ bx0 -= 86400000; bx1 += 86400000; }
  // Zoombaar zoals de andere grafieken; kleinste uitsnede 1 dag × 5 uur afkoeltijd (labels in hele uren).
  const V = xyView(el, "afkoel", { lo: bx0, hi: bx1 }, niceTicks(0, Math.max(...pts.map(p => p.c.tau)) * 1.15, 5), { x: DAY, y: 5 });
  const x0 = V.xt.lo, x1 = V.xt.hi, yt = V.yt;
  const X = v => m.l + (v - x0) / (x1 - x0) * iw;
  const Y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let grid = yt.ticks.map(v => `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${escapeHtml(t("hours")(fmtH(v)))}</text>`).join("");
  // Eén label per dag (om de zoveel dagen als het er veel zijn), op middernacht.
  const dayTs = []; for(let d = tsToISO(x0); tsFrom(d, "00:00") <= x1; d = addDaysISO(d, 1)){ const ts = tsFrom(d, "00:00"); if(ts >= x0) dayTs.push(ts); }
  const every = Math.max(1, Math.ceil(dayTs.length / Math.max(2, Math.floor(iw / 70))));
  dayTs.forEach((ts, i) => { if(i % every) return; const x = X(ts); grid += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)"/><text x="${x}" y="${H-8}" text-anchor="${x < m.l + 24 ? "start" : x > m.l + iw - 24 ? "end" : "middle"}">${escapeHtml(fmtDate(tsToISO(ts)))}</text>`; });
  // Sterk ingezoomd (< 3 dagen): ook uurlabels tussen de dagen.
  if(x1 - x0 < 3 * DAY){ const stepH = [3, 6, 12].find(h => h * HOUR / (x1 - x0) * iw >= 52) || 24;
    for(let ts = Math.ceil(x0 / HOUR) * HOUR; ts <= x1; ts += HOUR){ const h = new Date(ts).getHours(); if(!h || h % stepH) continue; const x = X(ts); if(x < m.l + 24 || x > m.l + iw - 24) continue; grid += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)" stroke-dasharray="2 3"/><text x="${x}" y="${H-8}" text-anchor="middle">${pad2(h)}:00</text>`; } }
  let iso = "";
  if(hasIso){ const it = tsFrom(state.settings.isolatieDatum, "00:00"); if(it >= x0 && it <= x1){ const right = X(it) > m.l + iw - 70; iso = `<line x1="${X(it)}" x2="${X(it)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-soft)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${right ? X(it)-5 : X(it)+5}" y="${m.t+11}" text-anchor="${right ? "end" : "start"}" class="lbl-strong">${escapeHtml(t("lIsolatie"))}</text>`; } }
  const line = pts.length > 1 ? `<path d="${pts.map((p,i) => `${i?"L":"M"}${X(coolStartTs(p.a)).toFixed(1)},${Y(p.c.tau).toFixed(1)}`).join("")}" fill="none" stroke="var(--text-soft)" stroke-width="1.5" opacity=".45"/>` : "";
  const dots = pts.map(p => `<circle cx="${X(coolStartTs(p.a))}" cy="${Y(p.c.tau)}" r="6" fill="${colorOf(p)}" stroke="var(--paper)" stroke-width="2"/>`).join("");
  const inV = pts.filter(p => { const x = coolStartTs(p.a); return x >= x0 && x <= x1 && p.c.tau >= yt.lo && p.c.tau <= yt.hi; });
  const last = inV.length ? inV[inV.length-1] : null;
  const lbl = !last ? "" : `<text x="${Math.min(X(coolStartTs(last.a)) + 10, m.l+iw-4)}" y="${Y(last.c.tau) - 10}" text-anchor="${X(coolStartTs(last.a)) > m.l+iw-60 ? "end" : "start"}" class="lbl-strong">${escapeHtml(t("coolTau"))} ${escapeHtml(t("hours")(fmtH(last.c.tau)))}</text>`;
  const legend = hasIso
    ? `<span class="key"><i class="sw dot" style="background:var(--c-voor)"></i>${t("lVoor")}</span><span class="key"><i class="sw dot" style="background:var(--c-na)"></i>${t("lNa")}</span><span class="key"><i class="sw dash"></i>${t("lIsolatie")}</span>`
    : `<span class="key"><i class="sw dot" style="background:var(--accent)"></i>${t("coolTable")} (${pts.length})</span>`;
  el.innerHTML = `<div class="chart-legend">${legend}</div><div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t("coolChart"))}">${xyClipDef("afkoel", m, iw, ih)}${grid}<g clip-path="url(#xyc-afkoel)">${iso}${line}${dots}</g>${lbl}</svg></div>${xyBarHTML(el)}`;
  xyFinish(el, { W, m, iw, ih }, () => drawCoolChart(el), pts.map(p => ({ x: coolStartTs(p.a), y: p.c.tau })));
  const wrap = el.querySelector(".chart-wrap"), svgEl = wrap.querySelector("svg"), tip = attachTooltip(wrap);
  svgEl.addEventListener("pointermove", ev => {
    const r = svgEl.getBoundingClientRect(), scale = W / r.width;
    const px = (ev.clientX - r.left) * scale, py = (ev.clientY - r.top) * scale;
    let best = null, bd = 22;
    if(!xyInView(el, px, py)){ tip.hide(); return; }
    pts.forEach(p => { const d = Math.hypot(X(coolStartTs(p.a)) - px, Y(p.c.tau) - py); if(d < bd){ bd = d; best = p; } });
    if(!best){ tip.hide(); return; }
    const a = best.a, c = best.c, col = colorOf(best);
    tip.show(`<div class="tt-head">${escapeHtml(fmtDate(a.startDatum, true))} ${escapeHtml(a.startTijd)} → ${escapeHtml(a.eindTijd)}</div>
      ${ttRow(col, t("coolTau"), escapeHtml(t("hours")(fmtH(c.tau))))}
      ${ttRow(col, t("thDaling"), fmtT(a.startBinnen) + " → " + fmtT(a.eindBinnen))}
      ${ttRow(col, t("thBuitenGem"), fmtT(c.out))}${ttRow(col, t("coolPointsLbl"), String(c.nPoints))}`, X(coolStartTs(a))/scale, Y(c.tau)/scale);
  });
  svgEl.addEventListener("pointerleave", () => tip.hide());
}
function renderCoolSummary(el){
  const all = sortedCool().map(a => ({ a, c: coolCalc(a) }));
  const done = all.filter(p => p.c.tau);
  const avgTau = avg(done.map(p => p.c.tau));
  let html = `<h2>${t("coolSumTitle")}</h2>
    <div class="stamp"><div class="stamp-label">${t("coolAvgTau")}</div><div class="stamp-value">${avgTau ? escapeHtml(t("hours")(fmtH(avgTau))) : "—"}</div><div class="stamp-sub">${escapeHtml(t("coolOver")(done.length))}</div></div>`;
  const last = done[done.length-1];
  if(last){
    html += `<div class="summary-line"><span class="l">${t("coolLast")}</span><span class="v">${escapeHtml(fmtDate(last.a.startDatum, true))}</span></div>
      <div class="summary-line"><span class="l">${t("coolLastTau")}</span><span class="v">${escapeHtml(t("hours")(fmtH(last.c.tau)))}</span></div>
      <div class="summary-line"><span class="l">${t("coolLastDrop")}</span><span class="v">${fmtDelta(-last.c.drop)} / ${escapeHtml(t("hours")(fmtH(last.c.dtH)))}</span></div>
      <div class="summary-line"><span class="l">${t("coolLastOut")}</span><span class="v">${fmtT(last.c.out)}</span></div>
      <p class="summary-hint">${escapeHtml(t("coolExplain")(last.c.tau))}</p>`;
  }
  html += `<p class="summary-hint">${escapeHtml(t("coolCaveat"))}</p>`;
  html += actionsHTML();
  el.innerHTML = html;
  wireActions();
}
/* Conclusie afkoeltests: gemiddelde τ na t.o.v. vóór. Onder ±15 % (of met 1 test per kant) noemen we
   het geen duidelijk verschil / voorlopig — dagelijkse omstandigheden (wind, zon, bewoning) laten τ
   makkelijk zo veel schommelen. */
function coolExportRows(){
  const en = state.lang === "en";
  return sortedCool().map(a => { const c = coolCalc(a); return {
    [en?"Start date":"Startdatum"]: a.startDatum, [en?"Start time":"Starttijd"]: a.startTijd, [en?"Indoor start (°C)":"Binnen start (°C)"]: a.startBinnen,
    [en?"End date":"Einddatum"]: a.eindDatum || "", [en?"End time":"Eindtijd"]: a.eindTijd || "", [en?"Indoor end (°C)":"Binnen eind (°C)"]: a.eindBinnen ?? "",
    [en?"Outdoor avg. (°C)":"Buiten gem. (°C)"]: a.buitenGem ?? "", [en?"Outdoor source":"Bron buiten"]: a.buitenGemBron || "",
    [en?"Duration (h)":"Duur (u)"]: c.dtH ? Math.round(c.dtH*10)/10 : "", [en?"Time constant τ (h)":"Tijdconstante τ (u)"]: c.tau ? Math.round(c.tau) : "",
    [en?"Room":"Ruimte"]: a.ruimte || "", [en?"Points":"Meetpunten"]: c.nPoints || "", [en?"Source":"Bron"]: a.bron || "handmatig",
    [en?"Note":"Notitie"]: a.notitie || "",
  }; });
}

/* ================= PROFIELPANEEL ================= */
let profileTab = "settings";
function renderProfilePanel(){
  document.getElementById("profilePanelTitle").textContent = t("profileTitle");
  document.getElementById("profilePanelTabs").innerHTML = ["settings","account"].map(k => `<button class="profile-tab-btn ${profileTab===k?"active":""}" data-tab="${k}">${t(k==="account"?"tabAccount":"tabSettings")}</button>`).join("");
  document.querySelectorAll(".profile-tab-btn").forEach(b => b.onclick = () => { profileTab = b.dataset.tab; renderProfilePanel(); });
  const body = document.getElementById("profilePanelBody");
  wireEnterSubmit(body);
  if(profileTab === "settings"){
    body.innerHTML = `
      <div>
        <label class="profile-field">${t("setComfort")}<input type="text" inputmode="decimal" id="setComfort" value="${escapeHtml(String(comfortT()).replace(".", state.lang === "en" ? "." : ","))}" /></label>
        <p class="profile-hint">${escapeHtml(t("setComfortHint"))}</p>
      </div>
      <div>
        <label class="profile-field">${t("setRef")}<input type="number" step="1" id="setRef" value="${escapeHtml(state.settings.refBuiten)}" /></label>
        <p class="profile-hint">${escapeHtml(t("setRefHint"))}</p>
      </div>
      <div id="roomSection" data-submit-block>
        <div class="profile-section-title">${t("setRooms")}</div>
        <ul class="room-list" id="roomList"></ul>
        <div class="loc-search-row"><input type="text" id="roomNew" maxlength="40" placeholder="${escapeHtml(t("roomNewPh"))}" /><button class="primary" id="roomAddBtn">${t("roomAdd")}</button></div>
        <div class="room-msg" id="roomMsg" role="status"></div>
        <p class="profile-hint">${escapeHtml(t("roomsHint"))}</p>
      </div>
      <hr class="profile-divider">
      <div data-submit-block>
        <div class="profile-section-title">${t("setLoc")}</div>
        <div class="profile-current-email" id="locCurrent">${state.settings.locatie ? `${t("setLocCurrent")} ${escapeHtml(state.settings.locatie.naam)} <span class="profile-hint">(${state.settings.locatie.lat.toFixed(3)}, ${state.settings.locatie.lon.toFixed(3)})</span>` : escapeHtml(t("setLocNone"))}</div>
        <div class="loc-search-row"><input type="text" id="locQuery" placeholder="6411 AB 12 / Heerlen" /><button class="primary" id="locSearchBtn">${t("setLocSearch")}</button></div>
        <div class="loc-results" id="locResults"></div>
        <div class="loc-btn-row"><button id="locGpsBtn">${t("setLocGps")}</button>${state.settings.locatie ? `<button id="locClearBtn">${t("setLocClear")}</button>` : ""}</div>
        <p class="profile-hint">${escapeHtml(t("setLocHint"))}</p>
        <label class="profile-check"><input type="checkbox" id="setAuto" ${state.settings.autoBuiten ? "checked" : ""} /> ${escapeHtml(t("setAuto"))}</label>
      </div>`;
    wireLocationSettings();
    document.getElementById("setComfort").onchange = e => { const n = parseNum(e.target.value); if(n !== null && n >= 10 && n <= 30){ state.settings.comfortTemp = n; scheduleAutoSave(); renderAll({ skipProfile: true }); } else e.target.value = String(comfortT()); };
    document.getElementById("setRef").onchange = e => { const n = parseNum(e.target.value); if(n !== null){ state.settings.refBuiten = n; scheduleAutoSave(); renderAll(); } };
    renderRoomSection();
  } else {
    const email = cloudSession ? cloudSession.user.email : "";
    body.innerHTML = `
      <div data-submit-block>
        <div class="profile-section-title">${t("accEmail")}</div>
        <div class="profile-current-email">${escapeHtml(email)}</div>
        <label class="profile-field">${t("accNewEmail")}<input type="email" id="accEmail" autocomplete="email" /></label>
        <button class="primary" id="accEmailBtn">${t("accUpdateEmail")}</button>
        <div id="accEmailMsg"></div>
      </div>
      <hr class="profile-divider">
      <div data-submit-block>
        <label class="profile-field">${t("accNewPw")}<input type="password" id="accPw" autocomplete="new-password" /></label>
        <p class="profile-hint">${escapeHtml(t("accPwHint"))}</p>
        <button class="primary" id="accPwBtn">${t("accUpdatePw")}</button>
        <div id="accPwMsg"></div>
      </div>
      <hr class="profile-divider">
      <div><button id="accLogout">${t("logoutBtn")}</button></div>`;
    const upd = async (payload, msgId) => {
      const box = document.getElementById(msgId);
      try{ const { error } = await cloudClient.auth.updateUser(payload); if(error) throw error; box.className = "profile-msg notice"; box.textContent = t("accUpdated"); }
      catch(err){ box.className = "profile-msg error"; box.textContent = err.message || String(err); }
    };
    document.getElementById("accEmailBtn").onclick = () => { const v = document.getElementById("accEmail").value.trim(); if(v) upd({ email:v }, "accEmailMsg"); };
    document.getElementById("accPwBtn").onclick = () => { const v = document.getElementById("accPw").value; if(v) upd({ password:v }, "accPwMsg"); };
    document.getElementById("accLogout").onclick = signOutCloud;
  }
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));
}

/* ================= RENDER ================= */
function applyMode(){
  document.documentElement.setAttribute("data-mode", state.darkMode ? "dark" : "light");
  document.documentElement.lang = state.lang;
  const moon = document.getElementById("modeIconMoon"), sun = document.getElementById("modeIconSun");
  if(moon){ moon.style.display = state.darkMode ? "none" : ""; sun.style.display = state.darkMode ? "" : "none"; }
}
function renderAll(opts){
  applyMode();
  document.getElementById("mainTitle").textContent = t("tagline");
  document.getElementById("navDrawerTitle").textContent = t("navTitle");
  renderTabs();
  renderMain();
  renderSummary();
  if(document.getElementById("profilePanel").classList.contains("open") && !(opts && opts.skipProfile)) renderProfilePanel();
  if(opts && opts.keepFocus){
    const inp = document.querySelector(`tr[data-id="${opts.keepFocus.id}"] [data-f="${opts.keepFocus.f}"]`);
    if(inp && inp.type === "text"){ const l = inp.value.length; inp.focus(); try{ inp.setSelectionRange(l, l); }catch(e){} }
    if(inp) inp.focus();
  }
}
function bootApp(){
  state.activeView = { type:"overview" };
  Object.keys(chartFilters).forEach(k => delete chartFilters[k]); scatterBasisUser = null; timePeriod = "1"; timeZoom = null; timeView = "temp"; tableOpenMonths.clear(); formKlimaat = null; formDraft = null; formTimeTouched = false; lastImportMsg = ""; formModeTouched = false;
  dirty = false; stateGeneration = 0; savedGeneration = 0;
  renderAll();
  backfillOnline();
}

/* ================= EVENTS ================= */
document.getElementById("navToggleBtn").onclick = () => setNavDrawer(true);
document.getElementById("navCloseBtn").onclick = () => setNavDrawer(false);
document.getElementById("navBackdrop").onclick = () => setNavDrawer(false);
document.getElementById("profileBtn").onclick = () => setProfilePanel(!document.getElementById("profilePanel").classList.contains("open"));
document.getElementById("profileCloseBtn").onclick = () => setProfilePanel(false);
document.getElementById("profileBackdrop").onclick = () => setProfilePanel(false);
document.addEventListener("keydown", e => { if(e.key === "Escape"){ setNavDrawer(false); setProfilePanel(false); } });
document.getElementById("modeBtn").onclick = () => { state.darkMode = !state.darkMode; scheduleAutoSave(); renderAll(); };
document.querySelectorAll(".lang-btn").forEach(b => b.onclick = () => { state.lang = b.dataset.lang; scheduleAutoSave(); renderAll(); });
document.getElementById("importFileInput").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if(f) handleImportFile(f); });
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if(encryptionPassword) redrawCharts(); }, 150); });

/* Supabase ververst het inlogtoken zelf; houd onze kopie van de sessie bij. Wordt er elders
   uitgelogd (of verloopt de sessie definitief), toon dan weer het inlogscherm. */
if(cloudClient && cloudClient.auth.onAuthStateChange){
  cloudClient.auth.onAuthStateChange((event, session) => {
    if(session && cloudSession && session.user.id === cloudSession.user.id) cloudSession = session;
    if(event === "SIGNED_OUT" && cloudSession && encryptionPassword){
      cloudSession = null; encryptionPassword = null; state = emptyState(); dirty = false;
      setProfilePanel(false); setNavDrawer(false); renderAuthGate();
    }
  });
}

/* Klok: werk datum/tijd van het invoerformulier bij naar "nu" (zolang je ze niet zelf hebt aangepast)
   en ververs de tijdgrafiek als die het huidige moment toont (nu-streep, online uurlijn). */
let lastClockMinute = "";
setInterval(() => {
  if(!encryptionPassword) return;
  const hm = nowHM(), today = todayISO();
  const fD = document.getElementById("fDatum"), fT = document.getElementById("fTijd");
  if(fD && fT && !formTimeTouched && document.activeElement !== fD && document.activeElement !== fT && (fT.value !== hm || fD.value !== today)){
    fD.value = today; fT.value = hm;
    if(formBuitenMode === "online") autoFillBuiten();
  }
  if(hm !== lastClockMinute){
    lastClockMinute = hm;
    const el = document.getElementById("timeChart");
    if(el && el._geom && !el._gesture){
      const w = timeWindow(timeList());
      if(Date.now() >= w.start - 60000 && Date.now() <= w.end + 60000) drawTimeChart(el, timeList());
    }
  }
}, 30000);

/* ================= START ================= */
(async function start(){
  try{ if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) state.darkMode = true; }catch(e){}
  applyMode();
  if(cloudClient){
    try{ const { data } = await cloudClient.auth.getSession(); cloudSession = data && data.session ? data.session : null; }catch(e){ cloudSession = null; }
  }
  renderAuthGate();
})();
</script>
