/* ================= CONCLUSIES =================
   Er is geen nulmeting van vóór de isolatie, dus alle conclusies zijn absoluut: hoe houdt het huis
   zich nú, met vuistregel-ijkpunten als indicatie. Elke grafiek krijgt zijn eigen conclusie, berekend
   uit precies dezelfde (gefilterde) metingen als de grafiek:
   - Temperatuurverloop: demping = schommeling binnen / schommeling buiten in beeld, plus comfort.
   - Binnen t.o.v. buiten: trendlijn binnen = a + b·buiten (bij voorkeur alleen "alles uit"); daaruit
     binnen bij de referentie-buitentemperatuur en de geschatte stookgrens (waar de lijn je
     comfortgrens kruist). Ijkpunt stookgrens: gemiddeld NL-huis ~15–16 °C, goed geïsoleerd ~12–13 °C.
   - Per klimaat: stookgrens uit wanneer je echt gaat stoken; koelgrens; thermostaat gehaald.
   - Koeltests: koelsnelheid en hoe vaak de instelling gehaald wordt.
   - Afkoeltest: mediaan τ; < 35 u snel, 35–70 u gemiddeld, > 70 u goed.
   Onzekerheid: standaardfout van de regressie, met een ondergrens van 0,3 °C (thermometer). */
const MEAS_UNCERTAINTY = 0.3;
function predSE(r, x0){
  const s = Math.max(r.sres, MEAS_UNCERTAINTY / 2);
  return s * Math.sqrt(1 / r.n + (x0 - r.mx) ** 2 / r.sxx);
}
function comfortT(){ const c = Number(state.settings.comfortTemp); return isFinite(c) ? c : 19; }
function refT(){ const r = Number(state.settings.refBuiten); return isFinite(r) ? r : 10; }
function nf1(v){ return Number(v).toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { maximumFractionDigits: 1, minimumFractionDigits: 1 }); }
function fmtRate(v){ return nf1(v) + " " + t("ktPerH"); }
function hoursTxt(v){ return t("hours")(fmtH(v)); }
function median(arr){ const a = arr.slice().sort((x, y) => x - y), n = a.length; return n ? (n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2) : null; }
/* Generiek conclusieblok: status (good | neutral | bad | info | insufficient), kop, alinea's,
   kerngetallen [[label, waarde]], en optioneel zekerheid. */
function conBox(status, head, paras, facts, conf, extraCls){
  const icon = { good:"✓", bad:"!", neutral:"≈", info:"i", insufficient:"…", heat:"i" }[status] || "i";
  return `<div class="conclusion ${status}${extraCls ? " " + extraCls : ""}"><div class="con-head"><span class="con-icon" aria-hidden="true">${icon}</span>${escapeHtml(head)}</div>${(paras || []).filter(Boolean).map(p => `<p>${escapeHtml(p)}</p>`).join("")}${facts && facts.length ? `<div class="con-facts">${facts.map(([l, v]) => `<div><span class="l">${escapeHtml(l)}</span><span class="v">${escapeHtml(v)}</span></div>`).join("")}</div>` : ""}${conf ? `<div class="con-conf">${t("conConfidence")}: <strong>${t("conf_" + conf.level)}</strong>${conf.text ? " · " + escapeHtml(conf.text) : ""}</div>` : ""}</div>`;
}

/* --- Binnen t.o.v. buiten --- */
function houseFit(listIn, basis, kf){
  kf = kf || cfOf("scatter").kf;
  const res = { status: "insufficient", basis, excluded: listIn.filter(isRegulated).length, n: 0, range: 0 };
  if(kf === "verwarmen" || kf === "koelen"){ res.status = "heat"; return res; }
  const cand = listIn.filter(p => !isRegulated(p) && xOf(p, basis) !== null);
  const vrij = cand.filter(p => klimaatOf(p).mode === "vrij");
  const pts = arr => arr.map(p => ({ x: xOf(p, basis), y: p.binnen }));
  const ok = r => r && r.n >= 4 && (r.maxX - r.minX) >= 4;
  let use = vrij, r = linReg(pts(vrij));
  if(!ok(r)){ use = cand; r = linReg(pts(cand)); }
  res.use = use; res.n = use.length; res.range = r ? r.maxX - r.minX : (use.length ? 0 : 0);
  res.vrijOnly = use.length > 0 && use.every(p => klimaatOf(p).mode === "vrij");
  if(!ok(r)) return res;
  const comfort = comfortT(), ref = refT();
  Object.assign(res, { r, ref, comfort, b: r.b, pred: r.a + r.b * ref, pm: Math.max(MEAS_UNCERTAINTY, 2 * predSE(r, ref)) });
  res.extrap = ref < r.minX - 2 || ref > r.maxX + 2;
  res.heatShare = use.filter(p => { const md = klimaatOf(p).mode; return md === "verwarmen" || md === "koelen" || md === "gemengd"; }).length / use.length;
  if(r.b >= 0.05){ res.grens = (comfort - r.a) / r.b; res.grensExtrap = res.grens < r.minX - 3 || res.grens > r.maxX + 3; }
  if(res.grens !== undefined) res.status = res.grens <= 13 ? "good" : res.grens <= 15.5 ? "neutral" : "bad";
  else res.status = res.pred >= comfort ? "good" : res.pred >= comfort - 2 ? "neutral" : "bad";
  let lvl = (r.n >= 12 && res.range >= 8) ? 2 : (r.n >= 6 && res.range >= 5) ? 1 : 0;
  if(res.extrap || res.grensExtrap || res.heatShare >= 0.3) lvl = Math.max(0, lvl - 1);
  res.conf = ["low", "medium", "high"][lvl];
  return res;
}
function fitConclusionHTML(f, compact){
  const C = t("con2").fit;
  if(f.status === "heat") return conBox("info", C.head_heat, [C.heat], null, null, compact ? "compact" : "");
  if(f.status === "insufficient") return conBox("insufficient", t("conInsufficient"), [C.need(f.n, fmtT(f.range || 0))], null, null, compact ? "compact" : "");
  const paras = [C.pred(f.vrijOnly ? C.srcVrij : C.srcAll, fmtT(f.ref, 0), fmtT(f.pred), fmtT(f.pm))];
  if(f.extrap) paras.push(C.extrap);
  paras.push(C.slope(fmtT(Math.max(0, f.b))));
  if(f.grens !== undefined) paras.push(C.grens(fmtT(f.grens, 0), fmtT(f.comfort, 0)) + (f.grensExtrap ? " " + C.extrap : ""));
  else paras.push(f.pred >= f.comfort ? C.flatOk(fmtT(f.comfort, 0)) : C.flatLow(fmtT(f.comfort, 0)));
  if(f.vrijOnly) paras.push(C.vrijOnly); else if(f.heatShare >= 0.15) paras.push(C.heatShare(Math.round(f.heatShare * 100)));
  if(f.excluded) paras.push(C.excluded(f.excluded));
  const facts = [[C.fPred(fmtT(f.ref, 0)), "~" + fmtT(f.pred)], [C.fGrens, f.grens !== undefined ? "~" + fmtT(f.grens, 0) : "—"], [C.fSlope, fmtT(Math.max(0, f.b))], [C.fN, String(f.n)]];
  return conBox(f.status, C["head_" + f.status], paras, facts, { level: f.conf }, compact ? "compact" : "");
}
function perDagdeelHTML(basis){
  const C = t("con2").fit, base = cfApply("scatter", state.metingen, { skipDp: true });
  const rows = DAGDELEN.map(k => {
    const f = houseFit(base.filter(m => dagdeelOf(m.tijd) === k), basis);
    const st = f.status === "heat" ? "info" : f.status;
    const icon = { good:"✓", bad:"!", neutral:"≈", info:"i", insufficient:"…" }[st];
    const val = f.r ? C.dpVal(fmtT(f.pred), f.grens !== undefined ? fmtT(f.grens, 0) : "") : C.dpNeed(f.n);
    return `<button type="button" class="dp-con ${st} ${cfOf("scatter").dp === k ? "on" : ""}" data-dp="${k}"><span class="con-icon" aria-hidden="true">${icon}</span><span class="l">${escapeHtml(dpLabel(k))}</span><span class="v">${escapeHtml(val)}</span></button>`;
  }).join("");
  return `<h3>${t("conPerDp")} · ${escapeHtml(C.fPred(fmtT(refT(), 0)))}</h3><div class="dp-con-list">${rows}</div>`;
}

/* --- Temperatuurverloop: uitgebreide analyse van wat er in beeld is ---
   Bovenaan het oordeel (demping) en de kerngetallen; daaronder per onderdeel:
   demping + vertraging (kruiscorrelatie met de online uurtemperatuur, 0–12 u verschoven),
   afkoelen (paren opeenvolgende metingen met alles uit → °C/u en τ via de wet van Newton) en
   opwarmen (paren waarbij de verwarming aan stond), comfort (tijdgewogen: lineair tussen metingen,
   gaten > 12 u tellen niet), dagverloop per dagdeel, trend per dag, ruimtes (ook gelijktijdig),
   klimaatgebruik, uitschieters t.o.v. de trendlijn van die ruimte, en wat er nodig is voor meer. */
const conMoreOpen = { time: true };
document.addEventListener("toggle", e => { const d = e.target; if(d && d.dataset && d.dataset.conmore) conMoreOpen[d.dataset.conmore] = d.open; }, true);
function pearson(xs, ys){
  const n = xs.length; if(n < 3) return null;
  const mx = avg(xs), my = avg(ys); let sxy = 0, sxx = 0, syy = 0;
  for(let i = 0; i < n; i++){ const a = xs[i] - mx, b = ys[i] - my; sxy += a*b; sxx += a*a; syy += b*b; }
  return sxx > 1e-9 && syy > 1e-9 ? sxy / Math.sqrt(sxx * syy) : null;
}
function hourlyAt(hourly, ts){
  if(!hourly || hourly.length < 2 || ts < hourly[0].ts - 1.5*HOUR || ts > hourly[hourly.length-1].ts + 1.5*HOUR) return null;
  const j = hourly.findIndex(h => h.ts >= ts); if(j < 0) return hourly[hourly.length-1].v; if(j === 0) return hourly[0].v;
  const a = hourly[j-1], b = hourly[j]; return a.v + (b.v - a.v) * (ts - a.ts) / (b.ts - a.ts);
}
function whenTxt(m){ return `${fmtDate(m.datum)}${m.tijd ? " " + m.tijd : ""}${m.ruimte && ruimteList().length > 1 ? " · " + m.ruimte : ""}`; }
function timeConclusionHTML(list, w, hourly){
  const C = t("con2").time, D = t("tc"), comfort = comfortT(), WARM = 25;
  if(list.length < 3) return conBox("insufficient", t("conInsufficient"), [C.need]);
  const nonReg = list.filter(m => !isRegulated(m)), vrij = nonReg.filter(m => klimaatOf(m).mode === "vrij");
  const rng = a => Math.max(...a) - Math.min(...a);
  const sd = a => { const mu = avg(a); return Math.sqrt(avg(a.map(v => (v - mu) ** 2))); };
  const roomOf = m => m.ruimte || ROOM_DEFAULT;
  // Demping per ruimte (verschillende ruimtes hebben een ander niveau; samen zouden ze een
  // nep-schommeling geven). Maat: bereik binnen ÷ bereik buiten over dezelfde metingen, na het
  // weglaten van uitschieters binnen (> 3× de mediane afwijking, min. 1 °C, van de mediaan — bijv.
  // zon of net gestookt). Gewogen gemiddelde over de ruimtes.
  const dampRooms = []; let usedVrij = true;
  [...new Set(list.map(roomOf))].forEach(r => {
    const nr = nonReg.filter(m => roomOf(m) === r), vr = nr.filter(m => klimaatOf(m).mode === "vrij");
    let b = vr.length >= 4 ? vr : nr.length >= 4 ? nr : null; if(!b) return;
    if(b !== vr) usedVrij = false;
    const med = median(b.map(m => m.binnen)), mad = median(b.map(m => Math.abs(m.binnen - med)));
    const clean = b.filter(m => Math.abs(m.binnen - med) <= Math.max(1, 3 * mad * 1.4826));
    if(clean.length >= 4) b = clean;
    const ro = rng(b.map(m => m.buiten)), ri = rng(b.map(m => m.binnen));
    dampRooms.push({ r, n: b.length, ro, ri, ratio: ro >= 4 ? ri / ro : null });
  });
  dampRooms.sort((a, b) => b.n - a.n);
  const main = dampRooms[0] || null, valid = dampRooms.filter(d => d.ratio !== null && d.ro >= 4);
  const hourlyIn = hourly ? hourly.filter(h => h.ts >= w.start && h.ts <= w.end) : [];
  const multiRoom = new Set(list.map(roomOf)).size > 1;
  const facts = [[C.fAvgIn, fmtT(avg(list.map(m => m.binnen)))], [C.fAvgOut, fmtT(avg(list.map(m => m.buiten)))], [C.fDiff, fmtDelta(avg(list.map(m => m.binnen - m.buiten)))]];
  if(main) facts.push([C.fSwing + (multiRoom ? ` (${main.r})` : ""), `${fmtT(main.ri)} / ${fmtT(main.ro)}`]);
  const paras = []; let status = "info", head = C.head_info;
  if(valid.length){
    const ratio = valid.reduce((acc, d) => acc + d.ratio * d.n, 0) / valid.reduce((acc, d) => acc + d.n, 0);
    status = ratio <= 0.25 ? "good" : ratio <= 0.5 ? "neutral" : "bad"; head = C["head_" + status];
    const d0 = valid[0];
    paras.push(C.body(fmtT(d0.ro), fmtT(d0.ri), Math.round(ratio * 100), (usedVrij ? C.basisVrij : "") + (valid.length > 1 ? ` — ${valid.map(d => `${d.r} ${Math.round(d.ratio * 100)}%`).join(", ")}` : multiRoom ? ` — ${d0.r}` : "")));
    facts.push([D.fRatio, Math.round(ratio * 100) + "%"]);
  } else paras.push(C.smallOut(fmtT(main ? main.ro : rng(list.map(m => m.buiten)))));
  const secs = [], needs = [];
  const sec = (title, items) => { const it = items.filter(Boolean); if(it.length) secs.push(`<div class="con-sec"><div class="con-sec-h">${escapeHtml(title)}</div>${it.map(x => x.startsWith("<") ? x : `<p>${escapeHtml(x)}</p>`).join("")}</div>`); };

  // 1. Demping en vertraging
  const damp = [];
  if(hourlyIn.length >= 6){ const hv = hourlyIn.map(h => h.v); damp.push(D.dampHourly(fmtT(rng(hv)), fmtT(Math.min(...hv)), fmtT(Math.max(...hv)))); }
  if(hourly && hourly.length >= 24){
    const cand = nonReg.filter(m => hourlyAt(hourly, tsOf(m) - 12*HOUR) !== null);
    if(cand.length >= 8){
      let best = null;
      const rm = {}; [...new Set(cand.map(roomOf))].forEach(r => { rm[r] = avg(cand.filter(m => roomOf(m) === r).map(m => m.binnen)); });
      const yv = cand.map(m => m.binnen - rm[roomOf(m)]);      // per ruimte gecentreerd
      for(let L = 0; L <= 12; L++){ const r = pearson(cand.map(m => hourlyAt(hourly, tsOf(m) - L*HOUR)), yv); if(r !== null && (!best || r > best.r)) best = { L, r }; }
      if(best && best.r >= 0.5){ damp.push(D.lag(best.L, best.r.toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { maximumFractionDigits: 2 }))); facts.push([D.fLag, `~${best.L} u`]); }
      else if(best) damp.push(D.lagWeak(best.r.toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { maximumFractionDigits: 2 })));
    }
  } else needs.push(!state.settings.locatie ? D.needLoc : w.end - w.start > 7.5 * DAY ? D.needZoom : "");
  sec(D.sDamp, damp);

  // Paren opeenvolgende metingen per ruimte
  const byRoom = {}; list.forEach(m => { const r = m.ruimte || ROOM_DEFAULT; (byRoom[r] = byRoom[r] || []).push(m); });
  const pairs = []; Object.values(byRoom).forEach(arr => { for(let i = 1; i < arr.length; i++) pairs.push([arr[i-1], arr[i]]); });
  const outBetween = (a, b) => { const ta = tsOf(a), tb = tsOf(b); if(hourly && hourlyAt(hourly, ta) !== null && hourlyAt(hourly, tb) !== null){ const v = [hourlyAt(hourly, ta)].concat(hourly.filter(h => h.ts > ta && h.ts < tb).map(h => h.v), [hourlyAt(hourly, tb)]); return avg(v); } return (a.buiten + b.buiten) / 2; };

  // 2. Afkoelen en opwarmen
  const cool = [], heat = [];
  pairs.forEach(([a, b]) => {
    const dtH = (tsOf(b) - tsOf(a)) / HOUR, ma = klimaatOf(a).mode, mb = klimaatOf(b).mode;
    if(ma === "vrij" && mb === "vrij" && dtH >= 1 && dtH <= 16 && a.binnen - b.binnen >= 0.2){
      const To = outBetween(a, b), d0 = a.binnen - To, d1 = b.binnen - To;
      if(d0 >= 3 && d1 > 0.5){ const tau = dtH / Math.log(d0 / d1); if(tau > 5 && tau < 2000) cool.push({ rate: (a.binnen - b.binnen) / dtH, tau }); }
    }
    if(mb === "verwarmen" && dtH >= 0.25 && dtH <= 12 && b.binnen - a.binnen >= 0.2) heat.push((b.binnen - a.binnen) / dtH);
  });
  const coolItems = [];
  if(cool.length){
    const taus = cool.map(c => c.tau).sort((x, y) => x - y), mt = median(taus);
    coolItems.push(D.coolPairs(cool.length, fmtRate(median(cool.map(c => c.rate))), hoursTxt(mt), hoursTxt(taus[0]), hoursTxt(taus[taus.length-1])), D.coolNight(fmtT(10 * (1 - Math.exp(-8 / mt)))));
    facts.push([D.fCoolRate, fmtRate(median(cool.map(c => c.rate)))], [D.fTau, "~" + hoursTxt(mt)]);
  } else { coolItems.push(D.coolNone); needs.push(D.needNight); }
  if(heat.length){ coolItems.push(D.heatPairs(heat.length, fmtRate(median(heat)))); facts.push([D.fHeatRate, fmtRate(median(heat))]); }
  else if(list.some(m => klimaatOf(m).mode === "verwarmen")) needs.push(D.needHeat);
  sec(D.sCool, coolItems);

  // 3. Comfort (tijdgewogen)
  let cov = 0, below = 0, above = 0;
  const part = (va, vb, dt, thr, under) => { const lo = Math.min(va, vb), hi = Math.max(va, vb); if(under){ if(hi < thr) return dt; if(lo >= thr) return 0; return dt * (thr - lo) / (hi - lo); } if(lo > thr) return dt; if(hi <= thr) return 0; return dt * (hi - thr) / (hi - lo); };
  pairs.forEach(([a, b]) => { const dt = (tsOf(b) - tsOf(a)) / HOUR; if(dt <= 0 || dt > 12) return; cov += dt; below += part(a.binnen, b.binnen, dt, comfort, true); above += part(a.binnen, b.binnen, dt, WARM, false); });
  const lo = list.reduce((x, m) => m.binnen < x.binnen ? m : x), hi = list.reduce((x, m) => m.binnen > x.binnen ? m : x);
  const diffs = list.map(m => m.binnen - m.buiten);
  const cold = list.filter(m => m.binnen < comfort - 0.05).length;
  const comfortItems = [cold ? C.cold(cold, list.length, fmtT(comfort, 0)) : C.allComfort(fmtT(comfort, 0))];
  if(cov >= 2){ const r1 = v => Math.round(v * 10) / 10; comfortItems.push(D.comfortHours(Math.round(cov), r1(below).toLocaleString(state.lang==="en"?"en-GB":"nl-NL"), Math.round(below / cov * 100), fmtT(comfort, 0), r1(above).toLocaleString(state.lang==="en"?"en-GB":"nl-NL"), Math.round(above / cov * 100), fmtT(WARM, 0), Object.keys(byRoom).length)); facts.push([D.fBelow, `${Math.round(below / cov * 100)}%`]); }
  comfortItems.push(D.minMax(fmtT(lo.binnen), whenTxt(lo), fmtT(hi.binnen), whenTxt(hi)), D.diffRange(fmtDelta(avg(diffs)), fmtDelta(Math.min(...diffs)), fmtDelta(Math.max(...diffs))));
  sec(D.sComfort, comfortItems);

  // 4. Dagverloop
  const dps = DAGDELEN.map(k => { const a = list.filter(m => dagdeelOf(m.tijd) === k); return a.length ? { k, bin: avg(a.map(m => m.binnen)), bu: avg(a.map(m => m.buiten)), n: a.length } : null; }).filter(Boolean);
  if(dps.length >= 2){
    const sw = Math.max(...dps.map(d => d.bin)) - Math.min(...dps.map(d => d.bin)), swo = Math.max(...dps.map(d => d.bu)) - Math.min(...dps.map(d => d.bu));
    sec(D.sDay, [D.day(dps.map(d => `${dpLabel(d.k).toLowerCase()} ${fmtT(d.bin)} (buiten ${fmtT(d.bu)})`).join(" · "), fmtT(sw), fmtT(swo))]);
  } else if(cfOf("time").dp === "all") sec(D.sDay, [D.dayNeed]);

  // 5. Trend
  const spanD = (tsOf(list[list.length-1]) - tsOf(list[0])) / DAY;
  if(spanD >= 1.5 && list.length >= 6){
    const t0 = tsOf(list[0]), X = list.map(m => (tsOf(m) - t0) / DAY);
    const sl = ys => { const r = linReg(X.map((x, i) => ({ x, y: ys[i] }))); return r ? r.b : 0; };
    const bi = sl(list.map(m => m.binnen)), bo = sl(list.map(m => m.buiten)), bd = sl(diffs);
    const fd = v => Math.abs(v) < 0.05 ? fmtT(0) : fmtDelta(v);
    const items = [D.trend(fd(bi), fd(bo), fd(bd))];
    if(bo < -0.2 && bi > bo / 2) items.push(D.trendHold); else if(bo < -0.2) items.push(D.trendFollow); else if(Math.abs(bi) < 0.1 && Math.abs(bo) < 0.2) items.push(D.trendStable);
    sec(D.sTrend, items);
  }

  // 6. Ruimtes
  const rooms = Object.entries(byRoom).filter(([, a]) => a.length >= 2).map(([r, a]) => ({ r, avg: avg(a.map(m => m.binnen)), a })).sort((x, y) => y.avg - x.avg);
  if(rooms.length >= 2){
    const items = [D.rooms(rooms.map(x => `${x.r} ${fmtT(x.avg)}`).join(" · "))];
    const ref = rooms[0];
    rooms.slice(1).forEach(o => {
      const d = []; o.a.forEach(m => { const near = ref.a.reduce((best, x) => { const dt = Math.abs(tsOf(x) - tsOf(m)); return dt <= HOUR && (!best || dt < best.dt) ? { x, dt } : best; }, null); if(near) d.push(m.binnen - near.x.binnen); });
      if(d.length >= 2){ const md = avg(d); items.push(D.roomsPair(o.r, ref.r, `${fmtT(Math.abs(md))} ${md < 0 ? D.colder : D.warmer}`, d.length)); }
      else needs.push(D.needRooms);
    });
    sec(D.sRooms, items);
  }

  // 7. Klimaatgebruik
  const cnt = md => list.filter(m => klimaatOf(m).mode === md).length;
  sec(D.sKlim, [D.klim(cnt("vrij"), cnt("verwarmen"), cnt("koelen"), list.length - nonReg.length)]);

  // 8. Uitschieters t.o.v. de trendlijn (alles uit) van dezelfde ruimte
  const odd = [];
  Object.keys(byRoom).forEach(room => {
    const f = houseFit(state.metingen.filter(m => (m.ruimte || ROOM_DEFAULT) === room), "nu", "vrij");
    if(!f.r || !f.vrijOnly) return;
    const thr = Math.max(1.0, 2.5 * f.r.sres);
    byRoom[room].filter(m => klimaatOf(m).mode === "vrij").forEach(m => { const e = m.binnen - (f.r.a + f.r.b * m.buiten); if(Math.abs(e) >= thr) odd.push({ m, e }); });
  });
  odd.sort((x, y) => Math.abs(y.e) - Math.abs(x.e));
  if(odd.length) sec(D.sOdd, [`<ul>${odd.slice(0, 4).map(o => `<li>${escapeHtml((o.e > 0 ? D.oddWarm : D.oddCold)(whenTxt(o.m), fmtT(o.m.binnen), fmtT(Math.abs(o.e))))}</li>`).join("")}</ul>`]);
  else if(Object.keys(byRoom).some(r => houseFit(state.metingen.filter(m => (m.ruimte || ROOM_DEFAULT) === r), "nu", "vrij").r)) sec(D.sOdd, [D.oddNone]);

  const nd = [...new Set(needs.filter(Boolean))];
  if(nd.length) sec(D.sNeed, [`<ul>${nd.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`]);

  const conf = { level: list.length >= 20 && spanD >= 3 ? "high" : list.length >= 8 ? "medium" : "low" };
  const box = conBox(status, head, paras, facts, conf);
  const more = secs.length ? `<details class="con-more" data-conmore="time" ${conMoreOpen.time ? "open" : ""}><summary>${escapeHtml(D.more(secs.length))}</summary>${secs.join("")}</details>` : "";
  return box.replace(/<\/div>$/, more + "</div>");
}

/* ================= DETAILS PER CONCLUSIE =================
   Elke grafiek krijgt onder het oordeel een inklapbaar blok "Alle details" met dezelfde opbouw als
   het temperatuurverloop. Alles wordt berekend uit de metingen die de grafiek op dat moment toont
   (periode, ruimte, dagdeel, klimaat), dus het beweegt mee met de filters. */
function secHTML(title, items){ const it = (items || []).filter(Boolean); return it.length ? `<div class="con-sec"><div class="con-sec-h">${escapeHtml(title)}</div>${it.map(x => x.startsWith("<") ? x : `<p>${escapeHtml(x)}</p>`).join("")}</div>` : ""; }
function listHTML(items){ return items.length ? `<ul>${items.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""; }
function moreHTML(key, secs, needs){
  const nd = [...new Set((needs || []).filter(Boolean))];
  const all = secs.filter(Boolean).concat(nd.length ? [secHTML(t("dc").need, [listHTML(nd)])] : []);
  return all.length ? `<details class="con-more" data-conmore="${key}" ${conMoreOpen[key] !== false ? "open" : ""}><summary>${escapeHtml(t("tc").more(all.length))}</summary>${all.join("")}</details>` : "";
}
function attachMore(box, more){ return more ? box.replace(/<\/div>$/, more + "</div>") : box; }
function rTxt(r){ return r.toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { maximumFractionDigits: 2 }); }
function num2(v){ return v.toLocaleString(state.lang === "en" ? "en-GB" : "nl-NL", { maximumFractionDigits: 2, minimumFractionDigits: 2 }); }
function r2Of(r, pts){ const my = avg(pts.map(p => p.y)), sst = pts.reduce((a, p) => a + (p.y - my) ** 2, 0); const sse = pts.reduce((a, p) => a + (p.y - (r.a + r.b * p.x)) ** 2, 0); return sst > 1e-9 ? Math.max(0, 1 - sse / sst) : 0; }
/* τ uit paren opeenvolgende metingen met alles uit (zelfde ruimte), zoals bij het temperatuurverloop. */
function pairTaus(list){
  const by = {}; sortedMetingen(list).forEach(m => { const r = m.ruimte || ROOM_DEFAULT; (by[r] = by[r] || []).push(m); });
  const out = [];
  Object.values(by).forEach(arr => { for(let i = 1; i < arr.length; i++){ const a = arr[i-1], b = arr[i], dtH = (tsOf(b) - tsOf(a)) / HOUR;
    if(klimaatOf(a).mode !== "vrij" || klimaatOf(b).mode !== "vrij" || dtH < 1 || dtH > 16 || a.binnen - b.binnen < 0.2) continue;
    const To = (a.buiten + b.buiten) / 2, d0 = a.binnen - To, d1 = b.binnen - To;
    if(d0 >= 3 && d1 > 0.5){ const tau = dtH / Math.log(d0 / d1); if(tau > 5 && tau < 2000) out.push(tau); } } });
  return out;
}

/* --- Binnen t.o.v. buiten --- */
function fitDetailsHTML(f, listAll, basis){
  if(!f.r) return moreHTML("scatter", [], f.status === "insufficient" ? [t("dc").fit.needMore] : []);
  const D = t("dc").fit, r = f.r, secs = [], needs = [];
  const pts = f.use.map(p => ({ x: xOf(p, basis), y: p.binnen })), r2 = r2Of(r, pts);
  const resid = f.use.map(p => p.binnen - (r.a + r.b * xOf(p, basis))), sres = Math.sqrt(avg(resid.map(e => e * e)));
  secs.push(secHTML(D.sTrend, [D.trend(fmtT(r.a), num2(r.b), f.vrijOnly ? D.srcVrij : D.srcAll, r.n, fmtT(r.minX), fmtT(r.maxX)), D.fitQ(Math.round(r2 * 100), fmtT(sres)), r2 < 0.4 ? D.fitQLow : ""]));
  const xs = [0, 5, 10, 15, 20].filter(x => x >= r.minX - 8 && x <= r.maxX + 8);
  secs.push(secHTML(D.sPred, [D.preds(xs.map(x => `${fmtT(x, 0)} → ${fmtT(r.a + r.b * x)} ± ${fmtT(Math.max(MEAS_UNCERTAINTY, 2 * predSE(r, x)))}${x < r.minX - 2 || x > r.maxX + 2 ? D.extrap : ""}`).join(" · "))]));
  if(f.grens !== undefined){
    const se = Math.max(MEAS_UNCERTAINTY, r.sres) / Math.abs(r.b) * Math.sqrt(1 / r.n + (f.grens - r.mx) ** 2 / r.sxx);
    secs.push(secHTML(D.sGrens, [D.grensRange(fmtT(f.grens, 0), fmtT(f.grens - 2 * se, 0), fmtT(f.grens + 2 * se, 0)), f.grensExtrap ? D.grensFar : ""]));
    if(f.grens < r.minX - 1) needs.push(D.needCold);
  } else secs.push(secHTML(D.sGrens, [D.grensNone(fmtT(f.comfort, 0))]));
  // per dagdeel / per ruimte (alleen als dat filter op "Alle" staat)
  const groupRows = (keys, keyOf, label) => { const rows = [], ok = [];
    keys.forEach(k => { const g = houseFit(listAll.filter(m => keyOf(m) === k), basis); if(g.r){ rows.push(D.row(label(k), fmtT(g.pred), g.grens !== undefined ? fmtT(g.grens, 0) : "", g.n)); ok.push({ k, g }); } else if(g.n) rows.push(D.rowNeed(label(k), g.n)); });
    if(ok.length >= 2){ ok.sort((a, b) => b.g.pred - a.g.pred); rows.push(D.warmest(label(ok[0].k), label(ok[ok.length-1].k), fmtT(ok[0].g.pred - ok[ok.length-1].g.pred))); }
    return rows; };
  if(cfOf("scatter").dp === "all"){ const rows = groupRows(DAGDELEN, m => dagdeelOf(m.tijd), dpLabel); if(rows.length) secs.push(secHTML(D.sDp, [listHTML(rows)])); }
  const rooms = [...new Set(listAll.map(m => m.ruimte || ROOM_DEFAULT))];
  if(cfOf("scatter").rf === "all" && rooms.length > 1){ const rows = groupRows(rooms, m => m.ruimte || ROOM_DEFAULT, x => x); if(rows.length) secs.push(secHTML(D.sRooms, [listHTML(rows)])); }
  // nu vs 24 u
  const both = f.use.filter(has24);
  if(both.length >= 4){
    const rn = linReg(both.map(p => ({ x: p.buiten, y: p.binnen }))), r24 = linReg(both.map(p => ({ x: p.buiten24, y: p.binnen })));
    if(rn && r24){ const a = r2Of(rn, both.map(p => ({ x: p.buiten, y: p.binnen }))), b = r2Of(r24, both.map(p => ({ x: p.buiten24, y: p.binnen })));
      secs.push(secHTML(D.sBasis, [D.basis(Math.round(a * 100), Math.round(b * 100), b - a > 0.1 ? D.basis24 : a - b > 0.1 ? D.basisNu : D.basisSame)])); }
  } else if(!state.settings.locatie) needs.push(D.basisNeed);
  // verwarmen t.o.v. de lijn zonder verwarming
  if(f.vrijOnly){
    const heat = listAll.filter(m => !isRegulated(m) && klimaatOf(m).mode === "verwarmen" && xOf(m, basis) !== null);
    const items = [];
    if(heat.length){ const d = avg(heat.map(m => m.binnen - (r.a + r.b * xOf(m, basis)))); items.push(D.heat(`${fmtT(Math.abs(d))} ${d >= 0 ? t("tc").warmer : t("tc").colder}`, heat.length)); }
    if(f.excluded) items.push(D.heatReg(f.excluded));
    secs.push(secHTML(D.sHeat, items));
  } else needs.push(D.needVrij);
  // uitschieters
  const thr = Math.max(1, 2.5 * Math.max(r.sres, 0.2));
  const odd = f.use.map(m => ({ m, e: m.binnen - (r.a + r.b * xOf(m, basis)) })).filter(o => Math.abs(o.e) >= thr).sort((a, b) => Math.abs(b.e) - Math.abs(a.e)).slice(0, 4);
  secs.push(secHTML(D.sOdd, [odd.length ? listHTML(odd.map(o => (o.e > 0 ? D.oddWarm : D.oddCold)(whenTxt(o.m), fmtT(o.m.binnen), fmtT(Math.abs(o.e))))) : D.oddNone]));
  if(f.conf !== "high") needs.push(D.needMore);
  return moreHTML("scatter", secs, needs);
}

/* --- Per klimaat --- */
function klimDetailsHTML(S){
  const D = t("dc").klim, secs = [], needs = [], comfort = comfortT();
  if(!S.withK.length) return moreHTML("klimaat", [secHTML(D.sGrens, [D.none])]);
  const g = [];
  if(S.stook){
    g.push(D.grensHow(fmtT(S.stook.T), S.vrij.length, S.verw.length, S.stook.err));
    const f = houseFit(S.vrij.map(x => x.m), kBasis(), "vrij");
    if(f.grens !== undefined){ g.push(D.grensFit(fmtT(f.grens, 0))); const d = S.stook.T - f.grens; g.push(d > 1 ? D.grensEarly : d < -1 ? D.grensLate : D.grensMatch); }
  } else needs.push(S.verw.length < 3 ? D.needVerw : D.needVrij);
  if(S.koelG) g.push(D.koelHow(fmtT(S.koelG.T), S.vrij.length, S.koel.length, S.koelG.err)); else if(S.koel.length < 3) needs.push(D.needKoel);
  secs.push(secHTML(D.sGrens, g));
  const sysSec = (arr, title, below) => {
    if(!arr.length) return "";
    const sps = arr.filter(x => x.k.sp !== null), withReg = arr.filter(x => x.k.reg), niet = arr.filter(x => x.k.reg === "niet");
    const items = [D.sys(arr.length, sps.length ? fmtT(avg(sps.map(x => x.k.sp))) : "—", fmtT(avg(arr.map(x => x.m.binnen))), withReg.length ? Math.round(withReg.filter(x => x.k.reg !== "niet").length / withReg.length * 100) : null)];
    if(niet.length){ const outs = niet.map(x => kx(x.m)); items.push((below ? D.verwNot : D.koelNot)(niet.length, Math.max(...outs) - Math.min(...outs) < 0.05 ? fmtT(outs[0]) : `${fmtT(Math.min(...outs))} – ${fmtT(Math.max(...outs))}`, "", fmtT(avg(niet.map(x => Math.abs(x.m.binnen - x.k.sp)))))); }
    return secHTML(title, items);
  };
  secs.push(sysSec(S.verw, D.sVerw, true), sysSec(S.koel, D.sKoel, false));
  if(S.vrij.length){ const lo = S.vrij.reduce((a, x) => kx(x.m) < kx(a.m) ? x : a); secs.push(secHTML(D.sVrij, [D.vrij(S.vrij.length, fmtT(avg(S.vrij.map(x => x.m.binnen))), S.vrij.filter(x => x.m.binnen < comfort - 0.05).length, fmtT(comfort, 0), fmtT(kx(lo.m)), fmtT(lo.m.binnen))])); }
  const known = S.withK.filter(x => ["vrij","verwarmen","koelen"].includes(x.k.mode));
  const bands = [[-99, 5, "< 5 °C"], [5, 10, "5–10 °C"], [10, 15, "10–15 °C"], [15, 20, "15–20 °C"], [20, 99, "≥ 20 °C"]].map(([lo, hi, l]) => {
    const a = known.filter(x => kx(x.m) >= lo && kx(x.m) < hi); if(!a.length) return null;
    const p = md => Math.round(a.filter(x => x.k.mode === md).length / a.length * 100);
    return D.band(l, a.length, p("vrij"), p("verwarmen"), p("koelen"));
  }).filter(Boolean);
  if(bands.length >= 2) secs.push(secHTML(D.sBands, [listHTML(bands)]));
  if(cfOf("klimaat").dp === "all"){
    const rows = DAGDELEN.map(k => { const a = known.filter(x => dagdeelOf(x.m.tijd) === k); if(!a.length) return null; const p = md => Math.round(a.filter(x => x.k.mode === md).length / a.length * 100); return D.dpRow(dpLabel(k), a.length, p("verwarmen"), p("koelen")); }).filter(Boolean);
    if(rows.length >= 2) secs.push(secHTML(D.sDp, [listHTML(rows)]));
  }
  return moreHTML("klimaat", secs, needs);
}

/* --- Afkoeltests --- */
function coolDetailsHTML(pts){
  if(!pts.length) return "";
  const D = t("dc").cool, secs = [], needs = [];
  const clean = pts.filter(p => !p.c.heated && !p.c.rough && !p.c.rise && !p.c.small), use = clean.length ? clean : pts;
  const taus = use.map(p => p.c.tau), med = median(taus), mean = avg(taus);
  const cv = taus.length > 1 ? Math.sqrt(avg(taus.map(v => (v - mean) ** 2))) / mean : 0;
  if(use.length > 1) secs.push(secHTML(D.sSpread, [D.spread(hoursTxt(mean), hoursTxt(med), hoursTxt(Math.min(...taus)), hoursTxt(Math.max(...taus)), Math.round(cv * 100)), cv > 0.35 ? D.spreadHigh : ""]));
  if(use.length >= 3){
    const t0 = coolStartTs(use[0].a), rT = linReg(use.map(p => ({ x: (coolStartTs(p.a) - t0) / (30 * DAY), y: p.c.tau })));
    if(rT && (coolStartTs(use[use.length-1].a) - t0) >= 14 * DAY) secs.push(secHTML(D.sTrend, [Math.abs(rT.b) >= 3 ? D.trend((rT.b > 0 ? "+" : "−") + hoursTxt(Math.abs(rT.b))) : D.trendFlat]));
    const withOut = use.filter(p => typeof p.c.out === "number");
    if(withOut.length >= 3){ const rr = pearson(withOut.map(p => p.c.out), withOut.map(p => p.c.tau)); if(rr !== null) secs.push(secHTML(D.sOut, [D.out(rTxt(rr), rr >= 0.5 ? D.outCold : rr <= -0.5 ? D.outWarm : D.outNone)])); }
  }
  const drop = dT => fmtT(dT * (1 - Math.exp(-8 / med)));
  secs.push(secHTML(D.sPrac, [D.prac(drop(5), drop(10), drop(15)), D.hour1(hoursTxt(-med * Math.log(1 - 1 / 10)))]));
  const rooms = [...new Set(use.map(p => p.a.ruimte || ROOM_DEFAULT))];
  const pt = pairTaus(cfApply("afkoel", state.metingen, { ts: tsOf, room: m => m.ruimte, m: () => null }));
  if(pt.length >= 3){ const mp = median(pt); secs.push(secHTML(D.sCheck, [D.check(hoursTxt(mp), pt.length), Math.abs(mp - med) / med <= 0.3 ? D.checkOk : D.checkDiff])); }
  const excl = pts.length - use.length;
  if(excl) secs.push(secHTML(D.sExcl, [D.excl(pts.filter(p => p.c.heated).length, pts.filter(p => p.c.rise).length, pts.filter(p => p.c.rough).length, pts.filter(p => p.c.small).length)]));
  if(rooms.length > 1) secs.push(secHTML(D.sRooms, [listHTML(rooms.map(rm => { const a = use.filter(p => (p.a.ruimte || ROOM_DEFAULT) === rm); return D.room(rm, a.length, hoursTxt(median(a.map(p => p.c.tau)))); }))]));
  if(use.length < 5) needs.push(D.needMore);
  if(use.some(p => typeof p.c.out === "number" && p.a.startBinnen - p.c.out < 8)) needs.push(D.needCold);
  return moreHTML("afkoel", secs, needs);
}

/* --- Per klimaat --- */
function klimConclusionHTML(S){
  const C = t("con2").klim, paras = [], facts = [];
  let status = "insufficient", head = t("conInsufficient");
  const rate = g => g <= 13 ? "good" : g <= 15.5 ? "neutral" : "bad";
  if(S.stook){ status = rate(S.stook.T); head = C["head_" + status]; paras.push(C.stook(fmtT(S.stook.T))); facts.push([C.fStook, "~" + fmtT(S.stook.T)]); }
  else {
    const f = houseFit(S.vrij.map(x => x.m), kBasis(), "vrij");
    if(f.grens !== undefined){ status = rate(f.grens); head = C["head_" + status]; paras.push(C.stookEst(fmtT(f.grens, 0))); facts.push([C.fStook, "~" + fmtT(f.grens, 0)]); }
    else paras.push(C.need);
  }
  if(S.koelG){ paras.push(C.koel(fmtT(S.koelG.T))); facts.push([C.fKoel, "~" + fmtT(S.koelG.T)]); }
  if(S.verwPct !== null){ paras.push(S.verwPct >= 70 ? C.reg(S.verwPct) : C.regBad(S.verwPct)); facts.push([C.fReg, S.verwPct + "%"]); if(S.verwPct < 70 && status === "good") status = "neutral"; }
  if(status === "insufficient" && facts.length){ status = "info"; head = C.head_info; }
  return conBox(status, head, paras, facts);
}

/* --- Koeltests --- */
function koelConclusionHTML(KT){
  const C = t("con2").koel;
  if(!KT.length) return "";
  const rate = avg(KT.map(k => k.rate)), withSp = KT.filter(k => k.reached !== null), ok = withSp.filter(k => k.reached);
  const paras = [C.body(fmtRate(rate), KT.length)], facts = [[C.fRate, fmtRate(rate)], [C.fOut, fmtT(avg(KT.map(k => k.out)))]];
  let status = "info", head = C.head_info;
  if(withSp.length){
    const p = ok.length / withSp.length; status = p >= 0.75 ? "good" : p >= 0.4 ? "neutral" : "bad"; head = C["head_" + status];
    paras.push(C.reached(ok.length, withSp.length)); facts.push([C.fReached, `${ok.length}/${withSp.length}`]);
    const nr = withSp.filter(k => !k.reached);
    if(nr.length) paras.push(C.notFrom(fmtT(Math.min(...nr.map(k => k.out)))));
  }
  if(KT.length >= 3){ const r = linReg(KT.map(k => ({ x: k.out, y: k.rate }))); if(r && r.maxX - r.minX >= 3 && r.b < 0) paras.push(C.slope(fmtRate(-r.b))); }
  return conBox(status, head, paras, facts, { level: KT.length >= 6 ? "high" : KT.length >= 3 ? "medium" : "low" });
}

/* --- Afkoeltests --- */
function coolConclusionHTML(pts){
  const C = t("con2").cool;
  if(!pts.length) return conBox("insufficient", t("conInsufficient"), [C.need]);
  const clean = pts.filter(p => !p.c.heated && !p.c.rough && !p.c.rise && !p.c.small), use = clean.length ? clean : pts;
  const taus = use.map(p => p.c.tau).sort((a, b) => a - b), med = median(taus);
  const status = med >= 70 ? "good" : med >= 35 ? "neutral" : "bad", night = 10 * (1 - Math.exp(-8 / med));
  const paras = [C.body(hoursTxt(med), use.length), C.night(fmtT(night)), C.bench];
  if(use.length >= 2) paras.push(C.spread(hoursTxt(taus[0]), hoursTxt(taus[taus.length - 1])));
  if(pts.length - use.length) paras.push(C.excluded(pts.length - use.length));
  const facts = [[C.fTau, hoursTxt(med)], [C.fNight, "~" + fmtT(night)], [C.fN, String(use.length)]];
  return conBox(status, C["head_" + status], paras, facts, { level: use.length >= 5 ? "high" : use.length >= 3 ? "medium" : "low" });
}

/* ================= KLIMAAT & COMFORT =================
   Blijft nuttig als vóór/na er niet meer toe doet. Drie invalshoeken:
   1. "Alles uit"-metingen: hoe het huis zélf presteert (verschil binnen − buiten), per maand.
   2. Verwarmen: wordt de ingestelde temperatuur gehaald (per systeem), en vanaf welke buitentemp
      wordt er gestookt (stookgrens).
   3. Koelen: vanaf welke buitentemp wordt er gekoeld (koelgrens), hoe vaak.
   De grens is de buitentemperatuur die "alles uit"-metingen en "systeem aan"-metingen het best
   van elkaar scheidt (minste verkeerd ingedeelde metingen). */
function kBasis(){ return scatterBasis(); }
function kx(m){ const v = xOf(m, kBasis()); return v === null ? m.buiten : v; }
function findGrens(offVals, onVals, onBelow){
  if(offVals.length < 3 || onVals.length < 3) return null;
  const all = offVals.concat(onVals).sort((a,b) => a-b);
  let best = null;
  for(let i = 0; i < all.length - 1; i++){
    const T = (all[i] + all[i+1]) / 2;
    const err = onBelow ? offVals.filter(v => v < T).length + onVals.filter(v => v >= T).length
                        : offVals.filter(v => v > T).length + onVals.filter(v => v <= T).length;
    if(!best || err < best.err) best = { T, err, from:T, to:T };
    else if(err === best.err){ best.to = T; }
  }
  const T = Math.round(((best.from + best.to) / 2) * 2) / 2;
  return { T, err: best.err, n: all.length };
}
function klimaatStats(list){
  const all = sortedMetingen(list || state.metingen);
  const withK = all.map(m => ({ m, k: klimaatOf(m) }));
  const vrij = withK.filter(x => x.k.mode === "vrij");
  const verw = withK.filter(x => x.k.mode === "verwarmen");
  const koel = withK.filter(x => x.k.mode === "koelen");
  const counts = {}; withK.forEach(x => { const key = x.k.mode === "gemengd" ? "onbekend" : x.k.mode; counts[key] = (counts[key]||0) + 1; });
  const stook = findGrens(vrij.map(x => kx(x.m)), verw.map(x => kx(x.m)), true);
  const koelG = findGrens(vrij.map(x => kx(x.m)), koel.map(x => kx(x.m)), false);
  const regPct = arr => { const k = arr.filter(x => x.k.reg); return k.length ? Math.round(k.filter(x => x.k.reg !== "niet").length / k.length * 100) : null; };
  return { all, withK, vrij, verw, koel, counts, stook, koelG, verwPct: regPct(verw), koelPct: regPct(koel) };
}
/* Uitleg onder de klimaatgrafiek: alleen wat er echt in de grafiek staat, plus wat er nog ontbreekt
   en wanneer dat verschijnt (in plaats van een algemene tekst over stippen die er niet zijn). */
function klimaatHowtoItems(S){
  const T = t("howtoK");
  const hasV = S.verw.length > 0, hasK = S.koel.length > 0, hasReg = S.withK.some(x => x.k.reg === "gehaald");
  const colours = [t("kStatus_vrij") + " = " + T.cVrij].concat(hasV ? [t("kStatus_verwarmen") + " = " + T.cVerw] : [], hasK ? [t("kStatus_koelen") + " = " + T.cKoel] : []);
  const items = [T.dot + " " + colours.join(", ") + "."];
  if(hasReg) items.push(T.open);
  if(S.stook) items.push(T.stook); else items.push(T.stookNeed(S.vrij.length, S.verw.length));
  if(S.koelG) items.push(T.koel); else items.push(T.koelNeed(S.vrij.length, S.koel.length));
  items.push(T.vrij);
  if(hasV) items.push(T.niet);
  if(!hasV && !hasK) items.push(T.onlyVrij);
  return items;
}
function renderKlimaatView(main){
  const S = klimaatStats();
  const nf = v => fmtT(v);
  // 1. vrij
  let vrijBody;
  if(!S.vrij.length) vrijBody = `<p class="card-note">${escapeHtml(t("kpVrijNone"))}</p>`;
  else {
    const byMonth = {};
    S.vrij.forEach(x => { const k = monthKey(x.m.datum); (byMonth[k] = byMonth[k] || []).push(x.m); });
    const rows = Object.keys(byMonth).sort().reverse().map(k => { const a = byMonth[k]; return `<tr><td>${escapeHtml(monthLabel(k))}</td><td class="num">${a.length}</td><td class="num mono">${nf(avg(a.map(kx)))}</td><td class="num mono">${nf(avg(a.map(m => m.binnen)))}</td><td class="num mono">${fmtDelta(avg(a.map(m => m.binnen - kx(m))))}</td></tr>`; }).join("");
    const warm = S.vrij.filter(x => kx(x.m) >= 22);
    let heat = "";
    if(warm.length){ const mx = warm.reduce((a,b) => b.m.binnen > a.m.binnen ? b : a); heat = `<p class="card-note" style="margin-top:10px;">${escapeHtml(t("kpHeatMax")(nf(mx.m.binnen), nf(kx(mx.m))))}</p>`; }
    vrijBody = `<div class="table-scroll"><table class="rtable ktable"><thead><tr><th>${t("kpMonth")}</th><th class="num">${t("kpN")}</th><th class="num">${t("kpAvgOut")}</th><th class="num">${t("kpAvgIn")}</th><th class="num">${t("kpAvgDelta")}</th></tr></thead><tbody>${rows}</tbody></table></div>${heat}`;
  }
  // 2. verwarmen per systeem
  let verwBody;
  if(!S.verw.length) verwBody = `<p class="card-note">${escapeHtml(t("kpNoVerw"))}</p>`;
  else {
    const rows = ["cv","airco","beide"].map(sys => {
      const a = S.verw.filter(x => x.k.sys === sys); if(!a.length) return "";
      const withReg = a.filter(x => x.k.reg), ok = withReg.filter(x => x.k.reg !== "niet"), not = withReg.filter(x => x.k.reg === "niet");
      const pct = withReg.length ? Math.round(ok.length / withReg.length * 100) + "%" : "—";
      const tekort = not.length ? fmtT(avg(not.map(x => x.k.sp - x.m.binnen))) : "—";

/* ================= KOELTESTS =================
   Automatisch herkend in "Alle metingen": een meting met alles uit (vlak vóór het aanzetten),
   gevolgd door één of meer metingen met de airco op koelen, in dezelfde ruimte, binnen 8 uur, met
   een lagere binnentemperatuur. De laatste koelmeting in die aaneengesloten reeks is het eind.
   Kengetallen: koelsnelheid (°C per uur), of de ingestelde temperatuur gehaald werd, en de
   buitentemperatuur tijdens de test. Bij dezelfde buitentemperatuur betekent een hogere
   koelsnelheid (of een lagere eindtemperatuur) dat er minder warmte het huis in lekt. */
function koelTests(){
  const dismissed = new Set(state.koeltestGenegeerd || []);
  const byRoom = {};
  sortedMetingen(state.metingen).forEach(m => { const r = (m.ruimte || "").toLowerCase(); (byRoom[r] = byRoom[r] || []).push(m); });
  const out = [];
  Object.values(byRoom).forEach(list => {
    for(let i = 0; i < list.length - 1; i++){
      const a = list[i];
      if(klimaatOf(a).mode !== "vrij") continue;
      let j = i + 1, lastJ = -1;
      while(j < list.length && klimaatOf(list[j]).mode === "koelen" && (tsOf(list[j]) - tsOf(a)) <= 8 * HOUR){ lastJ = j; j++; }
      if(lastJ < 0) continue;
      const b = list[lastJ], dtH = (tsOf(b) - tsOf(a)) / HOUR;
      if(dtH < 0.25 || b.binnen >= a.binnen) continue;
      const key = a.id + "|" + b.id;
      if(dismissed.has(key)) continue;
      const kb = klimaatOf(b), mids = lastJ - i - 1;
      const outs = list.slice(i, lastJ + 1).map(m => m.buiten);
      out.push({ key, a, b, dtH, drop: a.binnen - b.binnen, rate: (a.binnen - b.binnen) / dtH, out: avg(outs), sp: kb.sp, reached: kb.sp === null ? null : b.binnen <= kb.sp + REG_TOL, mids, phase: phaseOf(a) });
      i = lastJ;
    }
  });
  return out.sort((x, y) => tsOf(y.a) - tsOf(x.a));
}

function excelSerialToDate(n){ const ms = Math.round((n - 25569) * 86400000); const d = new Date(ms); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes()); }
function normDate(v){
  if(v === null || v === undefined || v === "") return null;
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  if(typeof v === "number" && v > 20000 && v < 80000){ const d = excelSerialToDate(v); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if(m){ const y = m[3].length === 2 ? "20"+m[3] : m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
  return null;
}
function normTime(v){
  if(v === null || v === undefined || v === "") return "";
  if(v instanceof Date && !isNaN(v)) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
  if(typeof v === "number" && v >= 0 && v < 1){ const mins = Math.round(v * 1440); return `${pad2(Math.floor(mins/60)%24)}:${pad2(mins%60)}`; }
  const m = String(v).trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? `${pad2(m[1])}:${m[2]}` : "";
}
function detectColumns(header){
  const h = header.map(x => String(x || "").toLowerCase().trim());
  const find = re => h.findIndex(x => re.test(x));
  return {
    datum: find(/datum|date|dag/),
    tijd: find(/tijd|time|uur/),
    buiten: find(/buiten|outdoor|outside|buitentemp/),
    binnen: (() => { const i = find(/binnen|indoor|inside|woonkamer|kamer|living/); return i >= 0 ? i : h.findIndex((x,idx) => /temp/.test(x) && !/buiten|outdoor|outside/.test(x) && idx !== find(/buiten|outdoor|outside/)); })(),
    ruimte: find(/ruimte|room|locatie/),
    notitie: find(/notitie|note|opmerking/),
    verwarming: find(/verwarming|heating/),
    cv: find(/^cv|ketel|boiler/),
    airco: find(/airco|\bac\b|warmtepomp/),
  };
}
function ruimteFromHeader(label){ const m = String(label||"").match(/temp(?:eratuur)?\s+(.+)/i); if(m && !/binnen|indoor|inside/i.test(m[1])) return m[1].trim().charAt(0).toUpperCase() + m[1].trim().slice(1); return null; }
function importRows(rows){
  let hi = rows.findIndex(r => r && r.some(c => /datum|date/i.test(String(c||""))));
  if(hi < 0) hi = 0;
  const cols = detectColumns(rows[hi] || []);
  if(cols.binnen < 0 || cols.buiten < 0 || cols.datum < 0) throw new Error(t("importNoCols"));
  const defRuimte = ruimteFromHeader(rows[hi][cols.binnen]) || state.settings.defaultRuimte;
  const existing = new Set(state.metingen.map(m => `${m.datum}|${m.tijd}|${(m.ruimte||"").toLowerCase()}`));
  let added = 0, dup = 0, empty = 0;
  rows.slice(hi+1).forEach(r => {
    if(!r || r.every(c => c === null || c === undefined || c === "")) return;
    const datum = normDate(r[cols.datum]);
    const binnen = parseNum(r[cols.binnen]), buiten = parseNum(r[cols.buiten]);
    if(!datum || binnen === null || buiten === null){ empty++; return; }
    const tijd = cols.tijd >= 0 ? normTime(r[cols.tijd]) : "";
    const ruimte = ensureRuimte((cols.ruimte >= 0 && r[cols.ruimte]) ? String(r[cols.ruimte]).trim() : defRuimte);
    const key = `${datum}|${tijd}|${ruimte.toLowerCase()}`;
    if(existing.has(key)){ dup++; return; }
    existing.add(key);
    const vw = cols.verwarming >= 0 ? String(r[cols.verwarming]||"").toLowerCase() : "";
    state.metingen.push({ id:newId(), datum, tijd, binnen, buiten, ruimte,
      verwarming: /aan|on|ja|yes|1/.test(vw) ? "aan" : /uit|off|nee|no|0/.test(vw) ? "uit" : "",
      cv: (() => { if(cols.cv < 0) return ""; const x = String(r[cols.cv]||"").toLowerCase(); return /aan|on|ja|yes|1/.test(x) ? "aan" : /uit|off|nee|no|0/.test(x) ? "uit" : ""; })(),
      airco: (() => { if(cols.airco < 0) return ""; const x = String(r[cols.airco]||"").toLowerCase(); return /koel|cool/.test(x) ? "koelen" : /verw|heat|warm/.test(x) ? "verwarmen" : /uit|off|nee|no|0/.test(x) ? "uit" : ""; })(),
      cvTemp: null, aircoTemp: null,
      notitie: cols.notitie >= 0 ? String(r[cols.notitie]||"").trim() : "" });
    added++;
  });
  return { added, dup, empty };
}
function parseCsv(text){
  const first = text.split(/\r?\n/)[0] || "";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function handleImportFile(file){
  const name = file.name.toLowerCase();
  try{
    if(name.endsWith(".json")){
      const data = JSON.parse(await file.text());
      if(!data || !Array.isArray(data.metingen)) throw new Error("geen Tembo-back-up");
      if(!confirm(t("importBackupConfirm"))) return;
      const lang = state.lang, dark = state.darkMode;
      state = data; migrateState(); state.lang = lang; state.darkMode = dark;
      lastImportMsg = escapeHtml(t("importBackupOk"));
    } else {
      let rows;
      if(name.endsWith(".csv")) rows = parseCsv(await file.text());
      else {
        if(typeof XLSX === "undefined") throw new Error(t("xlsxMissing"));
        const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:null });
      }
      const r = importRows(rows);
      lastImportMsg = escapeHtml(t("importResult")(r.added, r.dup, r.empty));
    }
    migrateState();
    scheduleAutoSave();
    backfillOnline();
  }catch(err){
    lastImportMsg = `<span style="color:var(--debit)">${escapeHtml(t("importFail") + (err.message || err))}</span>`;
  }
  state.activeView = { type:"import" };
  renderAll();
}

/* ================= BUITENTEMPERATUUR ONLINE (Open-Meteo) =================
   Geen achtergrondtaak en geen 92 dagen vooruit ophalen: alleen de buitentemperatuur voor het uur
   van de meting die je op dat moment invoert. Recente datums via de forecast-API (die ook de
   afgelopen weken bevat), oudere datums via de archief-API. Tussen twee hele uren wordt lineair
   geïnterpoleerd (bijv. 13:10 → 5/6 van 13:00 + 1/6 van 14:00). */
let formBuitenMode = "eigen", formBuitenFetched = null, fetchSeq = 0, formModeTouched = false;
const weatherCache = {};
function addDaysISO(iso, n){ const [y,m,d] = iso.split("-").map(Number); const dt = new Date(y, m-1, d + n); return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function daysBetween(a, b){ const pa = a.split("-").map(Number), pb = b.split("-").map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000); }
async function fetchHourly(loc, datum){
  const key = `${loc.lat.toFixed(3)},${loc.lon.toFixed(3)},${datum}`;
  if(weatherCache[key]) return weatherCache[key];
  const pr = fetchHourlyUncached(loc, datum).then(m => { weatherResolved[key] = m; return m; }).catch(err => { delete weatherCache[key]; throw err; });
  weatherCache[key] = pr;   // lopende aanvraag delen i.p.v. dezelfde dag twee keer op te halen
  return pr;
}
async function fetchHourlyUncached(loc, datum){
  const ago = daysBetween(datum, todayISO());
  if(ago < -14) throw new Error("te ver in de toekomst");
  const base = ago > 60 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  // Afgerond op 2 decimalen (~1 km): ruim nauwkeurig voor een weermodel met ~2 km-raster, en je
  // exacte adres gaat zo nooit naar Open-Meteo.
  const url = `${base}?latitude=${loc.lat.toFixed(2)}&longitude=${loc.lon.toFixed(2)}&hourly=temperature_2m&timezone=auto&start_date=${datum}&end_date=${addDaysISO(datum, 1)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if(!data.hourly || !Array.isArray(data.hourly.time)) throw new Error("onverwacht antwoord");
  const map = {};
  data.hourly.time.forEach((tm, i) => { const v = data.hourly.temperature_2m[i]; if(v !== null && v !== undefined) map[tm] = v; });
  return map;
}
async function fetchOutdoorTemp(loc, datum, tijd){
  const [h, mi] = (tijd || "12:00").split(":").map(Number);
  const map = await fetchHourly(loc, datum);
  const k0 = `${datum}T${pad2(h)}:00`;
  const k1 = h === 23 ? `${addDaysISO(datum,1)}T00:00` : `${datum}T${pad2(h+1)}:00`;
  const v0 = map[k0], v1 = map[k1], f = (mi || 0) / 60;
  if(v0 === undefined) return null;
  const v = (v1 === undefined || f === 0) ? v0 : v0 + (v1 - v0) * f;
  return Math.round(v * 10) / 10;
}
function setSrcHint(text, cls){ const el = document.getElementById("fBuitenSrc"); if(el){ el.textContent = text || ""; el.className = "src-hint" + (cls ? " " + cls : ""); } }
function setBuitenMode(mode, userClick){
  const fB = document.getElementById("fBuiten");
  if(!fB) return;
  if(!state.settings.locatie) mode = "eigen";
  const prev = formBuitenMode;
  formBuitenMode = mode;
  document.querySelectorAll(".src-choice button").forEach(b => { b.classList.toggle("on", b.dataset.src === mode); b.setAttribute("aria-checked", b.dataset.src === mode ? "true" : "false"); });
  fB.readOnly = mode === "online";
  if(mode === "eigen"){
    // Overstappen van Online naar Eigen: veld leegmaken zodat je niet per ongeluk de online waarde bewaart.
    if(userClick && prev === "online"){ fB.value = ""; fB.focus(); }
    if(!state.settings.locatie){ setSrcHint(state.settings.autoBuiten ? t("srcNoLoc") : ""); }
    else setSrcHint(t("srcOwnHint")(formBuitenFetched === null ? null : fmtT(formBuitenFetched)));
  }
  autoFillBuiten();
}
async function autoFillBuiten(){
  const fB = document.getElementById("fBuiten");
  const loc = state.settings.locatie;
  if(!fB || !loc) return;
  const datum = document.getElementById("fDatum").value, tijd = document.getElementById("fTijd").value;
  if(!validISODate(datum)) return;
  const seq = ++fetchSeq;
  // Ook bij "Eigen meting" halen we de online waarde op (en bewaren die mee), zodat je later je
  // eigen thermometer met het weermodel kunt vergelijken.
  if(formBuitenMode === "online"){ fB.value = ""; setSrcHint(t("srcFetching")); }
  try{
    const v = await fetchOutdoorTemp(loc, datum, tijd);
    if(seq !== fetchSeq || !document.getElementById("fBuiten")) return;
    formBuitenFetched = v;
    if(formBuitenMode === "online"){
      if(v === null){ setBuitenMode("eigen", true); setSrcHint(t("srcFail"), "err"); return; }
      document.getElementById("fBuiten").value = String(v).replace(".", state.lang === "en" ? "." : ",");
      setSrcHint(t("srcOnline")(fmtT(v), loc.naam.split(",").pop().trim()), "online");
    } else {
      if(v === null) setSrcHint(t("srcFail"), "err");
      else setSrcHint(t("srcOwnHint")(fmtT(v)));
    }
  }catch(err){
    if(seq !== fetchSeq) return;
    console.warn("Buitentemperatuur ophalen mislukt:", err);
    formBuitenFetched = null;
    if(formBuitenMode === "online"){ setSrcHint(t("srcFail"), "err"); setBuitenMode("eigen", true); setSrcHint(t("srcFail"), "err"); }
  }
}
/* Locatie zoeken: PDOK Locatieserver (Nederlandse overheid: adressen, postcodes met huisnummer,
   straten, wijken, buurten, plaatsen) en Open-Meteo/GeoNames (plaatsen wereldwijd) tegelijk.
   PDOK-resultaten eerst. Faalt één van de twee, dan tonen we gewoon de andere. */
async function searchLocations(q){
  const pdok = fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${encodeURIComponent(q)}&rows=6&fl=weergavenaam,centroide_ll,type`)
    .then(r => r.json())
    .then(d => ((d && d.response && d.response.docs) || []).map(doc => {
      const m = /POINT\(([-\d.]+) ([-\d.]+)\)/.exec(doc.centroide_ll || "");
      if(!m) return null;
      return { bron: pdokTypeLabel(doc.type), label: doc.weergavenaam, naam: doc.weergavenaam, lat: Number(m[2]), lon: Number(m[1]) };
    }).filter(Boolean))
    .catch(() => []);
  const om = fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=4&language=${state.lang}&format=json`)
    .then(r => r.json())
    .then(d => ((d && d.results) || []).map(r => ({ bron: t("locSrcPlace"), label: [r.name, r.admin2 && r.admin2 !== r.name ? r.admin2 : null, r.admin1, r.country_code].filter(Boolean).join(", "), naam: r.name, lat: r.latitude, lon: r.longitude })))
    .catch(() => []);
  const [a, b] = await Promise.all([pdok, om]);
  // Dubbele plaatsen (zelfde naam, binnen ~2 km) uit Open-Meteo weglaten als PDOK ze al heeft.
  const extra = b.filter(x => !a.some(y => Math.abs(y.lat - x.lat) < 0.02 && Math.abs(y.lon - x.lon) < 0.03 && y.label.toLowerCase().includes(x.naam.toLowerCase())));
  return a.concat(extra);
}
function pdokTypeLabel(type){
  const nl = { adres:"Adres", postcode:"Postcode", weg:"Straat", woonplaats:"Plaats", buurt:"Buurt", wijk:"Wijk", gemeente:"Gemeente", provincie:"Provincie" };
  const en = { adres:"Address", postcode:"Postcode", weg:"Street", woonplaats:"Town", buurt:"Neighbourhood", wijk:"District", gemeente:"Municipality", provincie:"Province" };
  return ((state.lang === "en" ? en : nl)[type]) || type || "";
}
function wireLocationSettings(){
  const setLoc = loc => {
    state.settings.locatie = loc; formModeTouched = false;
    state.metingen.forEach(m => { delete m.buiten24; });
    state.afkoeltests.forEach(a => { if(a.buitenGemBron !== "handmatig"){ a.buitenGem = null; a.buitenGemBron = null; delete a.buitenUur; } });
    scheduleAutoSave(); renderAll(); backfillOnline();
  };
  const results = document.getElementById("locResults");
  document.getElementById("locSearchBtn").onclick = async () => {
    const q = document.getElementById("locQuery").value.trim();
    if(q.length < 2) return;
    results.innerHTML = `<span class="none">${t("checking")}</span>`;
    const list = await searchLocations(q);
    if(!list.length){ results.innerHTML = `<span class="none">${escapeHtml(t("setLocNoResults"))}</span>`; return; }
    results.innerHTML = list.map((r, i) => `<button data-i="${i}"><span class="loc-src">${escapeHtml(r.bron)}</span>${escapeHtml(r.label)}</button>`).join("");
    results.querySelectorAll("button").forEach(b => b.onclick = () => { const r = list[Number(b.dataset.i)]; setLoc({ naam: r.naam, lat: r.lat, lon: r.lon }); });
  };
  document.getElementById("locGpsBtn").onclick = () => {
    if(!navigator.geolocation){ results.innerHTML = `<span class="none">—</span>`; return; }
    navigator.geolocation.getCurrentPosition(
      pos => setLoc({ naam: t("setLocGpsName"), lat: Math.round(pos.coords.latitude*1000)/1000, lon: Math.round(pos.coords.longitude*1000)/1000 }),
      err => { results.innerHTML = `<span class="none">${escapeHtml(err.message)}</span>`; },
      { timeout: 10000 });
  };
  const clr = document.getElementById("locClearBtn");
  if(clr) clr.onclick = () => setLoc(null);
  document.getElementById("setAuto").onchange = e => { state.settings.autoBuiten = e.target.checked; formModeTouched = false; scheduleAutoSave(); renderAll(); };
}


/* ================= 24-UURSGEMIDDELDE BUITEN & ONLINE BIJVULLEN =================
   Binnen reageert traag op buiten (muren en vloeren houden warmte vast). Daarom bewaart Tembo per
   meting ook de gemiddelde buitentemperatuur van de 24 uur vóór de meting (`buiten24`). Alleen voor
   metingen die je hebt — er wordt niets "op voorraad" opgehaald. */
function keyToTs(k){ const [d, hm] = k.split("T"); const [y,mo,da] = d.split("-").map(Number); const [h,mi] = hm.split(":").map(Number); return new Date(y, mo-1, da, h, mi).getTime(); }
function tsToISO(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function tsFrom(datum, tijd){ const [y,mo,d] = datum.split("-").map(Number); const [h,mi] = (tijd || "12:00").split(":").map(Number); return new Date(y, mo-1, d, h||0, mi||0).getTime(); }
async function hourlyBetween(loc, fromTs, toTs){
  const days = [];
  for(let d = tsToISO(fromTs); d <= tsToISO(toTs); d = addDaysISO(d, 1)) days.push(d);
  const merged = {};
  for(const d of days){ Object.assign(merged, await fetchHourly(loc, d)); }
  return Object.keys(merged).filter(k => { const ts = keyToTs(k); return ts >= fromTs && ts <= toTs; }).map(k => merged[k]);
}
async function mean24(loc, m){
  const end = tsOf(m);
  if(end > Date.now()) return null;
  const vals = await hourlyBetween(loc, end - 24*3600000, end);
  if(vals.length < 20) return null;
  return Math.round(avg(vals) * 10) / 10;
}
async function hourlySeries(loc, fromTs, toTs){
  const days = [];
  for(let d = tsToISO(fromTs); d <= tsToISO(toTs); d = addDaysISO(d, 1)) days.push(d);
  const merged = {};
  for(const d of days){ Object.assign(merged, await fetchHourly(loc, d)); }
  return Object.keys(merged).map(k => ({ ts: keyToTs(k), v: merged[k] })).filter(x => x.ts >= fromTs && x.ts <= toTs).sort((x,y) => x.ts - y.ts);
}
async function meanBetween(loc, fromTs, toTs){
  if(toTs > Date.now()) return null;
  const vals = await hourlyBetween(loc, Math.floor(fromTs/3600000)*3600000, Math.ceil(toTs/3600000)*3600000);
  if(!vals.length) return null;
  return Math.round(avg(vals) * 10) / 10;
}
/* Datum/tijd van een meting gewijzigd: de online buitentemperatuur hoort bij het oude moment. Haal
   hem opnieuw op; stond de meting op "online", pas dan ook de buitenwaarde zelf aan. */
async function refreshOnlineFor(m){
  const loc = state.settings.locatie, stateRef = state;
  if(!loc){ if(m.buitenBron !== "online") m.buitenOnline = null; return; }
  try{
    const v = await fetchOutdoorTemp(loc, m.datum, m.tijd);
    if(state !== stateRef || !state.metingen.includes(m)) return;
    m.buitenOnline = v;
    if(m.buitenBron === "online" && v !== null) m.buiten = v;
    if(m.buitenBron === "online" && v === null) m.buitenBron = "handmatig";
    scheduleAutoSave();
    const ae = document.activeElement;
    if(!ae || !["INPUT","SELECT","TEXTAREA"].includes(ae.tagName)) renderAll({ skipProfile:true });

let backfillRunning = false, backfillAgain = false;
async function backfillOnline(){

  backfillRunning = true;
  let changed = false;
  const stateRef = state;
  try{
    for(const m of state.metingen.slice()){
      if(m.buiten24 !== undefined || !validISODate(m.datum)) continue;
      try{ const v = await mean24(loc, m); if(state !== stateRef) return; if(v !== null || tsOf(m) < Date.now() - 3*86400000){ m.buiten24 = v; changed = true; } }
      catch(err){ console.warn("24-uursgemiddelde ophalen mislukt:", err); break; }
    }

      if(typeof a.buitenGem === "number" && Array.isArray(a.buitenUur)) continue;

        if(state !== stateRef) return;
        if(ser.length){
          const inRange = ser.filter(x => x.ts >= Math.floor(coolStartTs(a)/3600000)*3600000 && x.ts <= Math.ceil(coolEndTs(a)/3600000)*3600000);
          a.buitenUur = ser; a.buitenGem = Math.round(avg((inRange.length ? inRange : ser).map(x => x.v)) * 10) / 10; a.buitenGemBron = "online"; changed = true;
        }
      }
      catch(err){ console.warn("Buitengemiddelde afkoeltest ophalen mislukt:", err); break; }
    }
  } finally {
    backfillRunning = false;
  }
  if(state !== stateRef) return;
  if(changed){
    scheduleAutoSave();

    const ae = document.activeElement;

    else { renderTabs(); renderSummary(); redrawCharts(); }

}

/* ================= AFKOELTESTS =================
   Verwarming en airco uit, binnen meten bij start (bijv. 23:00) en eind (bijv. 07:00).
   Newton-afkoeling: (T_eind − T_buiten) = (T_start − T_buiten) · e^(−Δt/τ)
   → τ = −Δt / ln((T_eind − T_buiten) / (T_start − T_buiten)).
   τ (uren) is de tijdconstante van het huis: hoe hoger, hoe trager het afkoelt en hoe beter het
   isoleert. Omdat τ gecorrigeerd is voor hoe koud het buiten was, zijn tests op verschillende
   avonden (en vóór/na isolatie) eerlijk met elkaar te vergelijken. */
function coolStartTs(a){ return tsFrom(a.startDatum, a.startTijd); }
function coolEndTs(a){ return tsFrom(a.eindDatum, a.eindTijd); }
function coolComplete(a){ return validISODate(a.startDatum) && a.startTijd && typeof a.startBinnen === "number" && validISODate(a.eindDatum) && a.eindTijd && typeof a.eindBinnen === "number" && coolEndTs(a) > coolStartTs(a); }
/* Metingen uit "Alle metingen" die binnen de test vallen: zelfde ruimte, cv én airco uit, strikt
   tussen start en eind. Die maken de curve betrouwbaarder. */
function coolRuimte(a){ return (a.ruimte || state.settings.defaultRuimte || "").toLowerCase(); }
function coolIntermediates(a){
  const s = coolStartTs(a), e = coolEndTs(a), r = coolRuimte(a);
  return sortedMetingen(state.metingen.filter(m => {
    const ts = tsOf(m);
    return ts > s + 60000 && ts < e - 60000 && (m.ruimte || "").toLowerCase() === r && klimaatOf(m).mode === "vrij";
  }));
}
/* Buitentemperatuur op elk moment tijdens de test: uurwaarden (online) lineair geïnterpoleerd, of
   een vast gemiddelde (handmatig ingevuld of geen uurwaarden beschikbaar). */
function coolOutFn(a){
  if(a.buitenGemBron !== "handmatig" && Array.isArray(a.buitenUur) && a.buitenUur.length >= 2){
    const u = a.buitenUur;
    return ts => {
      if(ts <= u[0].ts) return u[0].v;
      for(let i = 1; i < u.length; i++) if(ts <= u[i].ts){ const f = (ts - u[i-1].ts) / (u[i].ts - u[i-1].ts); return u[i-1].v + (u[i].v - u[i-1].v) * f; }
      return u[u.length-1].v;
    };
  }
  return typeof a.buitenGem === "number" ? (() => a.buitenGem) : null;
}
/* Newton-afkoeling met variërende buitentemperatuur: dT/dt = −(T − T_buiten(t)) / τ.
   Voor een gegeven τ simuleren we de binnentemperatuur vanaf de start (stapjes van 5 min) en
   vergelijken met alle gemeten punten; τ is de waarde met de kleinste kwadratische fout
   (gulden-snede-zoektocht op log τ tussen 2 en 5000 uur). Met alleen start + eind en een vast
   buitengemiddelde komt dit exact uit op de klassieke formule τ = −Δt / ln(...). */
function simulateCool(points, outAt, tau){
  const step = 5 * 60000; let T = points[0].T, ts = points[0].ts; const pred = [];
  for(let i = 1; i < points.length; i++){
    while(ts < points[i].ts){ const dt = Math.min(step, points[i].ts - ts); const out = outAt(ts + dt/2); T = out + (T - out) * Math.exp(-(dt/3600000) / tau); ts += dt; }
    pred.push(T);
  }
  return pred;
}
function fitTau(points, outAt){
  const obs = points.slice(1).map(p => p.T);
  const sse = tau => simulateCool(points, outAt, tau).reduce((acc, v, i) => acc + (v - obs[i]) ** 2, 0);
  let lo = Math.log(2), hi = Math.log(5000);
  const g = (Math.sqrt(5) - 1) / 2;
  let c = hi - g*(hi-lo), d = lo + g*(hi-lo), fc = sse(Math.exp(c)), fd = sse(Math.exp(d));
  for(let k = 0; k < 60; k++){
    if(fc < fd){ hi = d; d = c; fd = fc; c = hi - g*(hi-lo); fc = sse(Math.exp(c)); }
    else { lo = c; c = d; fc = fd; d = lo + g*(hi-lo); fd = sse(Math.exp(d)); }
  }
  const tau = Math.exp((lo + hi) / 2);
  const rms = Math.sqrt(sse(tau) / obs.length);
  return { tau, rms, atBound: tau > 4900 || tau < 2.1 };
}
function coolCalc(a){
  if(!coolComplete(a) || coolEndTs(a) > Date.now()) return { status:"running" };
  const dtH = (coolEndTs(a) - coolStartTs(a)) / 3600000;
  const drop = a.startBinnen - a.eindBinnen;
  const outAt = coolOutFn(a);
  const out = typeof a.buitenGem === "number" ? a.buitenGem : null;
  const mids = coolIntermediates(a);
  const res = { status:"ok", dtH, drop, dropPerH: drop / dtH, out, tau:null, small:false, nPoints: 2 + mids.length, mids: mids.length, rise:false, rough:false, heated:false };
  // Stond er tijdens de test (zelfde ruimte) toch verwarming of koeling aan volgens "Alle metingen"?
  const sT = coolStartTs(a), eT = coolEndTs(a), room = coolRuimte(a);
  res.heated = state.metingen.some(m => { const ts = tsOf(m), md = klimaatOf(m).mode; return ts > sT && ts < eT && (m.ruimte || "").toLowerCase() === room && (md === "verwarmen" || md === "koelen" || md === "gemengd"); });
  if(!outAt){ res.status = "noout"; return res; }
  const points = [{ ts: coolStartTs(a), T: a.startBinnen }].concat(mids.map(m => ({ ts: tsOf(m), T: m.binnen }))).concat([{ ts: coolEndTs(a), T: a.eindBinnen }]);
  // Stijging tussendoor = waarschijnlijk toch verwarmd, zon of een open deur: test onbetrouwbaar.
  for(let i = 1; i < points.length; i++) if(points[i].T - points[i-1].T > 0.3) res.rise = true;
  const d0 = a.startBinnen - outAt(points[0].ts);
  res.small = d0 < 3;
  if(points.some(p => p.T - outAt(p.ts) <= 0)){ res.status = "invalid"; return res; }
  if(drop <= 0){ res.status = "nodrop"; return res; }
  const fit = fitTau(points, outAt);
  if(fit.atBound && fit.tau > 4900){ res.status = "nodrop"; return res; }
  res.tau = fit.tau; res.rms = fit.rms;
  res.rough = points.length > 2 && fit.rms > 0.4;

}
function coolPhase(a){ return null; }
function fmtH(n){ if(n === null || n === undefined || !isFinite(n)) return "—"; return n.toLocaleString(state.lang==="en"?"en-GB":"nl-NL", { maximumFractionDigits: n >= 100 ? 0 : 1 }); }
function sortedCool(){ return state.afkoeltests.slice().sort((x,y) => coolStartTs(x) - coolStartTs(y)); }
function coolTauText(a, c){
  if(c.status === "running") return `<span class="phase">${t("coolRunning")}</span>`;
  if(c.status === "noout") return `<span class="muted" title="${escapeHtml(t("coolNeedOut"))}">?</span>`;

}
/* Afkoeltests herkennen in "Alle metingen": een meting met alles uit tussen 18:00 en 02:00 (start),
   gevolgd door metingen in dezelfde ruimte die allemaal alles-uit zijn, tot een meting tussen 04:00
   en 10:00 (eind), 4–16 uur later, met een lagere binnentemperatuur. Een meting mét verwarming of
   koeling (of onbekend) ertussen breekt de reeks. Niet voorgesteld als hij overlapt met een
   bestaande test of eerder genegeerd is. */
function coolCandidates(){
  const dismissed = new Set(state.afkoelGenegeerd || []);
  const byRoom = {};
  sortedMetingen(state.metingen).forEach(m => { const r = (m.ruimte || "").toLowerCase(); (byRoom[r] = byRoom[r] || []).push(m); });
  const hourOf = m => Number((m.tijd || "12:00").split(":")[0]);
  const isStartH = h => h >= 18 || h < 2, isEndH = h => h >= 4 && h < 10;
  const out = [];
  Object.values(byRoom).forEach(list => {
    for(let i = 0; i < list.length; i++){
      const s = list[i];
      if(klimaatOf(s).mode !== "vrij" || !s.tijd || !isStartH(hourOf(s))) continue;
      let best = null;
      for(let j = i + 1; j < list.length; j++){
        const e = list[j], dtH = (tsOf(e) - tsOf(s)) / 3600000;
        if(dtH > 16) break;
        if(klimaatOf(e).mode !== "vrij") break;
        if(e.tijd && isEndH(hourOf(e)) && dtH >= 4 && e.binnen < s.binnen) best = { e, j };
      }
      if(!best) continue;
      const key = s.id + "|" + best.e.id;
      if(dismissed.has(key)) continue;
      const sT = tsOf(s), eT = tsOf(best.e);
      if(state.afkoeltests.some(a => validISODate(a.startDatum) && coolStartTs(a) < eT && (coolComplete(a) ? coolEndTs(a) : coolStartTs(a) + 12*3600000) > sT)) continue;
      out.push({ key, s, e: best.e, mids: best.j - i - 1 });

}
